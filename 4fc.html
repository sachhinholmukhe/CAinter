<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 4 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

<script>
const DECK = [{"c": "Meaning", "t": "SA 500 · Evidence", "q": "Audit evidence is the information used by the auditor to:", "o": ["Prepare the financial statements to be reported on by him", "Assess the fee to be charged for the audit assignment", "Arrive at the conclusions on which the audit opinion is based", "Record the transactions in the books of the entity audited"], "a": 2, "e": "It includes accounting records and other information that corroborates them."}, {"c": "Meaning", "t": "SA 500 · Evidence", "q": "Which is part of 'other information' that authenticates the accounting records?", "o": ["Minutes of meetings and confirmations from debtors", "Worksheets and reconciliations of the entity", "Journal entries and ledgers of the entity", "Invoices and contracts of the entity"], "a": 0, "e": "Records: invoices, ledgers, journals, reconciliations; other info: minutes, confirmations, control manuals."}, {"c": "Meaning", "t": "SA 500 · Evidence", "q": "The relationship between audit evidence and the opinion is that the opinion:", "o": ["Is independent of the evidence gathered", "Is determined by the audit fee agreed", "Is based on management's representation alone", "Is only as strong as the evidence behind it"], "a": 3, "e": "Gather evidence → evaluate it → form the opinion."}, {"c": "Types", "t": "SA 500 · Evidence", "q": "Watching the inventory count is evidence that is:", "o": ["External", "Visual", "Documentary", "Oral"], "a": 1, "e": "Visual = direct observation; oral = inquiries; documentary = records."}, {"c": "Types", "t": "SA 500 · Evidence", "q": "Replies to inquiries from management and staff are:", "o": ["Documentary evidence", "Visual evidence", "Oral evidence", "External evidence"], "a": 2, "e": "Oral evidence from discussions."}, {"c": "Types", "t": "SA 500 · Evidence", "q": "Which evidence is generally MORE reliable?", "o": ["A bank statement obtained directly from the bank", "A schedule prepared by the client's accountant", "A memo prepared by the finance manager", "A sales report generated by the in-house system"], "a": 0, "e": "External evidence originates outside the entity."}, {"c": "Types", "t": "SA 500 · Evidence", "q": "Most evidence the auditor examines is internal and under the client's control, so the auditor should:", "o": ["Accept it as reliable since it is the client's own record", "Corroborate it with external evidence wherever possible", "Use it only for the tests of transactions", "Ignore it in favour of the management's explanations"], "a": 1, "e": "Stay alert to manipulation or falsification."}, {"c": "Relevance", "t": "SA 500 · Evidence", "q": "Evidence on the existence of inventory is not necessarily relevant to its:", "o": ["Quantity", "Location", "Occurrence", "Valuation"], "a": 3, "e": "Evidence for one assertion may not cover another."}, {"c": "Relevance", "t": "SA 500 · Evidence", "q": "Relevance of evidence refers to its:", "o": ["Ease of obtaining it from the entity", "Logical connection with the assertion or procedure", "Trustworthiness in terms of source and nature", "Quantity needed to support the conclusion"], "a": 1, "e": "Reliability = trustworthiness; relevance = logical connection."}, {"c": "Reliability", "t": "SA 500 · Evidence", "q": "Which statement on reliability of evidence is correct?", "o": ["Indirect evidence is more reliable than direct evidence", "Oral evidence is more reliable than documentary evidence", "Documentary evidence is more reliable than oral evidence", "Photocopies are more reliable than original documents"], "a": 2, "e": "Five generalisations: external, controls, direct, documentary, original."}, {"c": "Reliability", "t": "SA 500 · Evidence", "q": "Internally generated evidence is more reliable when:", "o": ["The entity's volume of data is low", "The entity's staff are experienced", "The entity's size is large", "The entity's controls are effective"], "a": 3, "e": "Effective controls increase the reliability of internal evidence."}, {"c": "Reliability", "t": "SA 500 · Evidence", "q": "Which is MOST reliable?", "o": ["Evidence the auditor obtains himself by observation", "Evidence obtained from a facsimile of a document", "Evidence obtained by inquiry of the management", "Evidence obtained from a photocopy of a document"], "a": 0, "e": "Direct evidence beats indirect evidence such as inquiry."}, {"c": "Sufficiency", "t": "SA 500 · Evidence", "q": "Sufficiency of audit evidence is a measure of its:", "o": ["Quantity", "Quality", "Reliability", "Relevance"], "a": 0, "e": "Sufficiency = quantity; appropriateness = quality (relevance + reliability)."}, {"c": "Sufficiency", "t": "SA 500 · Evidence", "q": "Appropriateness of audit evidence is a measure of its:", "o": ["Availability — ease of obtaining", "Quality — relevance and reliability", "Quantity — volume and extent", "Simplicity — ease of understanding"], "a": 1, "e": "Not simplicity, not ease of obtaining."}, {"c": "Sufficiency", "t": "SA 500 · Evidence", "q": "The quantity of evidence required is greater when:", "o": ["The population to be tested is smaller and homogeneous", "The assessed risk of material misstatement is lower", "The assessed risk of material misstatement is higher", "The quality of the evidence available is higher"], "a": 2, "e": "Higher risk needs more evidence; higher quality needs less."}, {"c": "Sufficiency", "t": "SA 500 · Evidence", "q": "Which does NOT increase the amount of evidence needed?", "o": ["A larger and more diverse population", "A more material assertion", "A higher risk of material misstatement", "A more homogeneous population of items"], "a": 3, "e": "Size and characteristics of the population affect sufficiency."}, {"c": "Sufficiency", "t": "SA 500 · Evidence", "q": "A team member says sufficiency means simplicity and appropriateness means ease of obtaining. This is:", "o": ["Correct — they relate to cost and time respectively", "Incorrect — they relate to risk and materiality respectively", "Incorrect — they relate to quantity and quality respectively", "Correct — they relate to simplicity and ease respectively"], "a": 2, "e": "SA 500 anchors: quantity and quality."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "The seven procedures for obtaining audit evidence are:", "o": ["Inspection, sampling, confirmation, recalculation, reperformance, analytical procedures, inquiry", "Inspection, observation, confirmation, recalculation, reperformance, analytical procedures, inquiry", "Inspection, observation, confirmation, recalculation, review, analytical procedures, inquiry", "Inspection, observation, vouching, verification, reperformance, analytical procedures, inquiry"], "a": 1, "e": "Inspectors Observe, Confirm, Recalculate, Reperform, Analyse &amp; Inquire."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "Examining a contract or physically inspecting an asset is:", "o": ["Reperformance", "Observation", "Recalculation", "Inspection"], "a": 3, "e": "Inspection of records, documents or tangible assets."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "Inspecting an asset provides reliable evidence of its existence but not necessarily of its:", "o": ["Ownership and valuation", "Quantity and identity", "Location and condition", "Description and use"], "a": 0, "e": "Inspection may not prove rights or value."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "Watching the entity's staff perform the inventory count is:", "o": ["Reperformance", "Observation", "Inspection", "Confirmation"], "a": 1, "e": "Observation is limited to the moment at which it takes place."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "A direct written response from a third party confirming a bank balance is:", "o": ["Inquiry", "Inspection", "Reperformance", "External confirmation"], "a": 3, "e": "Confirmation is a direct written response."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "Re-totalling the sales ledger to check its arithmetic is:", "o": ["Recalculation", "Inspection", "Reperformance", "Observation"], "a": 0, "e": "Recalculation checks mathematical accuracy."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "Independently redoing a bank reconciliation done by the entity is:", "o": ["Inquiry", "Recalculation", "Reperformance", "Inspection"], "a": 2, "e": "Reperformance re-executes a control or procedure."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "Inquiry alone, especially oral inquiry, is:", "o": ["Sufficient evidence only when corroborated by the management", "Not sufficient evidence of control effectiveness or absence of misstatement", "Sufficient evidence of absence of misstatement if made in writing", "Sufficient evidence of control effectiveness if made of senior staff"], "a": 1, "e": "It must be corroborated by other procedures."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "Evaluating plausible relationships among financial and non-financial data is:", "o": ["Inspection", "Reperformance", "Recalculation", "Analytical procedures"], "a": 3, "e": "Ratio and trend analysis."}, {"c": "Procedures", "t": "Procedures &amp; Assertions", "q": "Substantive procedures consist of:", "o": ["Tests of details and substantive analytical procedures", "Risk assessment and analytical procedures", "Tests of controls and risk assessment procedures", "Tests of controls and tests of details"], "a": 0, "e": "Tests of details = vouching of transactions + verification of balances."}, {"c": "Assertions", "t": "Procedures &amp; Assertions", "q": "Which is an assertion about CLASSES OF TRANSACTIONS and events?", "o": ["Valuation and allocation", "Rights and obligations", "Cut-off", "Existence"], "a": 2, "e": "Transactions: occurrence, completeness, accuracy, cut-off, classification."}, {"c": "Assertions", "t": "Procedures &amp; Assertions", "q": "Which is an assertion about ACCOUNT BALANCES at period-end?", "o": ["Occurrence", "Accuracy", "Cut-off", "Rights and obligations"], "a": 3, "e": "Balances: existence, rights &amp; obligations, completeness, valuation &amp; allocation."}, {"c": "Assertions", "t": "Procedures &amp; Assertions", "q": "Assertion that recorded sales actually took place relates to:", "o": ["Occurrence", "Cut-off", "Classification", "Completeness"], "a": 0, "e": "Occurrence — transactions recorded have occurred and pertain to the entity."}, {"c": "Assertions", "t": "Procedures &amp; Assertions", "q": "Assertion that all sales are recorded and none is omitted relates to:", "o": ["Occurrence", "Completeness", "Existence", "Accuracy"], "a": 1, "e": "Completeness — nothing omitted."}, {"c": "Assertions", "t": "Procedures &amp; Assertions", "q": "Assertion that transactions are recorded in the correct accounting period is:", "o": ["Occurrence", "Accuracy", "Cut-off", "Classification"], "a": 2, "e": "Cut-off for the right period."}, {"c": "Assertions", "t": "Procedures &amp; Assertions", "q": "Assertion that the entity holds or controls the rights to assets and owes the liabilities is:", "o": ["Rights and obligations", "Completeness", "Valuation and allocation", "Existence"], "a": 0, "e": "A balance assertion."}, {"c": "Assertions", "t": "Procedures &amp; Assertions", "q": "'Every Real Company Values' stands for the balance assertions:", "o": ["Evaluation, Rights &amp; obligations, Classification, Valuation", "Existence, Realisation, Completeness, Verification", "Existence, Rights &amp; obligations, Completeness, Valuation &amp; allocation", "Existence, Recording, Cut-off, Valuation &amp; allocation"], "a": 2, "e": "E-R-C-V."}, {"c": "Assertions", "t": "Procedures &amp; Assertions", "q": "Assertions are best described as:", "o": ["Evidence from the third parties, explicit or implicit, on the FS", "Procedures by the auditor, explicit or implicit, on the FS", "Conclusions of the auditor, explicit or implicit, on the FS", "Representations by management, explicit or implicit, in the FS"], "a": 3, "e": "Auditors test against management's assertions."}, {"c": "Audit trail", "t": "Procedures &amp; Assertions", "q": "An audit trail is:", "o": ["A schedule of the evidence obtained from third parties", "A documented sequence tracing a transaction from source to the FS", "A summary of the auditor's findings from the substantive tests", "A list of the controls designed by management over transactions"], "a": 1, "e": "It establishes authenticity and integrity, and supports fraud prevention."}, {"c": "Information used", "t": "Information &amp; Selection", "q": "Information produced by the entity is used as audit evidence only after the auditor:", "o": ["Compares it with the information of the last year's audit", "Receives management's assurance on its accuracy and details", "Tests it on a hundred percent basis in every such case", "Evaluates its accuracy, completeness, precision and detail"], "a": 3, "e": "The auditor assesses reliability for the audit objective."}, {"c": "Information used", "t": "Information &amp; Selection", "q": "Which factor does NOT affect procedures on information from a management's expert?", "o": ["Management's influence over the expert", "The fee charged by the expert", "Whether the expert is employed or engaged by management", "The nature and complexity of the matter"], "a": 1, "e": "Also RMM, scope of work, technical standards, controls and the auditor's own knowledge."}, {"c": "Information used", "t": "Information &amp; Selection", "q": "When relying on a management's expert, the auditor evaluates the expert's:", "o": ["Competence, capabilities and objectivity", "Size, ownership and turnover", "Seniority, age and years of service", "Fees, location and reputation"], "a": 0, "e": "Also understand the expert's methods and assumptions."}, {"c": "Selection", "t": "Information &amp; Selection", "q": "Selecting 100% of the items for examination is more common in:", "o": ["Risk assessment procedures for small populations", "Tests of controls where reliance on the controls is high", "Tests of details where completeness and accuracy are vital", "Substantive analytical procedures for large populations"], "a": 2, "e": "It is rare for tests of controls."}, {"c": "Selection", "t": "Information &amp; Selection", "q": "Targeted testing of high-value or high-risk items is called:", "o": ["Stratification", "Selecting specific items", "Selecting all items", "Audit sampling"], "a": 1, "e": "Specific items selection."}, {"c": "Selection", "t": "Information &amp; Selection", "q": "Evidence from different sources is inconsistent. The auditor should:", "o": ["Modify or add procedures and consider the impact on the audit", "Accept the evidence from the more convenient source", "Ignore the inconsistency if the amount is small in size", "Seek a management representation as the sole remedy"], "a": 0, "e": "Document the matter under SA 230 where it affects a significant conclusion."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "The external auditor may use the internal audit function by:", "o": ["Direct assistance, delegation of opinion and sharing of fees", "Information gathering, use of its work and delegation of opinion", "Information gathering, use of its work and direct assistance", "Use of its work, joint signing and sharing of fees"], "a": 2, "e": "Three ways: gather information, use work as partial evidence, take direct assistance."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "Whatever reliance is placed on internal audit, the responsibility for the audit opinion rests:", "o": ["Jointly with the internal auditor", "Jointly with the management", "Solely with the audit committee", "Solely with the external auditor"], "a": 3, "e": "It cannot be delegated."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "The three tests to evaluate the internal audit function are:", "o": ["Integrity, cost and flexible and analytical approach", "Independence, competence and flexible and analytical approach", "Objectivity, competence and systematic and disciplined approach", "Objectivity, cost and systematic and disciplined approach"], "a": 2, "e": "O-C-S: fail any one and the work cannot be used."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "Reporting to the audit committee, rather than operational management, supports the internal auditor's:", "o": ["Systematic approach", "Technical proficiency", "Competence", "Objectivity"], "a": 3, "e": "Organisational status is a test of objectivity."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "Adequate resources, training and technical proficiency of internal auditors relate to:", "o": ["Competence", "Objectivity", "Independence", "Systematic approach"], "a": 0, "e": "Competence includes knowledge of financial reporting."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "Documented procedures, work programmes and quality control of internal audit relate to:", "o": ["Objectivity", "A systematic and disciplined approach", "Competence", "Organisational status"], "a": 1, "e": "Systematic approach test."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "Direct assistance from internal auditors CANNOT be used if:", "o": ["The internal auditors are few, or the entity is a large one", "The work is routine, or the audit committee does not agree", "The assignment is short, or the fees available are limited", "The law prohibits it, or objectivity or competence is lacking"], "a": 3, "e": "Law, objectivity threat or inadequate competence block direct assistance."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "Which task can internal auditors in direct assistance NOT perform?", "o": ["Recalculation of schedules under the auditor's direction", "Significant judgments on higher-risk areas", "Confirmation of balances under the auditor's direction", "Test counts under the auditor's supervision"], "a": 1, "e": "They must not make significant judgments or decisions reserved for the external auditor."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "Before using direct assistance, the auditor obtains written confirmation from:", "o": ["An authorised representative and the internal auditors", "The Registrar of Companies and the internal auditors", "The audit committee and the Registrar of Companies", "The shareholders and the management of the company"], "a": 0, "e": "Management agrees internal auditors follow the external auditor's instructions; internal auditors agree on confidentiality and disclosure of threats."}, {"c": "SA 610", "t": "SA 610 · Internal Audit", "q": "IFC differs from ICFR in that IFC is:", "o": ["The narrower term covering only the reporting of the FS", "The term restricted to listed companies and banks", "The broader term covering reporting, operations, compliance and fraud", "The same term used for the auditor's opinion on the controls"], "a": 2, "e": "ICFR is the subset specifically about financial statements."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Audit sampling means applying procedures to:", "o": ["A few high-value items so that only those are checked", "Less than 100% of items chosen by the management for the auditor", "100% of items so that every item is checked once", "Less than 100% of items so that every item has a chance of selection"], "a": 3, "e": "The sample must be representative to project conclusions."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Which is NOT a requirement of a population in sampling?", "o": ["Reliability of the underlying data", "Appropriateness for the objective", "Convenience", "Completeness for the whole period"], "a": 2, "e": "Appropriateness, completeness, reliability."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Statistical sampling uses:", "o": ["Judgment selection and probability theory to measure control risk", "Random selection and probability theory to measure sampling risk", "Random selection and experience to measure detection risk", "Judgment selection and experience to measure sampling risk"], "a": 1, "e": "Non-statistical sampling relies on the auditor's judgment."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "A feature of non-statistical sampling is:", "o": ["Relies on judgment, simpler, but with a higher risk of bias", "Relies on judgment, objective, and with a lower risk of bias", "Relies on probability, objective, and with a lower risk of bias", "Relies on probability, simpler, but with a higher risk of bias"], "a": 0, "e": "It is suited to smaller audits."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "In tests of controls, a higher tolerable rate of deviation results in:", "o": ["A smaller sample size", "A 100% sample size", "A larger sample size", "No change in the sample size"], "a": 0, "e": "'Tolerable' moves the sample size the opposite way."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "In tests of controls, a higher expected rate of deviation results in:", "o": ["A haphazard sample", "No change in the sample size", "A larger sample size", "A smaller sample size"], "a": 2, "e": "'Expected' moves the sample size the same way."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "In tests of details, a higher tolerable misstatement results in:", "o": ["A larger sample size", "No change in the sample size", "A block sample", "A smaller sample size"], "a": 3, "e": "More tolerable → smaller sample."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "In tests of details, stratification generally results in:", "o": ["A larger sample size", "A smaller sample size", "No change in the sample size", "A systematic sample"], "a": 1, "e": "Stratification improves efficiency."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "For a large population, the effect of population size on the sample size is:", "o": ["Little", "Exponential", "Proportionate", "Inverse"], "a": 0, "e": "Little effect for large populations."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Higher reliance on other substantive procedures aimed at the same assertion leads to a:", "o": ["Larger sample in tests of controls", "Smaller sample in tests of controls", "Larger sample in tests of details", "Smaller sample in tests of details"], "a": 3, "e": "'Alternative' procedures reduce the sample."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "In 'TAP-RE', the factors relate to:", "o": ["Substantive analytical procedures", "Tests of controls", "Risk assessment procedures", "Tests of details"], "a": 1, "e": "TAP-RE for controls; RATES-P RL for details."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Selecting every n-th item after a random start is:", "o": ["Simple random sampling", "Stratified sampling", "Systematic sampling", "Block sampling"], "a": 2, "e": "Interval = population ÷ sample size."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Splitting receivables into value bands and sampling each band is:", "o": ["Block sampling", "Haphazard sampling", "Stratified random sampling", "Systematic sampling"], "a": 2, "e": "Take a higher percentage from high-value strata."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Sampling in which larger items are more likely to be chosen is:", "o": ["Systematic sampling", "Haphazard sampling", "Block sampling", "Monetary unit sampling"], "a": 3, "e": "Selection weighted by value."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Which sampling methods are NOT appropriate for statistical sampling?", "o": ["Haphazard and block", "Stratified and monetary unit", "Simple random and systematic", "Random and stratified"], "a": 0, "e": "Haphazard avoids conscious bias but is not statistical."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "Selecting a contiguous group of items, rarely used, is:", "o": ["Systematic sampling", "Block sampling", "Stratified sampling", "Haphazard sampling"], "a": 1, "e": "It risks missing varied characteristics."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "The maximum misstatement the auditor will accept in a test of details is:", "o": ["Tolerable rate of deviation", "Tolerable misstatement", "Expected misstatement", "Anomaly"], "a": 1, "e": "Tolerable rate of deviation relates to controls."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "An auditor selects samples on personal experience and they prove unrepresentative. He is:", "o": ["Not responsible — experience-based samples are allowed always", "Not responsible — the population was not a complete one", "Responsible — but only if the sample was a statistical one", "Responsible — the sample must be representative by any method"], "a": 3, "e": "SA 530: representativeness is mandatory."}, {"c": "SA 530", "t": "SA 530 · Sampling", "q": "In a test of details, sample misstatements are:", "o": ["Projected to the population", "Ignored if the amounts are small", "Reported only to the management", "Corrected only in the sample"], "a": 0, "e": "The projected misstatement is evaluated against tolerable misstatement."}, {"c": "Inventory", "t": "SA 501 · Specific Items", "q": "If inventory is material, the auditor should attend the physical count to obtain evidence of its:", "o": ["Cost and net realisable value", "Obsolescence and ageing", "Existence and condition", "Valuation and ownership"], "a": 2, "e": "SA 501: existence and condition."}, {"c": "Inventory", "t": "SA 501 · Specific Items", "q": "The count date is different from the year-end date. The auditor should:", "o": ["Withdraw from the audit of inventory altogether", "Adjust the count to the year-end by estimation alone", "Rely on the management's count without any further work", "Perform procedures on the movements between the two dates"], "a": 3, "e": "Additional procedures on movements are needed."}, {"c": "Inventory", "t": "SA 501 · Specific Items", "q": "Attendance at the physical count is impractical. The auditor should:", "o": ["Disclaim an opinion on the FS without any alternative work", "Postpone the audit work until the next count date arrives", "Perform alternative procedures; modify opinion if insufficient", "Rely on the management's certificate on the inventory held"], "a": 2, "e": "SA 501 with SA 705."}, {"c": "Inventory", "t": "SA 501 · Specific Items", "q": "For inventory held by job workers, which evidence is appropriate?", "o": ["Confirmation of quantity and ownership, with a certificate", "Confirmation of quantity and condition, with inspection", "Confirmation of price and quality, with a valuation", "Confirmation of condition and cost, with a re-count"], "a": 1, "e": "Omega Exports Ltd. case."}, {"c": "Litigation", "t": "SA 501 · Specific Items", "q": "To identify litigation and claims, the auditor should:", "o": ["Inquire of management and counsel, and review minutes and legal expenses", "Inquire of the staff and unions, and review the payroll register", "Inquire of the regulators and bankers, and review the stock records", "Inquire of the lenders and customers, and review the sales ledger"], "a": 0, "e": "Also review correspondence with external legal counsel."}, {"c": "Litigation", "t": "SA 501 · Specific Items", "q": "Where an RMM relating to litigation exists, the auditor should:", "o": ["Communicate directly with external counsel by a letter of inquiry", "Rely on the management's representation letter alone", "Rely on news reports and publicly available data alone", "Rely on the in-house counsel's oral confirmation alone"], "a": 0, "e": "Letter of inquiry."}, {"c": "Litigation", "t": "SA 501 · Specific Items", "q": "Management refuses the auditor permission to communicate with external counsel, and no alternative evidence is available. The auditor should:", "o": ["Issue an unmodified opinion with an Emphasis of Matter", "Consider modifying the opinion under SA 705", "Resign without informing the governance", "Ignore the refusal if the amounts are small"], "a": 1, "e": "Refusal or inadequate replies → modification of the opinion."}, {"c": "Segment", "t": "SA 501 · Specific Items", "q": "In auditing segment information, the auditor:", "o": ["Rejects the segments disclosed by the management itself", "Relies on the segment auditors alone for the evidence", "Tests management's methods and does analytical procedures", "Gives a separate opinion on each segment of the entity"], "a": 2, "e": "The auditor opines on the FS as a whole."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "An external confirmation is audit evidence obtained as:", "o": ["A copy of the ledger statement supplied by the entity", "A representation from the entity's management", "A schedule prepared by the entity's accountant", "A direct written response from a third party"], "a": 3, "e": "Paper or electronic."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "A positive confirmation request asks the party to:", "o": ["Respond only if it is asked again", "Respond only if it disagrees", "Respond only if it agrees", "Respond in all cases"], "a": 3, "e": "Negative: only if disagrees."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "A negative confirmation request asks the party to:", "o": ["Respond only if it disagrees", "Respond in all cases", "Respond within seven days", "Respond only if it agrees"], "a": 0, "e": "No reply is assumed agreement, which is weaker evidence."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "Negative confirmations can be the sole substantive procedure only if:", "o": ["RMM is high, the balances are small and many, and exceptions are expected to be very few", "RMM is low, the balances are large and few, and exceptions are expected to be many", "RMM is low, the balances are small and many, and exceptions are expected to be very few", "RMM is high, the balances are large and few, and exceptions are expected to be many"], "a": 2, "e": "All the conditions must be met."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "A response showing a difference from the entity's records is a(n):", "o": ["Deviation", "Exception", "Non-response", "Anomaly"], "a": 1, "e": "Investigate the reason."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "Failure to respond to a positive request is a:", "o": ["Deviation", "Misstatement", "Non-response", "Exception"], "a": 2, "e": "Perform alternative procedures."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "The auditor maintains control over the confirmation process by:", "o": ["Having management send the requests and collect the replies", "Having the internal auditors receive the replies by email", "Having the client choose the parties to be confirmed", "Designing, sending and receiving the requests and responses directly"], "a": 3, "e": "Delegation undermines reliability."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "CA Jignesh had internal audit send the confirmations and receive replies by email. This is:", "o": ["Proper — the internal audit is independent of the management", "Not proper — the auditor must control the confirmation process", "Proper — the delegation saves the audit time and cost", "Not proper — the replies should come through the management"], "a": 1, "e": "SA 505 Illustration 21."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "Management refuses to allow a confirmation request. The auditor's FIRST response is to:", "o": ["Inquire into the reasons and assess their validity", "Issue a modified opinion on the receivables", "Accept the refusal and rely on the management's assurance", "Report the refusal to the Registrar of Companies"], "a": 0, "e": "Then re-evaluate RMM, do alternative procedures, and communicate with TCWG if unreasonable."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "Alternative procedures for receivables when confirmation is refused include:", "o": ["Subsequent salary payments and attendance records", "Subsequent tax payments and filing records", "Subsequent cash receipts and shipping documents", "Subsequent disbursements and goods-received notes"], "a": 2, "e": "Payables: subsequent disbursements, supplier correspondence, GRNs."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "If a refusal is unreasonable or alternatives are insufficient, the auditor communicates with TCWG under:", "o": ["SA 260 and considers the effect on the opinion under SA 705", "SA 265 and considers the effect on the opinion under SA 706", "SA 230 and considers the effect on the opinion under SA 701", "SA 580 and considers the effect on the opinion under SA 710"], "a": 0, "e": "SA 260 communication; SA 705 modification."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "The CFO refuses confirmation of one receivable due to a genuine sub-judice dispute near settlement; no fraud risk indicators exist. The refusal is:", "o": ["Unjustifiable — the auditor must modify the opinion", "Justifiable — the auditor documents and performs alternative procedures", "Unjustifiable — the auditor must withdraw from the engagement", "Justifiable — the auditor need not perform any other procedure"], "a": 1, "e": "A genuine legal dispute can be a valid reason."}, {"c": "SA 505", "t": "SA 505 · Confirmations", "q": "A receivable is asked to confirm directly that it owes ₹1,23,000, and replies. This is a:", "o": ["Blank confirmation", "Oral confirmation", "Negative confirmation", "Positive confirmation"], "a": 3, "e": "The party responds in all cases."}, {"c": "SA 510", "t": "SA 510 · Opening Balances", "q": "An 'initial audit engagement' is one in which the prior-period FS were:", "o": ["Unaudited or audited by a predecessor auditor", "Prepared by an external expert for the entity", "Audited by the same auditor as the current year", "Audited by the internal auditor of the entity"], "a": 0, "e": "Opening balances are the issue."}, {"c": "SA 510", "t": "SA 510 · Opening Balances", "q": "The auditor's objectives for opening balances are to obtain evidence that they are:", "o": ["Free from material misstatement and agreed by management", "Free from any misstatement and consistent in tax treatment", "Free from any misstatement and approved by the predecessor", "Free from material misstatement and consistent in policy application"], "a": 3, "e": "Also changes in policy properly accounted for and disclosed."}, {"c": "SA 510", "t": "SA 510 · Opening Balances", "q": "A predecessor auditor audited the prior period. The current auditor's procedures on opening balances are:", "o": ["Not required", "Still required", "Required only if the opinion was modified", "Required only for inventory"], "a": 1, "e": "'Someone else audited it' is no substitute."}, {"c": "SA 510", "t": "SA 510 · Opening Balances", "q": "Which is a procedure on opening balances?", "o": ["Rely on the predecessor's report without any further reading", "Ignore the accounting policies of the prior period", "Verify that closing balances were correctly carried forward", "Review only the current-year balances of the entity"], "a": 2, "e": "Also read the prior audited FS and the predecessor's report."}, {"c": "SA 510", "t": "SA 510 · Opening Balances", "q": "Inability to obtain evidence on opening balances leads to a:", "o": ["Unmodified opinion with EOM", "Adverse opinion only", "Qualified opinion or disclaimer", "Unmodified opinion with Other Matter"], "a": 2, "e": "A misstatement affecting the current period → qualified/adverse."}, {"c": "SA 510", "t": "SA 510 · Opening Balances", "q": "Policies not applied consistently, or changes not disclosed, lead to a:", "o": ["Qualified or adverse opinion", "Unmodified opinion", "Disclaimer of opinion", "Emphasis of Matter only"], "a": 0, "e": "SA 705 link."}, {"c": "SA 550", "t": "SA 550 · Related Parties", "q": "Under SA 550, 'control' is the power to:", "o": ["Approve the budgets and the dividends of an entity", "Appoint the auditors and fix their remuneration", "Participate in the financial and operating policies of an entity", "Govern the financial and operating policies of an entity"], "a": 3, "e": "Significant influence = participate without controlling."}, {"c": "SA 550", "t": "SA 550 · Related Parties", "q": "Significant influence is the power to:", "o": ["Appoint all the directors of the entity concerned", "Participate in policy decisions without controlling them", "Approve the annual report of the entity concerned", "Govern policy decisions to the benefit of the whole group"], "a": 1, "e": "Control = govern."}, {"c": "SA 550", "t": "SA 550 · Related Parties", "q": "State-controlled entities are related parties only if they:", "o": ["Operate in the same sector", "Transact significantly with each other", "Have common directors on the boards", "Share the same auditor"], "a": 1, "e": "SA 550 exception for state-controlled entities."}, {"c": "SA 550", "t": "SA 550 · Related Parties", "q": "Which related party transactions carry a higher RMM?", "o": ["Small ones with low values and regular frequency", "Routine ones with arm's-length terms and full transparency", "Old ones with the same terms and similar parties", "Complex ones with non-arm's-length terms or lack of transparency"], "a": 3, "e": "Dominant influence is a fraud risk consideration."}, {"c": "SA 550", "t": "SA 550 · Related Parties", "q": "A special purpose entity may be a related party if:", "o": ["It is set up in the same state as the entity", "It is audited by the same auditor as the entity", "It is controlled in substance by the entity", "It deals with the same lenders as the entity"], "a": 2, "e": "Substance over form."}, {"c": "SA 550", "t": "SA 550 · Related Parties", "q": "To identify related parties, the auditor may review:", "o": ["Tax returns, shareholder registers and conflict-of-interest statements", "Bank statements, customer lists and sales invoices of the year", "Fixed asset registers, stock cards and gate passes of the year", "Payroll registers, attendance records and leave files of staff"], "a": 0, "e": "Also key-management contracts and internal audit reports."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "Analytical procedures are evaluations of financial information through analysis of:", "o": ["Contractual relationships among the entity and third parties", "Plausible relationships among financial and non-financial data", "Documentary relationships among accounting and legal records", "Statistical relationships among the sample and population values"], "a": 1, "e": "Including investigating significant deviations."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "Total wages = wages per worker × number of workers is an example of relating:", "o": ["Financial data with non-financial data", "Non-financial data with non-financial data", "Budget data with actual data", "Financial data with financial data"], "a": 0, "e": "GHI Ltd. example."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "At the planning stage, analytical procedures are used to:", "o": ["Form an overall conclusion on the FS as a whole", "Gather substantive evidence on the balances reported", "Test the operating effectiveness of the controls", "Understand the business and identify risk areas"], "a": 3, "e": "Planning: risk assessment; testing: substantive; completion: overall conclusion."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "At the completion stage, analytical procedures help to:", "o": ["Identify the risk areas to be covered in the audit programme", "Select the samples for the substantive tests of details", "Form an overall conclusion on consistency of the FS", "Establish the terms of the engagement with the client"], "a": 2, "e": "Overall review."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "Which is a technique of analytical procedures?", "o": ["Vouching and verification", "Inspection and observation", "Trend analysis and ratio analysis", "Stratification and block selection"], "a": 2, "e": "Also reasonableness tests and structural modelling (regression)."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "Occupancy × rate ≈ rental income is an example of:", "o": ["A trend analysis", "A ratio analysis", "A structural model", "A reasonableness test"], "a": 3, "e": "Uses non-financial data."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "Data used in analytical procedures is more reliable when:", "o": ["It is from a management budget that is an aspirational one", "It is from an independent source and controls are effective", "It is from an internal source that is not comparable", "It is from an earlier year that is not relevant now"], "a": 1, "e": "Realistic budgets beat aspirational ones."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "For an assertion with high inherent risk or a significant risk, analytical procedures alone are:", "o": ["Usually not enough; detailed tests are also needed", "Always enough since they are cost-effective", "Enough only for the income statement items", "Enough only if the data is audited"], "a": 0, "e": "Effectiveness depends on predictability."}, {"c": "SA 520", "t": "SA 520 · Analytical", "q": "Rent of ₹50,000 per month matches the agreement, but peers pay ₹10,000. Which procedure reveals the anomaly?", "o": ["Confirmation from the landlord", "Inspection of the rent agreement", "Recalculation of the rent paid", "Analytical comparison with peers"], "a": 3, "e": "Detailed checks confirm 'as recorded'; analytical procedures test 'as reasonable'."}, {"c": "Scenario", "t": "Scenarios", "q": "The auditor of a company with a weak reporting line of internal audit and high RMM wants to rely on internal audit work. He should:", "o": ["Limit reliance and perform additional procedures", "Rely extensively as the work is by experts", "Share the responsibility with the internal auditor", "Rely wholly and reduce the audit procedures"], "a": 0, "e": "Weak reporting line compromises objectivity."}, {"c": "Scenario", "t": "Scenarios", "q": "An automated control charging 12% interest on overdue accounts failed due to a glitch. This is:", "o": ["An inherent limitation not worth reporting at all", "A control deficiency affecting financial reporting", "A detection risk of the auditor in the audit", "A matter relating to the audit sampling done"], "a": 1, "e": "Report it and recommend corrective action."}, {"c": "Scenario", "t": "Scenarios", "q": "Reconciliation and physical verification of PPE records are done as stipulated. The auditor's assurance on PPE evidence:", "o": ["Increases, as the controls replace substantive tests entirely", "Remains unchanged, as the controls are irrelevant to evidence", "Increases, as effective controls raise reliability of internal evidence", "Falls, as internal evidence is always less reliable in nature"], "a": 2, "e": "SA 330."}, {"c": "Scenario", "t": "Scenarios", "q": "Oral inquiries of the head accountant about monthly bank reconciliations:", "o": ["Prove the controls were well designed alone", "Prove the reconciliations had no differences", "Do not alone prove the controls operated effectively", "Prove the controls operated effectively all year"], "a": 2, "e": "They need corroboration by inspecting the reconciliations."}, {"c": "Scenario", "t": "Scenarios", "q": "A team member thinks internal evidence is more reliable as it comes from the entity itself. This is:", "o": ["Correct — internal evidence is more complete", "Correct — internal evidence is more readily obtained", "Incorrect — internal evidence is never reliable", "Incorrect — external evidence is generally more reliable"], "a": 3, "e": "Internal evidence is under the client's control."}];

const LAB=['A','B','C','D'];
let cur='All', order=[], pos=0;
const answered=new Array(DECK.length).fill(null);
const $=id=>document.getElementById(id);
const stage=$('stage'),navwrap=$('navwrap'),elProg=$('prog'),elCount=$('count'),elScore=$('score'),
      btnPrev=$('prev'),btnNext=$('next'),btnReveal=$('reveal'),chipsEl=$('chips');
function build(shuf){
  order=[];DECK.forEach((c,i)=>{if(cur==='All'||c.t===cur)order.push(i);});
  if(shuf){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;
}
function drawChips(){
  const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
