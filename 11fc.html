<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 11 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

const DECK = [{"c": "Meaning", "t": "Fundamental Principles", "q": "Ethics refers to:", "o": ["Moral principles guiding a person's behaviour and actions", "Technical standards prescribed for auditing practice", "Disciplinary procedures applied to the erring members", "Statutory rules enforced by the courts on professionals"], "a": 0, "e": "Ethics is the set of moral principles that guide what is right and wrong in a person's conduct."}, {"c": "Principles", "t": "Fundamental Principles", "q": "Which is NOT a fundamental principle of professional ethics?", "o": ["Objectivity", "Independence", "Confidentiality", "Integrity"], "a": 1, "e": "Five: integrity, objectivity, competence &amp; due care, confidentiality, professional behaviour."}, {"c": "Principles", "t": "Fundamental Principles", "q": "Being straightforward and honest in all professional dealings is:", "o": ["Professional behaviour", "Confidentiality", "Integrity", "Objectivity"], "a": 2, "e": "Integrity means being straightforward and honest, and not being associated with false or misleading information."}, {"c": "Principles", "t": "Fundamental Principles", "q": "Not letting bias, conflict of interest or undue influence override professional judgment is:", "o": ["Integrity", "Confidentiality", "Professional competence", "Objectivity"], "a": 3, "e": "Objectivity means bias, conflicts of interest or undue influence must not override professional judgment."}, {"c": "Principles", "t": "Fundamental Principles", "q": "Keeping knowledge up to date and performing duties thoroughly and in a timely manner is:", "o": ["Objectivity", "Professional competence and due care", "Professional behaviour", "Integrity"], "a": 1, "e": "Competence and due care require up-to-date knowledge and careful, thorough, timely work."}, {"c": "Principles", "t": "Fundamental Principles", "q": "Complying with laws and avoiding conduct that discredits the profession is:", "o": ["Professional behaviour", "Confidentiality", "Professional competence", "Integrity"], "a": 0, "e": "Professional behaviour means complying with laws and avoiding conduct that discredits the profession."}, {"c": "Principles", "t": "Fundamental Principles", "q": "Confidentiality may be overridden when disclosure is:", "o": ["Requested by the client's competitors for commercial purposes", "Preferred by the auditor for the sake of the audit firm's growth", "Required by law, or there is a professional duty or right to disclose", "Suggested by a colleague who is in the same audit firm as him"], "a": 2, "e": "Confidentiality may be overridden only where law requires, law permits with consent, or there is a professional duty or right to disclose."}, {"c": "Principles", "t": "Fundamental Principles", "q": "Which is NOT a situation where confidentiality may be overridden?", "o": ["Where there is a professional duty or right to disclose", "Where disclosure is required by law", "Where law permits disclosure with client consent", "To benefit another client of the firm in a similar dispute"], "a": 3, "e": "Using one client's information to benefit another is a breach of confidentiality, not an exception."}, {"c": "Independence", "t": "Independence &amp; Threats", "q": "Independence of mind allows the auditor to express an opinion without being affected by:", "o": ["Influences that compromise professional judgment", "Fees that are charged for the audit engagement", "Laws that are applicable to the audit engagement", "Staff that are assigned for the audit engagement"], "a": 0, "e": "Independence of mind is the state of mind that lets the auditor give an opinion free of pressures that compromise judgment."}, {"c": "Independence", "t": "Independence &amp; Threats", "q": "Independence in appearance is about avoiding situations where:", "o": ["A reasonable and informed investor may doubt the auditor's tenure or experience", "A reasonable and informed regulator may doubt the auditor's size or location", "A reasonable and informed client may doubt the auditor's fees or timeliness", "A reasonable and informed third party may doubt the auditor's integrity or objectivity"], "a": 3, "e": "Independence in appearance asks whether a reasonable and informed third party would doubt the auditor's integrity or objectivity."}, {"c": "Independence", "t": "Independence &amp; Threats", "q": "For an auditor, independence must be:", "o": ["Apparent, with the genuineness being of no concern", "Legal, with the state of mind being of no concern", "Genuine and also appear genuine to others", "Genuine, with the appearance being of no concern"], "a": 2, "e": "Independence must exist in fact and also appear to exist, because users rely on both."}, {"c": "Independence", "t": "Independence &amp; Threats", "q": "Independence is best described as:", "o": ["A matter of the audit fee, beyond the character", "A state of mind and personal character, beyond rules", "A matter of the firm size, beyond the personal view", "A set of legal rules, beyond the state of mind"], "a": 1, "e": "Independence is a state of mind and character, not just compliance with rules."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Holding a direct financial interest in the audit client is a:", "o": ["Advocacy threat", "Familiarity threat", "Self-interest threat", "Self-review threat"], "a": 2, "e": "A direct financial interest gives the auditor a personal stake in the client, which is a self-interest threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Over-reliance on fees from a single client is a:", "o": ["Intimidation threat", "Advocacy threat", "Familiarity threat", "Self-interest threat"], "a": 3, "e": "Heavy dependence on one client's fees creates fear of losing it, a self-interest threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Contingent fees tied to audit outcomes give rise to a:", "o": ["Self-interest threat", "Advocacy threat", "Intimidation threat", "Self-review threat"], "a": 0, "e": "Contingent fees tied to the audit outcome give the auditor a stake in the result, a self-interest threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "An auditor reviewing work he did as a director of the client earlier faces a:", "o": ["Familiarity threat", "Self-review threat", "Self-interest threat", "Advocacy threat"], "a": 1, "e": "Reviewing his own earlier work as a director means he audits his own decisions, a self-review threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Providing internal audit services to the same client that is then audited is a:", "o": ["Intimidation threat", "Self-review threat", "Advocacy threat", "Familiarity threat"], "a": 1, "e": "Internal audit work later subject to audit means reviewing one's own work, a self-review threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Promoting or defending the client's interests in legal disputes is an:", "o": ["Self-review threat", "Intimidation threat", "Self-interest threat", "Advocacy threat"], "a": 3, "e": "Defending the client in disputes means promoting its position, which is an advocacy threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Dealing in the shares of the audit client is an example of an:", "o": ["Advocacy threat", "Self-review threat", "Familiarity threat", "Intimidation threat"], "a": 0, "e": "Dealing in the client's shares promotes its interests and shows a stake, an advocacy threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "A close relative of a team member holding a senior role at the client is a:", "o": ["Self-review threat", "Advocacy threat", "Familiarity threat", "Intimidation threat"], "a": 2, "e": "A close relative in a senior client role creates too close a relationship, a familiarity threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Receiving significant gifts or hospitality from the client is a:", "o": ["Self-review threat", "Intimidation threat", "Self-interest threat", "Familiarity threat"], "a": 3, "e": "Significant gifts and hospitality build closeness that can reduce objectivity, a familiarity threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Pressure to reduce audit work because of lower fees is an:", "o": ["Self-interest threat", "Intimidation threat", "Familiarity threat", "Advocacy threat"], "a": 1, "e": "Pressure to do less work because of lower fees is intimidation: it pushes the auditor against his judgment."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Threat of replacement over a disagreement on accounting is an:", "o": ["Self-review threat", "Familiarity threat", "Intimidation threat", "Advocacy threat"], "a": 2, "e": "A threat of replacement over a disagreement is pressure, i.e. an intimidation threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "A loan from the audit client to the auditor is a:", "o": ["Self-interest threat", "Intimidation threat", "Advocacy threat", "Self-review threat"], "a": 0, "e": "A loan from the client gives the auditor a financial interest in it, a self-interest threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "A former partner of the firm now working with the client is a:", "o": ["Intimidation threat", "Familiarity threat", "Self-interest threat", "Advocacy threat"], "a": 1, "e": "A former partner now at the client brings a close past relationship, a familiarity threat."}, {"c": "Threats", "t": "Independence &amp; Threats", "q": "Which is NOT one of the five threats to independence?", "o": ["Compliance threat", "Advocacy threat", "Intimidation threat", "Self-interest threat"], "a": 0, "e": "The five threats are self-interest, self-review, advocacy, familiarity and intimidation; compliance is not one."}, {"c": "Safeguards", "t": "Safeguards &amp; Skepticism", "q": "The decision ladder when a threat is identified is:", "o": ["Avoid, apply safeguards, continue, and otherwise eliminate", "Eliminate, apply safeguards, continue, and otherwise avoid", "Avoid, eliminate, apply safeguards, and otherwise decline", "Apply safeguards, avoid, eliminate, and otherwise continue"], "a": 2, "e": "First avoid the work, then eliminate the threat, then apply safeguards to an acceptable level, and decline if even that fails."}, {"c": "Safeguards", "t": "Safeguards &amp; Skepticism", "q": "When safeguards are applied to reduce a threat, the auditor should:", "o": ["Apply them only after the audit report has been signed", "Communicate them to the client without keeping any record", "Apply them only if the client agrees to the proposed ones", "Document them as proof of adherence to ethical standards"], "a": 3, "e": "Safeguards should be documented as proof that ethical requirements were followed."}, {"c": "Safeguards", "t": "Safeguards &amp; Skepticism", "q": "If effective safeguards cannot be applied, the auditor should:", "o": ["Accept the work with a disclosure", "Not accept the work", "Accept with a higher fee", "Accept with an additional team"], "a": 1, "e": "If effective safeguards cannot be applied, the threat remains, so the auditor should not accept the work."}, {"c": "Skepticism", "t": "Safeguards &amp; Skepticism", "q": "Professional skepticism is an attitude involving:", "o": ["A trusting mind and general acceptance of management evidence", "A neutral mind and general reliance on past experience", "A suspicious mind and general rejection of management evidence", "A questioning mind and critical assessment of audit evidence"], "a": 3, "e": "Skepticism means a questioning mind and critical assessment of audit evidence."}, {"c": "Skepticism", "t": "Safeguards &amp; Skepticism", "q": "Past experience of management's honesty:", "o": ["Reduces the need to question to the minimum extent required", "Replaces the need to evaluate the evidence in the later years", "Does not eliminate the need to question and evaluate evidence", "Eliminates the need to question and evaluate the evidence"], "a": 2, "e": "Trust in management is not an audit procedure; belief in honesty does not remove the need to test."}, {"c": "Skepticism", "t": "Safeguards &amp; Skepticism", "q": "Alertness to evidence includes noting evidence that:", "o": ["Conflicts with other evidence, or questions reliability of documents", "Matches management views, or confirms reliability of responses", "Repeats prior year findings, or confirms reliability of controls", "Supports other evidence, or confirms reliability of documents"], "a": 0, "e": "Evidence that conflicts with other evidence, or doubts on documents, signals the need for more work."}, {"c": "Skepticism", "t": "Safeguards &amp; Skepticism", "q": "A single fraud-prone document supporting a significant amount calls for:", "o": ["Less testing", "Closer scrutiny", "Greater reliance", "Prior approval"], "a": 1, "e": "A single document that is easy to falsify, supporting a large amount, needs closer scrutiny."}, {"c": "Skepticism", "t": "Safeguards &amp; Skepticism", "q": "Professional skepticism helps the auditor to avoid:", "o": ["Communication when reporting to the governance", "Documentation when preparing the working papers", "Overgeneralisation when drawing conclusions", "Verification when gathering the evidence"], "a": 2, "e": "Skepticism stops the auditor from overlooking unusual circumstances and from overgeneralising from limited evidence."}, {"c": "SA 210", "t": "SA 210 · Terms of Engagement", "q": "SA 210 deals with:", "o": ["Quality control for an audit of FS", "Communication with governance", "Audit documentation", "Agreeing the terms of audit engagements"], "a": 3, "e": "SA 210 deals with agreeing the terms of audit engagements, including the preconditions."}, {"c": "Preconditions", "t": "SA 210 · Terms of Engagement", "q": "The preconditions for an audit are an acceptable financial reporting framework and:", "o": ["Management's agreement to the premise on which an audit is conducted", "The regulator's permission for the scope on which an audit is ": "Change of Terms &amp; Recurring", "q": "The auditor should not agree to a change in the terms of the engagement unless there is:", "o": ["A higher fee", "A client request", "A partner's approval", "A reasonable justification"], "a": 3, "e": "A change in terms needs a reasonable justification, otherwise it may be to hide a problem."}, {"c": "Change", "t": "Change of Terms &amp; Recurring", "q": "Which is a reasonable justification for a change in the terms?", "o": ["A wish to hide the insufficiency of audit evidence", "A wish to avoid a qualified opinion on the report", "A wish to reduce the audit work and the fee payable", "A change in circumstances affecting the entity's needs"], "a": 3, "e": "A change in circumstances that affects the entity's needs is a genuine reason for changing terms."}, {"c": "Change", "t": "Change of Terms &amp; Recurring", "q": "Changing from audit to review to avoid a qualified opinion due to insufficient evidence is:", "o": ["Not justified", "Optional", "Justified", "Mandatory"], "a": 0, "e": "Moving to a review to avoid a qualified opinion due to missing evidence only hides the problem and is not justified."}, {"c": "Change", "t": "Change of Terms &amp; Recurring", "q": "If a change to a lower level of assurance is agreed, the final report:", "o": ["Reflects both engagements and refers to the audit procedures", "Reflects the new engagement but refers to the original audit", "Reflects the new engagement and does not refer to the original audit", "Reflects the old engagement and refers to the original audit"], "a": 2, "e": "The report on the new engagement must not refer to the original audit."}, {"c": "Change", "t": "Change of Terms &amp; Recurring", "q": "If the change in terms cannot be agreed, the auditor:", "o": ["Withdraws and does not report to any other person or authority", "Withdraws where permitted, and considers reporting to the parties concerned", "Continues with a review and does not refer to the audit work", "Continues the original audit and adds a paragraph in his report"], "a": 1, "e": "If the change cannot be agreed, the auditor withdraws where allowed and considers reporting to governance, owners or regulators."}, {"c": "Recurring", "t": "Change of Terms &amp; Recurring", "q": "In recurring audits, the auditor should:", "o": ["Issue a revised letter only if the audit fee has been changed", "Rely on the original letter for the entire tenure of the audit", "Obtain a new engagement letter every year without any review", "Periodically review the terms and remind the entity of them"], "a": 3, "e": "In recurring audits, the terms are reviewed periodically and the entity is reminded of them."}, {"c": "Recurring", "t": "Change of Terms &amp; Recurring", "q": "Which calls for a revision or reminder of terms in recurring audits?", "o": ["A significant change in senior management or ownership", "A routine change in the audit staff of the firm", "A usual change in the venue of the audit work", "A normal rise in the quantum of the audit fee"], "a": 0, "e": "A significant change in senior management or ownership may call for revised terms or a reminder."}, {"c": "Recurring", "t": "Change of Terms &amp; Recurring", "q": "Which does NOT call for a revision of terms in a recurring audit?", "o": ["A change in the financial reporting framework", "A change in the audit staff assigned by the firm", "A new or changed legal or regulatory requirement", "A significant change in the nature or size of business"], "a": 1, "e": "Changes in audit staff are internal to the firm and do not affect the terms with the client."}, {"c": "Quality", "t": "SQC 1 · SA 220", "q": "SQC 1 applies to:", "o": ["Public sector audits, covering banks alone", "A single audit engagement, covering one audit", "The entire firm, covering all engagements", "Listed entities, covering their audit alone"], "a": 2, "e": "SQC 1 vs SA 220."}, {"c": "Quality", "t": "SQC 1 · SA 220", "q": "SA 220 focuses on quality control within:", "o": ["The ICAI", "The entire audit firm", "The audit committee", "An individual audit engagement"], "a": 3, "e": "SA 220 applies quality control to an individual audit engagement."}, {"c": "Quality", "t": "SQC 1 · SA 220", "q": "The six elements of SQC 1 are leadership, ethical requirements, acceptance and continuance, human resources, engagement performance and:", "o": ["Planning", "Staffing", "Monitoring", "Reporting"], "a": 2, "e": "SQC 1 has six elements: leadership, ethical requirements, acceptance and continuance, human resources, engagement performance and monitoring."}, {"c": "Quality", "t": "SQC 1 · SA 220", "q": "Promoting an internal culture of quality, led by managing partners, is the element of:", "o": ["Monitoring", "Leadership responsibilities for quality", "Ethical requirements", "Human resources"], "a": 1, "e": "Leadership responsibilities promote a quality culture led by managing partners."}, {"c": "Quality", "t": "SQC 1 · SA 220", "q": "Obtaining annual written confirmations of independence from personnel is part of:", "o": ["Ethical requirements", "Monitoring", "Human resources", "Engagement performance"], "a": 0, "e": "Annual written confirmations of independence belong to ethical requirements."}, {"c": "Quality", "t": "SQC 1 · SA 220", "q": "Assessing client integrity, firm's competence and resources before accepting a client is:", "o": ["Human resources policies of the firm and its staff", "Acceptance and continuance of client relationships", "Engagement performance standards for the audit team", "Leadership responsibilities for quality in the firm"], "a": 1, "e": "Assessing client integrity and the firm's competence before taking on a client is the acceptance and continuance element."}, {"c": "Quality", "t": "SQC 1 · SA 220", "q": "Recruitment, training, performance evaluation and compensation fall under:", "o": ["Human resources", "Leadership", "Monitoring", "Ethical requirements"], "a": 0, "e": "Recruitment, training, appraisal and pay are part hould:", "o": ["Record it in the file and continue the audit on the original terms", "Report it to the regulator and continue the audit on the terms", "Report it within the firm and decide the action, including withdrawal", "Report it to the client and continue the audit on the terms"], "a": 2, "e": "The partner reports unmitigated threats to the firm and decides action, including withdrawal where legally allowed."}, {"c": "Scenario", "t": "Scenarios", "q": "CA Raghav certified plant cost at ₹9 crore against ₹15 crore per records to save fees for the client. This breaches:", "o": ["Competence", "Integrity", "Confidentiality", "Objectivity"], "a": 1, "e": "Knowingly issuing a certificate with a false figure breaches integrity."}, {"c": "Scenario", "t": "Scenarios", "q": "CA Sameer became the nominee of the substantial shares of the audit client. The threat and the course of action are:", "o": ["Self-review threat; retain the shares and appoint a second auditor", "Familiarity threat; retain the shares and obtain the consent of the client", "Advocacy threat; retain the shares and disclose them in the audit report", "Self-interest threat; sell the shares before accepting the appointment"], "a": 3, "e": "Holding valuable shares of the client is a financial interest and so a self-interest threat; selling them before acceptance removes it."}, {"c": "Scenario", "t": "Scenarios", "q": "CA Vikram relied solely on the management representation letter about tax matters under appeal. This shows:", "o": ["Lack of professional skepticism", "Lack of confidentiality", "Lack of independence", "Lack of integrity"], "a": 0, "e": "Relying only on a representation letter, without testing, shows no professional skepticism."}, {"c": "Scenario", "t": "Scenarios", "q": "In the tax-appeal case, the additional procedures could include:", "o": ["Reviewing correspondence with the suppliers and purchase orders", "Reviewing correspondence with the customers and sales invoices", "Reviewing correspondence with tax authorities and legal opinions", "Reviewing correspondence with the bankers and valuation reports"], "a": 2, "e": "Correspondence with tax authorities and legal opinions give independent evidence on the tax matter under appeal."}, {"c": "Scenario", "t": "Scenarios", "q": "Management of XYZ Enterprises refuses to acknowledge its responsibilities in writing. The auditor should:", "o": ["Accept the engagement and rely on an oral acknowledgment", "Accept the engagement and disclaim the opinion at the end", "Not accept the engagement, unless required by law", "Accept the engagement and qualify the report at the end"], "a": 2, "e": "Management's written acknowledgement is a precondition; without it the auditor should decline."}, {"c": "Scenario", "t": "Scenarios", "q": "CA Neha finds that NIA and ED are investigating a prospective client for terror funding. She should:", "o": ["Accept the engagement with an Emphasis of Matter in the report", "Accept the engagement after obtaining a management representation", "Accept the engagement with a higher fee for the audit risk", "Not accept the engagement, as client integrity is doubtful"], "a": 3, "e": "Criminal investigations into terror funding are serious red flags on client integrity, so the engagement should be declined."}, {"c": "Scenario", "t": "Scenarios", "q": "A firm proposes to accept fin-tech audits without the capability for them. It should:", "o": ["Accept and rely on the client's IT staff for the audit work", "Not accept until it develops competence and resources", "Accept and learn the technology while performing the audit", "Accept and charge a higher fee to cover the learning cost"], "a": 1, "e": "SA 220 requires the firm to have the competence and resources before accepting an engagement."}, {"c": "Scenario", "t": "Scenarios", "q": "A client requests a last-minute downgrade from audit to review because evidence for inventory is missing. The auditor should:", "o": ["Refuse, as the change masks a   const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
</body>
