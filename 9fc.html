embers at the annual general meeting", "The police authority in the written complaint", "The Registrar by a special report"], "a": 3, "e": "Serious irregularities such as profiteering are reported to the Registrar by a special report."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "The draft audit report of a co-operative society is discussed with:", "o": ["The members before the Registrar approves", "The managing committee before finalising", "The Registrar before the managing committee sees", "The bankers before the members meet"], "a": 1, "e": "Discussing the draft report with the managing committee lets minor points be resolved and policy matters explained."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "In rural co-operative societies, manipulation is prevented by examining members' passbooks and:", "o": ["Loan entries", "Share certificates", "Board minutes", "Bank statements"], "a": 0, "e": "Examining members' passbooks and loan entries prevents manipulation in rural societies."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "In the audit of a co-operative society, the auditor applies the principles of:", "o": ["Performance audit, avoiding delays and unplanned expenses", "Internal audit, avoiding losses and wasteful expenses", "Propriety audit, avoiding middlemen and uneconomic expenses", "Compliance audit, avoiding errors and incorrect expenses"], "a": 2, "e": "A co-operative auditor applies propriety audit, checking that expenses are economical and middlemen are avoided."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Multi-State Co-operative Societies are governed by the:", "o": ["Multi-State Co-operative Societies Act, 2002", "Co-operative Societies Act, 1912 and the state amendments", "Societies Registration Act, 1860 and the state amendments", "State Co-operative Societies Acts and the state rules"], "a": 0, "e": "Societies working in more than one State are governed by the Multi-State Co-operative Societies Act, 2002."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Under the Multi-State Co-operative Society Rules, books must record money received and spent with:", "o": ["The tax paid on the transactions", "The names of the members' families", "The auditor's remarks on the transactions", "The reasons for the transactions"], "a": 3, "e": "Books record all money received and spent, with the reasons for the transactions."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "In production or manufacturing societies, books also record details of:", "o": ["Dividend policy and bonus rates per the members' resolution", "Export orders and import licences per the Registrar's directions", "Material or labour utilisation and other costs per the bye-laws", "Marketing plans and sales targets per the board's decisions"], "a": 2, "e": "Production societies also record material or labour used and other costs as the bye-laws specify."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Only a Chartered Accountant can be appointed auditor of a multi-state co-operative society under:", "o": ["Section 70", "Section 72", "Section 73", "Section 77"], "a": 1, "e": "Section 72 allows only a Chartered Accountant to be auditor of a multi-state society."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Under Section 70, the first auditor of a multi-state society is appointed by the board within:", "o": ["One year of registration", "One month of registration", "Three months of registration", "Six months of registration"], "a": 1, "e": "Section 70 requires the board to appoint the first auditor within one month of registration."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Subsequent auditors of a multi-state society are appointed:", "o": ["By the Registrar, to hold office until removed", "At the first AGM, to hold office for life", "At each AGM, to hold office until the next AGM", "By the board, to hold office for five years"], "a": 2, "e": "After the first, auditors are appointed at each AGM and hold office until the next AGM."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Section 73 deals with:", "o": ["Inquiry by the Central Registrar", "Special audit by the Central Government", "Qualification of auditors", "Powers and duties of auditors"], "a": 3, "e": "Section 73 gives auditors the right of access to books and requires inquiries into loans, book entries, personal expenses and shares."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "The auditor's inquiry under Section 73 covers whether loans are properly secured and:", "o": ["Shares allotted for cash are backed by actual receipts", "Dividends declared in cash are backed by the audited profits", "Shares allotted for cash are backed by the board resolutions", "Donations received in cash are backed by the donors' letters"], "a": 0, "e": "Section 73 asks whether shares allotted for cash are backed by actual receipts, among other inquiries."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "A special audit of a multi-state society is ordered by the Central Government under:", "o": ["Section 78", "Section 77", "Section 72", "Section 79"], "a": 1, "e": "Section 77 allows the Central Government to order a special audit when management or finances look doubtful."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "The special audit report is sent directly to:", "o": ["The society's members", "The Central Registrar", "The society's board", "The Central Government"], "a": 3, "e": "In a special audit, the report goes directly to the Central Government."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Before an inquiry under Section 78, the society is given notice of:", "o": ["15 days", "7 days", "60 days", "30 days"], "a": 0, "e": "Section 78 requires 15 days' notice to the society before an inquiry."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Inspection of a multi-state society is under:", "o": ["Section 78", "Section 77", "Section 79", "Section 73"], "a": 2, "e": "Section 79 deals with inspection by the Central Registrar."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "Reports of inquiry and inspection are communicated to the society and relevant parties within:", "o": ["One month", "Twelve months", "Six months", "Three months"], "a": 3, "e": "Reports of inquiry and inspection are communicated within three months so that action can follow."}, {"c": "Multi-State", "t": "Co-operative Societies", "q": "An inquiry under Section 78 may be requested by a federal co-operative, creditors or:", "o": ["A single member of the society", "The auditor of the society", "A significant number of members", "The employees of the society"], "a": 2, "e": "An inquiry can be requested by a federal co-operative, creditors or a significant number of members."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "Public trusts are governed by the state Public Trust Act, or where none exists, by:", "o": ["The Indian Trusts Act, 1882", "The Income Tax Act, 1961", "The Societies Registration Act, 1860", "The Companies Act, 2013"], "a": 0, "e": "Where no state Public Trust Act exists, the Indian Trusts Act, 1882 governs public trusts."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "The three legal forms of a charitable entity are trust, society and:", "o": ["Limited liability partnership", "Section 8 company", "Partnership firm", "Co-operative society"], "a": 1, "e": "A charitable entity can be a trust, a society or a Section 8 company."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "Charitable trusts maintain a Cash Book, a Ledger, a Journal and:", "o": ["Estimates of expenses and projections of the donations", "Copies of letters and minutes of the trustees' meetings", "Serially numbered bills and receipts, and original bills for payments", "Loose-leaf notes of cash and verbal records of the trustees"], "a": 2, "e": "Trusts keep a cash book, ledger, journal, serially numbered bills and receipts and original bills for payments."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "Annually, a trust prepares a Balance Sheet and:", "o": ["A Fund Flow Statement only", "A Statement of Changes in Equity", "A Cash Flow Statement only", "An Income and Expenditure Statement"], "a": 3, "e": "A trust prepares a Balance Sheet and an Income and Expenditure Statement every year."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "In auditing a trust, the cash and vouchers held by the manager on the audit date should:", "o": ["Be lower than the accounts", "Agree with the accounts", "Be disclosed in the report only", "Exceed the accounts"], "a": 1, "e": "The cash and vouchers held by the manager on the audit date must agree with the books."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "Amounts outstanding for more than what period are specifically identified in a trust audit?", "o": ["One year", "Six months", "Three years", "Two years"], "a": 0, "e": "Amounts outstanding for more than one year are identified, since they raise doubts on recoverability."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "Cash donations to a trust must not exceed:", "o": ["The trustees' limit", "The donors' limit", "The prescribed limit", "The previous year's total"], "a": 2, "e": "Cash donations above the prescribed limit are not permitted, so the auditor checks compliance."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "Special matters in a trust audit are reported to:", "o": ["The Deputy/Assistant Charity Commissioner", "The Income Tax Commissioner of the area of the trust", "The Registrar of Companies in the state of registration", "The Reserve Bank of India through its regional office"], "a": 0, "e": "Matters of special concern are reported to the Deputy/Assistant Charity Commissioner who supervises public trusts."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "In a trust audit, the auditor verifies that trust property and funds are used:", "o": ["Freely for any charitable purpose", "Exclusively for the trust's objectives", "Mainly for the investment returns", "Partly for the trustees' benefit"], "a": 1, "e": "Trust property and funds must be used only for the trust's objectives."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "Which is NOT part of the trust audit checklist?", "o": ["Whether funds were invested contrary to the applicable Act", "Whether the minimum number of trustees is maintained", "Whether any trustee is a debtor or creditor of the trust", "Whether the trust has declared a dividend to its beneficiaries"], "a": 3, "e": "Others are checklist items."}, {"c": "Trusts", "t": "Trusts &amp; Societies", "q": "Audit working papers of a trust audit record the work performed, information received, decisions on audit points and:", "o": ["Staff rosters prepared and leave records of the audit team", "Tax advice given and returns filed on behalf of the trust", "Fee negotiations held and invoices raised to the trustees", "Judicial pronouncements relied upon and certificates from management"], "a": 3, "e": "Working papers record work done, explanations received, decisions on audit points, judicial pronouncements and certificates from management."}, {"c": "Societies", "t": "Trusts &amp; Societies", "q": "In auditing a society, the objectives are understood from the:", "o": ["Memorandum of association or bye-laws", "Partnership deed or agreement of partners", "Prospectus or offer document of the society", "Trust deed or will of the settlor"], "a": 0, "e": "The memorandum or bye-laws state the society's objectives, so they are read to understand its purpose."}, {"c": "Societies", "t": "Trusts &amp; Societies", "q": "A society receiving foreign contributions must have registration under:", "o": ["FEMA, 1999", "FCRA, 2010", "PMLA, 2002", "SEBI Act, 1992"], "a": 1, "e": "FCRA registration is mandatory for a society that receives foreign contributions."}, {"c": "Societies", "t": "Trusts &amp; Societies", "q": "For tax exemptions, a society should be registered under:", "o": ["The Partnership Act, 1932", "The Companies Act, 2013", "The Income Tax Act, 1961", "The Indian Trusts Act, 1882"], "a": 2, "e": "Registration under the Income Tax Act is needed to claim exemptions."}, {"c": "Societies", "t": "Trusts &amp; Societies", "q": "Inquiries by the Registrar into the society are considered for their implications for:", "o": ["The auditor's opinion", "The members' dividend", "The trustees' appointment", "The donors' tax benefits"], "a": 0, "e": "Registrar inquiries may reveal irregularities, so their implications for the opinion are considered."}, {"c": "Scenario", "t": "Scenarios", "q": "Under 'Consolidated Fund' in government audit, no money can be withdrawn except:", "o": ["As requested by the ministers", "As authorised by law", "As approved by the C&amp;AG", "As decided by the PAC"], "a": 1, "e": "No money can be withdrawn from the Consolidated Fund except as authorised by law, which is the basis of the C&amp;AG's audit."}, {"c": "Scenario", "t": "Scenarios", "q": "The Consolidated Fund consolidates revenue receipts and capital receipts such as:", "o": ["Salaries paid by the government and pensions disbursed", "Stores purchased by the government and inventory issued", "Loans taken by the government and repayments received", "Grants given by the government and subsidies disbursed"], "a": 2, "e": "The Consolidated Fund includes revenue receipts and capital receipts such as loans taken and repayments received."}, {"c": "Scenario", "t": "Scenarios", "q": "One partner retired and another joined the next day. The key audit step is to review:", "o": ["The bank statements for the movement of capital in the firm's accounts", "The tax returns for the change in the firm's assessment status", "The minutes of the meetings for the approval of the change in the firm", "The retirement and new partnership deeds for effective dates and profit sharing"], "a": 3, "e": "The deeds show the effective dates and profit-sharing terms, so profits before and after the change are distributed correctly."}, {"c": "Scenario", "t": "Scenarios", "q": "Post-retirement profits in the firm that admitted a new partner are distributed per:", "o": ["The terms of the old partnership deed", "The ratio of the closing capitals", "The terms of the new partnership deed", "The ratio of the opening capitals"], "a": 2, "e": "Profits after the retirement belong to the continuing partners and the new partner under the new deed."}, {"c": "Scenario", "t": "Scenarios", "q": "A society of nationwide bank employees pooling monthly savings and giving small loans is a:", "o": ["State Co-operative Society", "Public Charitable Trust", "Section 8 Company", "Multi-State Co-operative Society"], "a": 3, "e": "A society whose members are employees across several States, promoting savings and lending, is a multi-state co-operative society."}, {"c": "Scenario", "t": "Scenarios", "q": "The society in the bank-employees case must maintain books of receipts and expenditure and:", "o": ["Assets and liabilities", "Sales and purchases", "Fees and subscriptions", "Material and labour"], "a": 0, "e": "The society keeps books of receipts and expenditure, assets and liabilities as required by the Rules, 2002."}, {"c": "Scenario", "t": "Scenarios", "q": "An NGO receives foreign donations. The auditor should verify:", "o": ["Registration under SEBI and proper accounting and deposit of public funds", "Registration under FCRA and proper accounting and deposit of foreign contributions", "Registration under FEMA and proper accounting and deposit of foreign exchange", "Registration under RBI and proper accounting and deposit of bank deposits"], "a": 1, "e": "An NGO receiving foreign donations must have FCRA registration and deposit them in the designated account."}, {"c": "Scenario", "t": "Scenarios", "q": "A school's fee register shows advance fees received for next term. The auditor ensures they are:", "o": ["Transferred to the Capital Fund along with the admission fees", "Written off with the approval of the Managing Committee", "Carried forward as a liability and not credited as income of the year", "Credited to the income of the year for the sake of prudence"], "a": 2, "e": "Fees received for the next term are not income of this year, so they are carried forward as a liability."}, {"c": "Scenario", "t": "Scenarios", "q": "A cinema's tax collection does not match tickets issued for a class. The auditor should:", "o": ["Ignore the difference since the tax is a pass-through item", "Investigate the difference and check the monthly tax returns", "Accept the difference since the tax is paid by the audience", "Adjust the tickets issued to match the tax collected"], "a": 1, "e": "A mismatch between tax collected and tickets issued signals under-reporting, so it is investigated and the returns checked."}, {"c": "Scenario", "t": "Scenarios", "q": "A co-operative member holds 25% of the share capital. The auditor:", "o": ["Accepts it since the member pays the share price fully", "Treats it as a charitable contribution to the society", "Ignores it since the limit applies only to loans", "Reports the breach of the limit in the Act"], "a": 3, "e": "The limit is 20% of share capital, so a 25% holding is a breach that the auditor reports."}, {"c": "Scenario", "t": "Scenarios", "q": "A lessee's lease term covers the asset's entire economic life and the lessee can buy it cheaply. This is a:", "o": ["Finance lease; the lessee shows the asset in the balance sheet", "Operating lease; the lessor shows the asset in the balance sheet", "Operating lease; the lessee shows the asset in the balance sheet", "Finance lease; the lessor shows the asset in the balance sheet"], "a": 0, "e": "A lease covering the whole economic life with a cheap purchase option transfers ownership risks, so it is a finance lease shown in the lessee's balance sheet."}, {"c": "Scenario", "t": "Scenarios", "q": "A hotel's gross margin shows large unexplained discrepancies. The auditor may have to:", "o": ["Adjust the margin by estimate", "Disclaim the audit opinion immediately", "Qualify the audit report", "Ignore as transient hotel records"], "a": 2, "e": "Unexplained gross margin discrepancies can mean unrecorded sales, so the report may need to be qualified."}];

const LAB=['A','B','C','D'];
let cur='All', order=[], pos=0;
const answered=new Array(DECK.length).fill(null);
const $=id=>document.getElementById(id);
const stage=$('stage'),navwrap=$('navwrap'),elProg=$('prog'),elCount=$('count'),elScore=$('score'),
      btnPrev=$('prev'),btnNext=$('next'),btnReveal=$('reveal'),chipsEl=$('chips');
function build(shuf){
  order=[];DECK.forEach((c,i)=>{if(cur==='All'||c.t===cur)order.push(i);});
  if(shuf){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;
}
function drawChips(){
  const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
