<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 9 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

const DECK = [{"c": "Meaning", "t": "Government Audit (C&amp;AG)", "q": "Government audit mainly aims to ensure:", "o": ["Accountability for public funds and effectiveness of government operations", "Compliance with the Companies Act and the SEBI regulations", "Maximisation of profits for the government and reduction of taxes", "Detection of fraud in private entities and recovery of dues"], "a": 0, "e": "Examination of financial, administrative and operational activities."}, {"c": "Meaning", "t": "Government Audit (C&amp;AG)", "q": "Government audit has evolved from expenditure-focused audit to also cover:", "o": ["Receipts of the private companies and the stock exchanges", "Receipts, commercial enterprises and autonomous bodies", "Wages of the employees and the pensions of the retired staff", "Taxes of the individuals and the profits of the partnership firms"], "a": 1, "e": "Government audit began with expenditure and now also covers receipts, commercial enterprises and autonomous bodies."}, {"c": "Meaning", "t": "Government Audit (C&amp;AG)", "q": "Which is a key component of government audit?", "o": ["Preparation of the budget of the government", "Collection of taxes on behalf of the government", "Appraisal of government policies and administration", "Appointment of the ministers of the government"], "a": 2, "e": "Also: accounting for public funds, base for corrective actions, administrative accountability."}, {"c": "India", "t": "Government Audit (C&amp;AG)", "q": "All revenue, loans and repayments of the Union are credited to the Consolidated Fund of India under:", "o": ["Article 151", "Article 149", "Article 150", "Article 266"], "a": 3, "e": "Article 266 of the Constitution credits all revenues, loans raised and repayments of loans to the Consolidated Fund of India."}, {"c": "India", "t": "Government Audit (C&amp;AG)", "q": "The Public Accounts Committee scrutinises:", "o": ["The Salary scales and the Pension schemes", "The Appropriation Accounts and C&amp;AG reports", "The Tax proposals and the Customs duty rates", "The Budget estimates and the Finance Bill"], "a": 1, "e": "Legislative control over expenditure."}, {"c": "C&amp;AG", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG of India is appointed by:", "o": ["The Chief Justice of India", "The Prime Minister of India", "The Speaker of the Lok Sabha", "The President of India"], "a": 3, "e": "The C&amp;AG is appointed by the President of India, which keeps the office independent of the executive."}, {"c": "C&amp;AG", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG can be removed only on proven misbehaviour or incapacity, by a resolution of:", "o": ["Each House of Parliament with a 2/3 majority", "The Supreme Court with a 2/3 majority of judges", "The President on the advice of the Council of Ministers", "Each House of Parliament with a simple majority"], "a": 0, "e": "Like a Supreme Court judge."}, {"c": "C&amp;AG", "t": "Government Audit (C&amp;AG)", "q": "The salary of the C&amp;AG is equivalent to that of:", "o": ["The Cabinet Secretary", "The Attorney General", "A Supreme Court Judge", "A High Court Judge"], "a": 2, "e": "The 1971 Act gives the C&amp;AG a salary equal to a Supreme Court judge's, to protect independence."}, {"c": "C&amp;AG", "t": "Government Audit (C&amp;AG)", "q": "Salary and conditions of service of the C&amp;AG, once appointed, cannot be:", "o": ["Determined by Parliament", "Prescribed by the 1971 Act", "Altered to his advantage", "Altered to his disadvantage"], "a": 3, "e": "Salary and service conditions cannot be altered to his disadvantage after appointment, which protects independence."}, {"c": "C&amp;AG", "t": "Government Audit (C&amp;AG)", "q": "Article 150 of the Constitution deals with:", "o": ["Appointment and removal of the C&amp;AG of India", "Submission of the C&amp;AG's reports to the legislature", "Form in which accounts of Union and States are kept", "Duties and powers of the C&amp;AG of India"], "a": 2, "e": "Prescribed by the President on the advice of the C&amp;AG."}, {"c": "C&amp;AG", "t": "Government Audit (C&amp;AG)", "q": "Article 151 deals with:", "o": ["Form in which the accounts of the Union are to be kept", "Submission of the C&amp;AG's reports to the President or Governor", "Appointment and removal of the C&amp;AG on grounds of incapacity", "Duties and powers of the C&amp;AG relating to the accounts"], "a": 1, "e": "Laid before Parliament / State Legislature."}, {"c": "C&amp;AG", "t": "Government Audit (C&amp;AG)", "q": "Article 149 deals with:", "o": ["Duties and powers of the C&amp;AG relating to accounts of the Union and States", "Submission of reports of the C&amp;AG to the President and the Governor", "Salary and conditions of service of the C&amp;AG of India as per the Act", "Form of accounts of the Union and States on the advice of the C&amp;AG"], "a": 0, "e": "Article 149 gives the C&amp;AG his duties and powers for the accounts of the Union and States; Articles 150 and 151 deal with form of accounts and reports."}, {"c": "Duties", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG audits bodies substantially financed by the Consolidated Fund, i.e. grants or loans of:", "o": ["At least ₹25 lakh or at least 75% of total expenditure", "At least ₹50 lakh and at least 50% of total expenditure", "At least ₹25 lakh and at least 75% of total expenditure", "At least ₹10 lakh or at least 90% of total expenditure"], "a": 2, "e": "A body is 'substantially financed' when grants or loans are at least ₹25 lakh and at least 75% of its total expenditure; both conditions must be met."}, {"c": "Duties", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG compiles and submits to the President/Governor:", "o": ["Budget estimates showing annual taxes and borrowings", "Tax assessment records showing annual demands and arrears", "Cost audit reports showing annual output and consumption", "Appropriation accounts showing annual receipts and disbursements"], "a": 3, "e": "The C&amp;AG compiles the accounts of the Union and States and prepares appropriation accounts showing annual receipts and disbursements."}, {"c": "Duties", "t": "Government Audit (C&amp;AG)", "q": "Which is NOT a duty of the C&amp;AG?", "o": ["Audit of receipts payable into the Consolidated Fund", "Fixing the tax rates for the Union and the States", "Audit of expenditure from the Consolidated Fund", "Audit of stores and inventory accounts"], "a": 1, "e": "The C&amp;AG audits and reports on finances; tax rates are fixed by the legislature and the government."}, {"c": "Powers", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG may dispense with detailed audit and apply:", "o": ["Limited checks as deemed necessary", "Sample checks as directed by the PAC", "Complete checks as deemed possible", "Test checks as directed by the ministry"], "a": 0, "e": "The C&amp;AG may dispense with detailed audit and apply limited checks where this is sufficient for efficient auditing."}, {"c": "Powers", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG can inspect any accounts office under Union or State control and also:", "o": ["Call for the minutes of the cabinet meetings relevant to policy decisions", "Call for the personal records of the ministers relevant to the expenditure", "Call for accounts, books and papers relevant to transactions under audit", "Call for the tax returns of the citizens relevant to the revenue audit"], "a": 2, "e": "The C&amp;AG can inspect accounts offices and call for books, papers and documents relevant to the transactions under audit."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "Verifying that expenditure conforms to the Constitution, laws and rules is:", "o": ["Audit of sanctions", "Audit against rules and orders", "Propriety audit", "Performance audit"], "a": 1, "e": "Audit against rules and orders checks that expenditure conforms to the Constitution, laws and financial rules."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "Checking that each item has a proper sanction from a competent authority is:", "o": ["Audit of sanctions", "Audit against provision of funds", "Audit against rules and orders", "Propriety audit"], "a": 0, "e": "Sanction competent under law or delegation."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "Confirming that expenditure aligns with the purpose of appropriation and does not exceed it is:", "o": ["Audit of sanctions", "Audit against rules and orders", "Performance audit", "Audit against provision of funds"], "a": 3, "e": "Audit against provision of funds checks that spending is for the purpose appropriated and within the authorised amount."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "Examining whether expenditure is necessary and economical, even if it conforms to rules, is:", "o": ["Sanction audit", "Propriety audit", "Provision audit", "Compliance audit"], "a": 1, "e": "Should the money have been spent?"}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "Which is a principle of propriety audit?", "o": ["Every allowance should be linked to the profit earned by the office", "Every authority should spend the sanctioned amount fully by the year-end", "No authority should benefit personally from the expenditure it sanctions", "Every expenditure should conform to the rules and need no review"], "a": 2, "e": "Propriety audit checks wisdom and economy of spending; an authority must not benefit personally from expenditure it sanctions."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "The three Es of performance audit are:", "o": ["Efficiency, Economy and Effectiveness", "Economy, Equity and Effectiveness", "Effectiveness, Ethics and Enforcement", "Efficiency, Equity and Enforcement"], "a": 0, "e": "Performance audit extends audit to efficiency, economy and effectiveness (the three Es)."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "Whether schemes are executed economically and yield expected results is tested by:", "o": ["Economy audit", "Effectiveness audit", "Propriety audit", "Efficiency audit"], "a": 3, "e": "Efficiency audit asks whether schemes are executed economically and give the expected results."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "Whether resources are acquired economically and used effectively is tested by:", "o": ["Sanction audit", "Efficiency audit", "Effectiveness audit", "Economy audit"], "a": 3, "e": "Economy audit asks whether resources are acquired economically and used effectively."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "Performance of programmes against targeted objectives is tested by:", "o": ["Propriety audit", "Efficiency audit", "Effectiveness audit", "Economy audit"], "a": 2, "e": "Effectiveness audit compares the performance of programmes against their targeted objectives."}, {"c": "Expenditure audit", "t": "Government Audit (C&amp;AG)", "q": "The correct sequence of a performance audit is:", "o": ["Select topic, preliminary study, plan, execute, report", "Select topic, plan, execute, preliminary study, report", "Plan, select topic, preliminary study, report, execute", "Preliminary study, select topic, execute, plan, report"], "a": 0, "e": "A performance audit starts with topic selection and preliminary study, then planning, execution and reporting of findings."}, {"c": "Receipts", "t": "Government Audit (C&amp;AG)", "q": "In audit of receipts the emphasis is on:", "o": ["A review of the budgets, with the receipts examined by estimates", "A general review of systems, with specific cases examined by test checks", "An individual review of cases, with the systems examined by test checks", "A complete review of all assessments, with no test checks applied"], "a": 1, "e": "Audit of receipts is a general review of systems and procedures, with individual cases examined only by test checks."}, {"c": "Receipts", "t": "Government Audit (C&amp;AG)", "q": "The extent and quantum of audit of receipts is determined by:", "o": ["The Revenue Department", "The PAC", "The Finance Ministry", "The C&amp;AG"], "a": 3, "e": "Using test checks, random sampling and studies."}, {"c": "Receipts", "t": "Government Audit (C&amp;AG)", "q": "In audit of receipts, checks should exist to detect irregularities such as:", "o": ["Double refunds and forged vouchers", "Delayed payments and vacant posts", "Overdue loans and surplus stores", "Excess rebates and price revisions"], "a": 0, "e": "Checks must detect irregularities such as double refunds and forged vouchers, which cause revenue loss."}, {"c": "Stores", "t": "Government Audit (C&amp;AG)", "q": "Audit of stores and inventories verifies:", "o": ["Sanction, speed of dispatch and accuracy of the budgets", "Valuation, cost of storage and accuracy of the fee schedule", "Sanction, economy of purchases and accuracy of accounts", "Valuation, profit on sales and accuracy of tax returns"], "a": 2, "e": "Audit of stores checks that purchases are sanctioned and economical and that the accounts of receipts, issues and balances are accurate."}, {"c": "Stores", "t": "Government Audit (C&amp;AG)", "q": "Audit of stores notes excess or idle inventory by:", "o": ["Matching levels with the market price and the supplier list", "Matching levels with consumption norms and periodic checks", "Matching levels with the budget and the annual sales plan", "Matching levels with the staff strength and the office space"], "a": 1, "e": "Comparing holdings with consumption norms and periodic stock checks brings out excess or idle stock."}, {"c": "Commercial", "t": "Government Audit (C&amp;AG)", "q": "Government companies are audited by:", "o": ["The statutory auditors appointed by the members, with no role for the C&amp;AG", "Their own auditors appointed by the C&amp;AG, with supplementary test audit by C&amp;AG", "The C&amp;AG directly, with a supplementary review by the company's own auditors", "The Local Fund auditors appointed by the State, with a review by the PAC"], "a": 1, "e": "Government companies have their own auditors appointed by the C&amp;AG, who also conducts a supplementary test audit."}, {"c": "Commercial", "t": "Government Audit (C&amp;AG)", "q": "Statutory corporations have financial and accounts audits conducted by:", "o": ["The C&amp;AG, which may also compile their accounts", "The registrar, which may also compile their accounts", "The Parliament, which may also compile their accounts", "The Finance Ministry, which may also compile their accounts"], "a": 0, "e": "For statutory corporations the C&amp;AG conducts the financial and accounts audit and may also compile the accounts."}, {"c": "Commercial", "t": "Government Audit (C&amp;AG)", "q": "Departmental commercial undertakings are audited like:", "o": ["Any other cooperative society registered under the state law", "Any other government company incorporated under the Act of 2013", "Any other government department maintaining commercial accounts", "Any other statutory corporation constituted under a special Act"], "a": 2, "e": "Departmental undertakings are part of government, so they are audited like other departments that maintain commercial accounts."}, {"c": "Companies Act", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG appoints auditors for government companies and directs how the accounts are audited under:", "o": ["Section 139(1)", "Section 141(3)", "Section 143(6)", "Section 143(5)"], "a": 3, "e": "Section 143(5) empowers the C&amp;AG to appoint auditors of government companies and give directions on the audit."}, {"c": "Companies Act", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG's supplementary audit and comments on the audit report are under:", "o": ["Section 143(3)", "Section 143(6)", "Section 143(1)", "Section 143(5)"], "a": 1, "e": "Comments placed before the AGM."}, {"c": "Reporting", "t": "Government Audit (C&amp;AG)", "q": "The C&amp;AG's reports on the accounts of the Union are submitted to:", "o": ["The Speaker, to be laid before the Lok Sabha only", "The Finance Minister, to be laid before the PAC only", "The Prime Minister, to be laid before the Cabinet", "The President, to be laid before Parliament"], "a": 3, "e": "Under Article 151, reports on the Union accounts go to the President, who lays them before Parliament."}, {"c": "Reporting", "t": "Government Audit (C&amp;AG)", "q": "Recommendations on the C&amp;AG's reports are typically made by:", "o": ["The Public Accounts Committee", "The Supreme Court of India", "The President of India", "The Finance Ministry"], "a": 0, "e": "The C&amp;AG's reports are factual; the Public Accounts Committee examines them and makes the recommendations."}, {"c": "Types", "t": "Local Bodies", "q": "Which is an urban local authority?", "o": ["Panchayat Samiti, Zila Parishad or Gram Sabha at the village level", "Statutory Corporation, Regulatory Body or Authority under special Acts", "Municipal Corporation, Municipal Council or Cantonment Committee", "Cooperative Society, Trust or Registered Society under the state laws"], "a": 2, "e": "Urban local authorities include municipal corporations, municipal councils, notified area committees, town area committees and cantonment committees."}, {"c": "Types", "t": "Local Bodies", "q": "Cantonment Committees manage:", "o": ["Areas of the larger urban centres", "Areas of the notified industries", "Areas around military establishments", "Areas of the smaller town panchayats"], "a": 2, "e": "Cantonment committees administer areas around military establishments."}, {"c": "Revenue", "t": "Local Bodies", "q": "The major sources of municipal revenue are:", "o": ["Goods and services tax and excise", "Property taxes and octroi", "Corporation tax and wealth tax", "Income tax and customs duty"], "a": 1, "e": "Property tax and octroi are the major municipal revenue sources; others are profession tax, advertisement tax and tolls."}, {"c": "Revenue", "t": "Local Bodies", "q": "Grants compensating local bodies for revenue lost when the State takes over a tax are:", "o": ["Statutory and compensatory grants", "Capital grants", "General purpose grants", "Specific purpose grants"], "a": 0, "e": "Statutory and compensatory grants make up for revenue a local body loses when the State takes over a tax."}, {"c": "Revenue", "t": "Local Bodies", "q": "Grants to bridge the gap between local needs and resources are:", "o": ["Compensatory grants", "Specific purpose grants", "Statutory grants", "General purpose grants"], "a": 3, "e": "General purpose grants bridge the gap between local needs and local resources."}, {"c": "Finance", "t": "Local Bodies", "q": "In municipal councils, external audit is the primary expenditure control because:", "o": ["Legislative and executive functions are integrated, so there is no independent finance officer", "Legislative and executive functions are separate, so there is an independent finance officer", "Taxes are collected by the centre, so there is no need for a local finance officer", "Budgets are prepared by the state, so there is no need for a local finance officer"], "a": 0, "e": "Municipal councils combine legislative and executive functions, so they have no independent finance officer; external audit becomes the main check."}, {"c": "Finance", "t": "Local Bodies", "q": "In municipal budgets, capital transactions are often grouped under:", "o": ["Contingent items", "Revenue items", "Extraordinary items", "Deferred items"], "a": 2, "e": "Municipal budgets often have no strict revenue-capital separation, so capital transactions are grouped as extraordinary items."}, {"c": "Objectives", "t": "Local Bodies", "q": "Which is NOT an objective of audit of local bodies?", "o": ["Reporting on fairness of the financial statements", "Detecting errors, fraud and misuse of resources", "Evaluating financial controls", "Maximising the property tax collected by the body"], "a": 3, "e": "The audit of local bodies reports on fairness, controls, compliance, value for money and fraud; it does not aim to maximise tax collection."}, {"c": "Objectives", "t": "Local Bodies", "q": "Value for money audit of urban bodies evaluates whether they function:", "o": ["Legally, prudently and competitively", "Efficiently, economically and effectively", "Equitably, ethically and transparently", "Profitably, quickly and independently"], "a": 1, "e": "Value for money audit examines whether urban bodies perform efficiently, economically and effectively (the three Es)."}, {"c": "Programme", "t": "Local Bodies", "q": "Municipal audits are typically overseen by:", "o": ["The Ministry of Urban Affairs of the Union", "The Local Fund Audit Wing of the State Government", "The Comptroller and Auditor General of India", "The Institute of Chartered Accountants of India"], "a": 1, "e": "Local Fund Audit Wing of the State Government normally oversees municipal audits, though large municipalities may appoint their own auditors."}, {"c": "Programme", "t": "Local Bodies", "q": "If internal audit in the local body is absent or weak, the external auditor should:", "o": ["Defer the audit", "Rely on test checks", "Report the matter to the PAC", "Conduct detailed checks"], "a": 3, "e": "Reliance on internal audit."}, {"c": "Programme", "t": "Local Bodies", "q": "In audit of local bodies, the audit of performance covers:", "o": ["Efficiency and effectiveness of major schemes with significant expenditure", "Productivity and morale of the municipal staff on the payroll", "Popularity and coverage of the municipal schemes among the voters", "Profitability and liquidity of the municipal commercial undertakings"], "a": 0, "e": "Performance audit reviews efficiency and effectiveness of major schemes with significant expenditure."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Which is NOT a way of registering an NGO?", "o": ["Registration as a trust under the Indian Trusts Act, 1882", "Registration as a Section 8 company under the Companies Act, 2013", "Registration as a partnership firm under the Partnership Act", "Registration as a society under the Societies Registration Act, 1860"], "a": 2, "e": "NGOs are registered as societies, trusts or Section 8 companies; a partnership firm is a profit-seeking business form."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "NGOs registered under the Companies Act must maintain accounts on:", "o": ["Either cash or accrual basis", "Receipts and payments basis", "Accrual basis", "Cash basis"], "a": 2, "e": "Others may use accrual or cash."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Foreign contributions received by an NGO are regulated by:", "o": ["The Foreign Trade Development Act, 1992", "The Foreign Direct Investment Policy, 2020", "The Foreign Exchange Management Act, 1999", "The Foreign Contribution (Regulation) Act, 2010"], "a": 3, "e": "FCRA, 2010 regulates the receipt and use of foreign contributions by NGOs."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "A contribution to a revolving fund of an NGO is used for:", "o": ["Salary payments", "Temporary loans", "Permanent capital", "Fixed assets"], "a": 1, "e": "A revolving fund is built from contributions and used for temporary loans that are repaid and reused."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Donations received as corpus are generally treated as:", "o": ["Capital receipts", "Deferred income", "Revenue receipts", "Contingent receipts"], "a": 0, "e": "Corpus donations are given to be held permanently, so they are capital receipts and not income."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Auditors of a Section 8 company are appointed by:", "o": ["The registrar", "The management", "The members", "The donors"], "a": 2, "e": "Section 8 companies are companies, so their auditors are appointed by the members as under the Companies Act."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Auditors of NGOs under the Societies Registration Act or Trusts Act are usually appointed by:", "o": ["The management", "The registrar", "The members", "The donors"], "a": 0, "e": "For societies and trusts the management normally appoints the auditor, since the Companies Act does not apply."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Audit planning for an NGO includes reviewing the MOA/AOA, minutes, funding agency requirements and:", "o": ["The competitors' reports", "The previous audit report", "The employees' contracts", "The next year's budget"], "a": 1, "e": "The previous audit report highlights earlier problems, so reviewing it is a normal part of audit planning."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Verification of the corpus fund includes checking contributions, interest income and:", "o": ["Board fees", "Tax returns", "Bank charges", "Donor letters"], "a": 3, "e": "Corpus contributions are verified with donor letters, which show whether they were meant for the corpus."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Ear-marked funds are verified by reviewing:", "o": ["Court orders and insurance policies", "Budget estimates and tender documents", "Donor requirements and board resolutions", "Partner agreements and bank mandates"], "a": 2, "e": "Earmarked funds must be used as the donor required, so the donor requirements and board resolutions are reviewed."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Membership fee income of an NGO is verified by reconciling it with:", "o": ["The programme budget", "The membership register", "The donation register", "The cash flow forecast"], "a": 1, "e": "Membership fee income is reconciled to the membership register to confirm completeness."}, {"c": "NGO", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Subscription income is checked against subscription registers and reconciled with:", "o": ["Donor reports", "Bank deposits only", "Programme expenditure", "Publication distribution"], "a": 3, "e": "Subscriptions are checked to subscription registers and publication distribution to confirm completeness."}, {"c": "Sole trader", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Audit of a sole trader's accounts is:", "o": ["Not legally required unless regulators or financial institutions require it", "Required only if the trader employs more than ten persons in the business", "Always legally required under the Income Tax Act, 1961 for every trader", "Always legally required under the Companies Act, 2013 for every trader"], "a": 0, "e": "A sole proprietorship has no separate legal audit requirement, but regulators or financial institutions may require one."}, {"c": "Sole trader", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Who appoints the auditor of a sole proprietorship?", "o": ["The creditors", "The proprietor", "The registrar", "The bankers"], "a": 1, "e": "Scope determined by proprietor."}, {"c": "Sole trader", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "If no formal agreement exists with the sole trader, the auditor should send:", "o": ["A certificate to the banker about the proposed audit", "A notice to the registrar of firms about the scope", "A circular to the staff about the cooperation required", "A letter detailing the scope and any limitations"], "a": 3, "e": "Without a formal agreement, a letter stating scope and limitations avoids misunderstanding."}, {"c": "Sole trader", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Audit procedures for a sole trader are similar to those for:", "o": ["A public sector bank", "A listed company", "A partnership firm", "A government department"], "a": 2, "e": "A sole trader audit follows the same procedures as a partnership firm: understanding the business, controls, testing and compliance."}, {"c": "Partnership", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Auditors of a partnership firm are appointed by:", "o": ["The partners", "The registrar of firms", "The creditors of the firm", "The Institute of Chartered Accountants"], "a": 0, "e": "Partners appoint the auditor under the partnership deed or by consensus, and decide the remuneration."}, {"c": "Partnership", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "In a partnership audit, if the firm is legally required to be audited and there is non-compliance with accounting standards, the auditor:", "o": ["Reports the matter to the Registrar of Firms directly", "Qualifies the report or discloses the non-compliance", "Resigns from the engagement with immediate effect", "Ignores the non-compliance as the firm is not a company"], "a": 1, "e": "Where the firm must be audited, non-compliance with accounting standards is either qualified or disclosed, depending on the circumstances."}, {"c": "Partnership", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "The first document to be reviewed in a partnership audit is:", "o": ["The tax return", "The last balance sheet", "The bank statement", "The partnership deed"], "a": 3, "e": "The partnership deed governs profit sharing, capital, interest and salaries, so it is reviewed first."}, {"c": "Partnership", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Which is NOT a matter to note from the partnership agreement?", "o": ["Interest on partners' capital and loans as per the deed", "Profit and loss sharing ratio of the partners as per the deed", "The company's share capital and its authorised limit", "Salaries and withdrawals of partners as per the deed"], "a": 2, "e": "A partnership has no share capital; items like capital, interest, salaries and profit-sharing ratio come from the deed."}, {"c": "Partnership", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Audited accounts of a partnership help in settling disputes and computing amounts due to:", "o": ["Retiring partners or heirs of deceased partners", "Tax officers or customs authorities in their assessments", "Bankers or suppliers of the firm on its credit terms", "Employees or retired staff of the firm on its payroll"], "a": 0, "e": "Audited accounts give a reliable basis to settle disputes and to compute dues to retiring partners or heirs of deceased partners."}, {"c": "Partnership", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Tax provisions in partnership accounts are made:", "o": ["Only when the firm's accounts are audited", "Only when the partners agree to make them", "Before calculating the profits divisible among partners", "After calculating the profits divisible among partners"], "a": 2, "e": "Tax is provided before profit is divided because partners share profit after tax."}, {"c": "Partnership", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "In the audit of a partnership firm, the auditor checks profits are shared:", "o": ["In the agreed ratio", "In the capital ratio", "In the drawings ratio", "In equal shares"], "a": 0, "e": "The auditor checks that profits and losses are shared as per the deed and the agreed ratio."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "LLPs are governed by the:", "o": ["Societies Registration Act, 1860", "Companies Act, 2013", "Indian Partnership Act, 1932", "Limited Liability Partnership Act, 2008"], "a": 3, "e": "LLPs are governed by the Limited Liability Partnership Act, 2008."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "An LLP requires a minimum of how many partners, including designated partners?", "o": ["Three partners, including two designated partners", "Two partners, including two designated partners", "Two partners, including one designated partner", "Seven partners, including two designated partners"], "a": 1, "e": "An LLP needs at least two partners and two designated partners, who must have a DPIN."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "A small LLP has contribution not exceeding ₹25 lakh and turnover not exceeding:", "o": ["₹25 lakh", "₹40 lakh", "₹5 crore", "₹1 crore"], "a": 1, "e": "A small LLP has contribution up to ₹25 lakh and turnover up to ₹40 lakh."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "An LLP must get its accounts audited if its turnover exceeds ₹40 lakh or contribution exceeds:", "o": ["₹10 lakh", "₹1 crore", "₹25 lakh", "₹50 lakh"], "a": 2, "e": "An LLP is audited once turnover exceeds ₹40 lakh or contribution exceeds ₹25 lakh."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "An LLP opting for an audit must comply with:", "o": ["Section 143 of the Companies Act, 2013", "Section 44AB of the Income Tax Act, 1961", "Rule 11 of the Companies Rules, 2014", "Rule 24 of the LLP Rules, 2009"], "a": 3, "e": "Rule 24 of the LLP Rules, 2009 governs the audit if an LLP opts for an audit."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "The Annual Return of an LLP is filed in Form 11 within:", "o": ["60 days of the end of the financial year", "30 days of the end of the financial year", "180 days of the end of the financial year", "90 days of the end of the financial year"], "a": 0, "e": "The annual return of an LLP (Form 11) is filed within 60 days of the end of the financial year."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "The Statement of Account and Solvency in Form 8 is filed within:", "o": ["60 days from the end of six months of the financial year", "60 days from the end of the financial year", "30 days from the end of the financial year", "30 days from the end of six months of the financial year"], "a": 3, "e": "The Statement of Account and Solvency (Form 8) is filed within 30 days from the end of six months of the financial year."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "Form 11 and Form 8 relate to the:", "o": ["Statement of account and solvency and the annual return, respectively", "Annual return and the statement of account and solvency, respectively", "Incorporation and the change of partners, respectively", "Registration of charge and the satisfaction of charge, respectively"], "a": 1, "e": "Form 11 is the annual return and Form 8 is the statement of account and solvency."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "The auditor of an LLP is appointed by the designated partners at least how many days before the end of each subsequent financial year?", "o": ["60 days", "90 days", "30 days", "15 days"], "a": 2, "e": "Designated partners appoint the auditor at least 30 days before the end of each financial year after the first."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "For the first financial year of an LLP, the auditor is appointed:", "o": ["Before the end of the first financial year", "At the first meeting of the partners", "After the first financial year ends", "Within 30 days of incorporation"], "a": 0, "e": "For the first financial year, the auditor must be appointed before that year ends."}, {"c": "LLP", "t": "NGOs, Sole Traders &amp; Partnerships", "q": "In an LLP audit the auditor reviews the minutes book, obtains an engagement letter and examines:", "o": ["The articles of association", "The Memorandum of Association", "The LLP agreement", "The prospectus of the LLP"], "a": 2, "e": "The auditor reads the LLP agreement as it sets capital, profit sharing, drawings and other rights."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "In auditing a charitable institution, the first step is to study:", "o": ["The constitution or governing documents", "The investment register", "The cash book and the ledger", "The previous auditor's report"], "a": 0, "e": "The constitution or governing documents set the legal framework and powers, so they are studied first."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "For subscriptions and donations, the auditor ensures control over:", "o": ["Stationery and printing contracts", "Staff attendance and leave records", "Used cheque books and bank statements", "Unused receipt books and receipt counterfoils"], "a": 3, "e": "Control over receipt books and counterfoils ensures all collections are recorded."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "Legacies received are verified by referring to:", "o": ["Fee registers and class registers", "Correspondence and available figures", "Rent rolls and tenancy agreements", "Bank statements and fixed deposit receipts"], "a": 1, "e": "Legacies are verified from correspondence and available figures, since there is no regular source document."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "Grants received are vouched with correspondence, receipts and minute books, and a certificate from:", "o": ["The income tax officer", "A responsible official", "The bank manager", "The trustees' lawyer"], "a": 1, "e": "A responsible official's certificate on grants received supplements the vouching of correspondence and receipts."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "Rent income of a charity is vouched against:", "o": ["The fee register and class register", "The donor letters and grant letters", "The rent roll and tenancy agreements", "The receipt books and the counterfoils"], "a": 2, "e": "Rent income is vouched against the rent roll and tenancy agreements and totals agreed to the cash book."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "Special functions such as concerts are audited by vouching gross receipts and expenditure, and ensuring:", "o": ["All ticket proceeds are accounted for after allowing returns", "All sponsorship is received in advance before the event date", "All donations are credited to the corpus after allowing refunds", "All expenditure is approved by the trustees after the event is over"], "a": 0, "e": "For special functions, gross receipts are vouched and all ticket proceeds are checked after allowing for returns."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "Tax deducted at source from the income of a tax-exempt charity should be:", "o": ["Written off as an expense in the income and expenditure account", "Adjusted against the next year's tax liability of the trustees", "Retained by the department as a credit for the future years", "Refunded, and the refunds vouched with the department's correspondence"], "a": 3, "e": "A tax-exempt charity should recover tax deducted at source, so refunds are claimed and vouched with correspondence."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "Grants by a charity should be paid only for charitable purposes and with no benefit to:", "o": ["Donors or beneficiaries", "Banks or auditors", "Staff or volunteers", "Trustees or managing committee members"], "a": 3, "e": "Charity funds must be applied only to charitable purposes, and no trustee or committee member may benefit."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "Funds contributed for a special purpose must be:", "o": ["Merged with the general fund", "Invested in government securities", "Utilised for that purpose", "Distributed to the beneficiaries equally"], "a": 2, "e": "Special-purpose funds must be used for that purpose, or the donors' conditions are breached."}, {"c": "Charity", "t": "Charitable &amp; Educational", "q": "The common spine of not-for-profit audits begins with the:", "o": ["Constitution, then control over receipts, then vouching of each income stream", "Tax return, then control over refunds, then checking of each assessment", "Balance sheet, then control over assets, then valuation of each investment", "Budget, then control over payments, then vouching of each expense head"], "a": 0, "e": "Not-for-profit audits start with the governing document, then control over receipts, and vouch each income stream."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "For a university, the governing document examined is:", "o": ["The Memorandum and Articles of Association of the body", "The Act of the Legislature and related regulations", "The partnership deed and the bye-laws of the university", "The Trust Deed and the related regulations of the body"], "a": 1, "e": "A university is created by an Act of the Legislature, so that Act and its regulations govern it."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "For a school or college, the governing document examined is:", "o": ["The Act of the Legislature", "The Memorandum of Association", "The Trust Deed or regulations", "The partnership deed"], "a": 2, "e": "A school or college is typically run by a trust, so the Trust Deed or regulations govern it."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "In the audit of a school, student names in the Fee Register are checked against:", "o": ["The Asset Registers", "The Salary Registers", "The Stock Registers", "The Class Registers"], "a": 3, "e": "Checking the Fee Register against Class Registers ensures all enrolled students have been billed."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Fee receipt counterfoils are compared with the entries in:", "o": ["The Stock Register", "The Cash Book", "The Salary Register", "The Asset Register"], "a": 1, "e": "Comparing receipt counterfoils with the Cash Book confirms all fees collected were recorded."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "On totalling the Fee Register columns, the auditor ensures fees paid in advance are carried forward and:", "o": ["Irrecoverable arrears are written off with proper authority", "Advance fees are credited as income of the current year", "Recoverable arrears are written off with the principal's approval", "Arrears are carried forward without any review of recoverability"], "a": 0, "e": "Advance fees are carried forward and arrears are written off only with authority, so income is stated correctly."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Admission fees are generally credited to:", "o": ["The Corpus Fund, unless the donors decide otherwise", "The Capital Fund, unless the Managing Committee decides otherwise", "The Income and Expenditure Account, unless the Government decides otherwise", "The General Reserve, unless the Principal decides otherwise"], "a": 1, "e": "Admission fees are capital in nature, so they go to the Capital Fund unless the Committee decides otherwise."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Free studentships and concessions should be granted by:", "o": ["Authorised persons as per the Managing Committee's rules", "The auditor as per the standards of the Institute", "The class teachers as per the discretion of the staff", "The Principal as per the request of the parents"], "a": 0, "e": "Concessions reduce income, so they need authority under the Managing Committee's rules."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Hostel dues are collected before:", "o": ["Preparing the fee register and issuing the receipts", "Appointing the warden and fixing the hostel charges", "Opening student accounts and collecting admission fees", "Closing student accounts and refunding caution money"], "a": 3, "e": "Hostel dues are recovered before caution money is refunded, so the institution does not lose them."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Government grants received by an educational institution are verified with the corresponding memo and the auditor investigates:", "o": ["Excess grants and the reasons for the excess", "Delayed receipts and the reasons for the delay", "Disallowed expenses and the reasons for disallowance", "Allowed expenses and the reasons for the allowance"], "a": 2, "e": "Disallowed expenses from government grants can lead to refunds, so the reasons are investigated."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Provident Fund contributions of educational institution staff must be:", "o": ["Distributed to the staff in cash annually", "Credited to the Capital Fund of the institution", "Retained in the general bank account", "Invested in appropriate securities"], "a": 3, "e": "PF contributions must be invested in approved securities, because they belong to the staff."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Salary increases of staff of an educational institution should be:", "o": ["Decided by the staff and noted in the attendance register", "Sanctioned and minuted by the Committee", "Communicated by the auditor and recorded in the report", "Approved by the principal and recorded in the register"], "a": 1, "e": "Staff salary increases need the Committee's sanction and a minute, to prove they were authorised."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Caution money and other deposits of students are shown in the balance sheet as:", "o": ["Income", "Capital", "Liabilities", "Assets"], "a": 2, "e": "Caution money is repayable to students, so it is a liability and not income."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Investments of endowment funds should be kept separate, and excess income should be:", "o": ["Accumulated and invested with the corpus", "Distributed to the staff as a bonus", "Transferred to the general fund annually", "Utilised for the capital expenditure at once"], "a": 0, "e": "Endowment investments are kept apart, and surplus income is added to the corpus to preserve it."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Separate statements are required for funds such as:", "o": ["General Fund, Capital Fund, Reserve Fund and the Depreciation Fund", "Building Fund, Library Fund, Sinking Fund and the Dividend Fund", "Salary Fund, Rent Fund, Tax Fund and the Insurance Fund", "Poor Boys Fund, Games Fund, Hostel Fund and staff Provident Fund"], "a": 3, "e": "Separate statements are needed for funds like the Poor Boys Fund, Games Fund, Hostel Fund and staff PF because they are held for specific purposes."}, {"c": "Education", "t": "Charitable &amp; Educational", "q": "Old arrears of fees and dormitory rents are reported to:", "o": ["The Students", "The Government", "The Managing Committee", "The Registrar"], "a": 2, "e": "Old arrears are reported to the Managing Committee, which is responsible for recovery or write-off."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "In a hospital audit, the Register of Patients is vouched against:", "o": ["Copies of bills issued", "Copies of salary slips", "Copies of purchase orders", "Copies of duty rosters"], "a": 0, "e": "Vouching the Register of Patients against bill copies shows every patient was billed."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "The objective of vouching the Register of Patients is to ensure:", "o": ["Medicines are correctly prescribed and issued to all patients in the wards", "Bills are correctly prepared and issued to all patients from whom amounts are recoverable", "Doctors are correctly rostered and paid for all the shifts in the wards", "Beds are correctly allotted and cleaned for all patients in the wards"], "a": 1, "e": "The objective is to ensure bills are correctly raised and issued to all patients from whom money is recoverable."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "Income from rent, dividends and interest is verified by referring to:", "o": ["The Inventory Register", "The Property and Investment Register", "The Subscription Register", "The Register of Patients"], "a": 1, "e": "The Property and Investment Register shows what income is due, so receipts can be checked for completeness."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "Legacies and donations for specific purposes are checked to confirm they were:", "o": ["Utilised as agreed", "Transferred to reserves", "Invested in securities", "Credited to income"], "a": 0, "e": "Legacies and donations for specific purposes must be used as the donors intended."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "Capital expenditure of a hospital must be incurred with prior sanction of:", "o": ["The Statutory Auditor", "The Medical Superintendent", "The Head of Department", "The Trustees or Managing Committee"], "a": 3, "e": "Capital expenditure needs prior sanction of the Trustees or Managing Committee, to show it was authorised."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "In the hospital audit, the budget check involves comparing actual income and expenditure with budget and reporting significant variations to:", "o": ["The Registrar of Societies", "The Chief Medical Officer", "The Trustees or Managing Committee", "The Income Tax Authority"], "a": 2, "e": "Variations from budget are reported to the Trustees or Managing Committee for their action."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "Internal check in a hospital covers receipt and issue of stores, medicines, linen and:", "o": ["Patients, doctors and visitors", "Donations, grants and subscriptions", "Salaries, bonus and allowances", "Apparatus, clothing and instruments"], "a": 3, "e": "Internal check covers receipt and issue of stores, medicines, linen, apparatus, clothing and instruments."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "Purchases of hospital inventory are recorded in the Inventory Register, and issues are:", "o": ["Capitalised", "Authorised", "Estimated", "Averaged"], "a": 1, "e": "Purchases are entered in the Inventory Register, and issues need authorisation, so stock is controlled."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "In the verification of hospital inventories, the auditor:", "o": ["Physically checks a percentage of items and compares totals with ledger balances", "Physically checks all items and compares totals with the sales records", "Relies on the doctors and compares totals with the purchase orders", "Relies on the register and compares totals with the budget estimates"], "a": 0, "e": "Physical checks on a percentage of items, with totals compared to ledger balances, test the accuracy of inventory records."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "Bonds, share scrips and title deeds of a hospital are inspected and compared with:", "o": ["The Register of Patients and the cash book", "The Inventory Register and the stock records", "The Property and Investment Registers", "The Subscription Register and the donation list"], "a": 2, "e": "Inspecting bonds, share scrips and title deeds and comparing them with the registers confirms the assets exist and are recorded correctly."}, {"c": "Hospital", "t": "Hospital &amp; Cinema", "q": "A hospital auditor finally obtains:", "o": ["A Trustees' resolution on the audit fee", "A Government approval of the budget", "A Management Representation and Certificate", "A Medical Superintendent's report on patients"], "a": 2, "e": "A management representation and certificate gives a formal statement on FS and controls at the end of the audit."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Entrance to a cinema hall should be controlled through:", "o": ["Cash receipts issued by gatekeepers", "Printed tickets only", "Booking registers only", "Passes issued by staff"], "a": 1, "e": "Entry only on printed tickets prevents leakage because every admission is traceable to a ticket."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Tickets of a cinema hall should be:", "o": ["Serially numbered and bound into books", "Unnumbered and sold in loose sheets", "Numbered by the gatekeeper at each show", "Numbered by the auditor at the year-end"], "a": 0, "e": "Serially numbered, bound tickets show if any ticket is missing, which prevents suppression of sales."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Ticket numbers for a cinema are:", "o": ["Continuous for all shows and classes, with no break in series", "Distinct for each show, serial across all the classes of a show", "Continuous for all shows, distinct for each class of a show", "Distinct for each show and class, serial within the same class for a show"], "a": 3, "e": "Numbers differ for each show and class but run serially within a class, so tickets can be reconciled per show."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Advance booking tickets in a cinema should have:", "o": ["Handwritten numbers", "No serial numbers", "The same series", "A separate series"], "a": 3, "e": "A separate series for advance bookings avoids mixing them with counter sales and helps reconciliation."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "At the end of each show, a statement of tickets sold is reconciled with:", "o": ["The cash collected", "The advances given", "The film hire", "The tax paid"], "a": 0, "e": "The statement of tickets sold after each show is reconciled to cash to catch cash leakage."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Free passes in a cinema should be:", "o": ["Issued by the auditor on request at the year-end", "Issued freely by the gatekeepers at the show", "Recorded and issued under proper authority", "Issued by the distributors on request for the shows"], "a": 2, "e": "Free passes reduce revenue, so records and proper authority prevent misuse."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Entertainment tax collected by a cinema is reconciled with:", "o": ["The films hired from the distributors", "The tickets issued for each class", "The advertisements shown at the shows", "The refreshments sold at the canteen"], "a": 1, "e": "Tax collected must match tickets issued for each class; a difference suggests under-reporting or an error."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Charges for advertisement slides are verified by referring to:", "o": ["The Register of Slides and Shorts Exhibited and advertiser agreements", "The Register of Films hired and the bills of the distributors", "The Register of Free Passes issued and the distributor agreements", "The Register of Tickets sold and the statement of the shows"], "a": 0, "e": "The register of slides and shorts shown, with the advertiser agreements, supports income from advertisements."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Expenditure on advertisements, repairs and maintenance of a cinema should:", "o": ["Be deferred", "Not be capitalised", "Be capitalised", "Be provided for in advance"], "a": 1, "e": "Advertisement, repair and maintenance costs are revenue expenses; capitalising them overstates assets and profit."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Film hire payments are vouched against bills from distributors and:", "o": ["The tax returns", "The ticket records", "The relevant agreements", "The pass register"], "a": 2, "e": "Film hire payments are vouched to the distributors' bills and the agreements that fix the terms."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "Advances to film distributors that remain unadjusted after the film is exhibited call for:", "o": ["Disclosure as income in the next year of exhibition", "Capitalisation as part of the cost of the cinema", "Write-off as film hire in the same year of exhibition", "Investigation of reasons and provision if irrecoverable"], "a": 3, "e": "Unadjusted advances after exhibition show the film hire was not charged, so reasons are investigated and a provision made if irrecoverable."}, {"c": "Cinema", "t": "Hospital &amp; Cinema", "q": "When a cinema runs its own restaurant, the auditor also audits:", "o": ["Films, advances and the commission to distributors", "Salaries, rent and electricity of the cinema hall", "Sales, purchases and inventory of foodstuffs and drinks", "Tickets, passes and tax on the entertainment"], "a": 2, "e": "If the cinema runs the restaurant, its sales, purchases and stock of foodstuffs and drinks are part of the audit."}, {"c": "Hire purchase", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "A hire purchase agreement is a contract where goods are hired with:", "o": ["A right to return them freely", "An obligation to purchase them", "A right to sell them freely", "An option to purchase them"], "a": 3, "e": "A hire purchase agreement is a hire with an option to buy, unlike a sale where ownership passes at once."}, {"c": "Hire purchase", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Ownership under a hire purchase agreement passes to the hirer:", "o": ["On payment of the first instalment", "On payment of the last instalment", "On delivery of the goods", "On signing of the agreement"], "a": 1, "e": "Ownership passes only on payment of the last instalment; until then the hirer is only a bailee with an option."}, {"c": "Hire purchase", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Which is NOT required in a hire purchase agreement?", "o": ["The name of the guarantor", "The cash price of the goods", "The hire-purchase price", "The commencement date of the agreement"], "a": 0, "e": "The required terms are hire-purchase price, cash price, commencement date, instalments and a description of the goods; a guarantor's name is not required."}, {"c": "Hire purchase", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "The hire purchase agreement must be:", "o": ["Oral and witnessed by two persons", "Registered and stamped by the court", "In writing and signed by all parties", "Approved and certified by the auditor"], "a": 2, "e": "The agreement must be in writing and signed by all parties to be valid."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "In a lease, the lessee acquires:", "o": ["The right to sell an asset after a period in exchange for rent", "The right to mortgage an asset for a period in exchange for rent", "The right to own an asset after a period in exchange for rent", "The right to use an asset for a period in exchange for rent"], "a": 3, "e": "A lessee gets the right to use the asset for an agreed period for rent; ownership stays with the lessor."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "The auditor of a leasing company first checks that the object clause:", "o": ["Permits leasing and financing activities", "Permits trading and manufacturing activities", "Permits borrowing and investing activities", "Permits agency and franchising activities"], "a": 0, "e": "The object clause must permit leasing and financing; otherwise the activity would be outside the company's powers."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Credit analysis of a lessee covers creditworthiness, capital strength and:", "o": ["Turnover", "Collateral", "Location", "Dividend"], "a": 1, "e": "Credit analysis of a lessee covers creditworthiness, capital strength and collateral, to assess the risk of default."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Supporting documents for leases include the lessee's acceptance letter confirming:", "o": ["Purchase and price of the equipment", "Registration and title of the equipment", "Payment and timing of the rentals", "Receipt and condition of the equipment"], "a": 3, "e": "The acceptance letter confirms that the lessee received the equipment in good condition, so rentals are due."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "A lease is normally a finance lease when:", "o": ["The lease term covers most of the asset's economic life", "The lease term is much shorter than the asset's useful life", "The lessee has no option to buy the asset at the end", "The lessor keeps the ownership risks for the entire term"], "a": 0, "e": "A lease is a finance lease when it transfers substantially all the risks and rewards of ownership, e.g. the term covers most of the economic life."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "In a finance lease, the asset appears in the balance sheet of:", "o": ["The financier", "The lessee", "The lessor", "The supplier"], "a": 1, "e": "In a finance lease, risks and rewards pass to the lessee, so the asset is shown in the lessee's balance sheet."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Under an operating lease, the lessee treats lease payments as:", "o": ["A capital outlay, with interest claimed", "A loan repayment, with depreciation claimed", "A rental expense, with no depreciation claimed", "A deferred asset, with depreciation claimed"], "a": 2, "e": "An operating lease is a rental, so payments are expensed and no depreciation is claimed."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "The lessee under a finance lease can claim:", "o": ["Both interest and depreciation", "Only the depreciation", "Neither interest nor depreciation", "Only the lease rentals"], "a": 0, "e": "A finance lease is treated like a loan, so the lessee claims interest and depreciation."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Which is an example of an operating lease?", "o": ["Plant and machinery", "Projector, computers or laptops", "Office buildings", "Land"], "a": 1, "e": "Projectors, computers and laptops are typical operating leases, whereas plant and land are finance leases."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "An operating lease term is generally:", "o": ["Equal to 100% of the asset's useful life", "More than the asset's economic life", "Equal to the asset's estimated economic life", "Less than 75% of the asset's projected useful life"], "a": 3, "e": "An operating lease is usually for less than 75% of useful life, since the lessor retains the asset's risks."}, {"c": "Leases", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Under a finance lease, the lessee has an option to purchase at a price:", "o": ["Higher than the fair value", "Equal to the original cost", "Lower than the fair market value", "Equal to the written-down value"], "a": 2, "e": "A finance lease gives an option to buy at a price lower than fair market value, which shows ownership risk has passed."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Hotel audit relies heavily on internal controls because business is largely in cash and:", "o": ["Staff are easy to recruit", "Inventory is easy to pilfer", "Rooms are easy to occupy", "Rates are easy to revise"], "a": 1, "e": "A hotel deals in cash and inventory is easily pilfered, so controls are critical."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Restaurant bills in a hotel are checked against:", "o": ["Guest registers", "Housekeeper reports", "Tariff cards", "Kitchen Order Tickets"], "a": 3, "e": "Matching restaurant bills with Kitchen Order Tickets shows that every order served was billed."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Because hotel records are transient, the auditor relies heavily on:", "o": ["Current ratio analysis", "Net margin analysis", "Gross margin analysis", "Debt equity ratio analysis"], "a": 2, "e": "Hotel records are transient, so gross margin analysis gives a reliable analytical test; unexplained discrepancies may need a qualified report."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Room sales are verified by cross-referencing guest bills with:", "o": ["The guest register", "The restaurant bills", "The travel agent invoices", "The kitchen order tickets"], "a": 0, "e": "Cross-referencing guest bills to the guest register verifies that all room sales were billed at authorised rates."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Daily housekeeper reports are matched with:", "o": ["Casual labour records and wage sheets", "Hall booking records and tariff cards", "Purchase orders and supplier bills", "Guest registers and individual bills"], "a": 3, "e": "Housekeeper reports show which rooms were occupied, so they are matched to registers and bills to detect unbilled occupancy."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Quasi-fixed assets of a hotel such as silver and cutlery need accounting policies that:", "o": ["Merge inventory items with capital assets", "Write off all such items in the year of purchase", "Distinguish inventory items from capital assets", "Capitalise all such items without any distinction"], "a": 2, "e": "Items like silver and cutlery need a clear policy to separate inventory from capital assets, and to decide on depreciation."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "In a hotel, repairs and minor renovations are treated as revenue expenditure, while major alterations are:", "o": ["Provided", "Capitalised", "Deferred", "Written off"], "a": 1, "e": "Repairs and minor renovations are revenue expenses, whereas major alterations and additions are capitalised."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Casual labour records in a hotel are verified to prevent:", "o": ["Defalcation", "Dilution", "Depreciation", "Duplication"], "a": 0, "e": "Casual labour wage records are checked to prevent defalcation through false names or inflated hours."}, {"c": "Hotel", "t": "Hire-Purchase &amp; Leasing, Hotels", "q": "Commission payments to travel agents are checked against:", "o": ["Tariff cards", "Guest registers", "Agreements", "Housekeeper reports"], "a": 2, "e": "Commission to travel agents is checked against the agreements to make sure rates and amounts are right."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "Co-operative societies in India are primarily governed by the:", "o": ["Co-operative Societies Act, 1912", "Indian Trusts Act, 1882", "Companies Act, 2013", "Societies Registration Act, 1860"], "a": 0, "e": "The Co-operative Societies Act, 1912 and the state laws are the main regulation for co-operative societies."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "Audit of co-operative societies is under Section 17 of the Act, which requires accounts to be audited:", "o": ["At least once in five years by the society's choice", "At least once a year by the Registrar's arrangement", "At least twice a year by the board's choice", "At least once in two years by the members' choice"], "a": 1, "e": "Section 17 requires the Registrar to ensure that each registered society's accounts are audited at least once a year."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "The auditor of a co-operative society is appointed by:", "o": ["The bankers", "The members", "The managing committee", "The Registrar"], "a": 3, "e": "The Registrar appoints the auditor of a co-operative society, so the auditor is independent of its management."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "The auditor of a co-operative society reports to:", "o": ["The managing committee only", "The members and the bankers", "The Registrar and the society", "The government and the public"], "a": 2, "e": "The auditor reports to both the Registrar, who appointed him, and the society."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "No member can hold more than:", "o": ["25% of the share capital or ₹10,000 in value", "15% of the share capital or ₹500 in value", "10% of the share capital or ₹5,000 in value", "20% of the share capital or ₹1,000 in value"], "a": 3, "e": "A member's holding is limited to 20% of share capital or ₹1,000 in value, to stop domination by a few members."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "A co-operative society can lend money only to:", "o": ["Members and non-members alike, with the approval of the board", "Members, with exceptions for other registered societies", "Non-members alone, as per the bye-laws of the society", "Directors and relatives, with the special approval of the Registrar"], "a": 1, "e": "Loans are given only to members, and to other registered societies with special approval, because societies exist for members."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "A prescribed percentage of profits is transferred to the Reserve Fund:", "o": ["Before dividend or bonus is distributed", "Along with the dividend or bonus", "After dividend or bonus is distributed", "Instead of the dividend or bonus"], "a": 0, "e": "A prescribed share of profit goes to the Reserve Fund before any dividend or bonus."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "Up to what percentage of net profits (after the reserve transfer) may be given to charity with the Registrar's sanction?", "o": ["15%", "20%", "25%", "10%"], "a": 3, "e": "After the compulsory reserve transfer, up to 10% of net profits can go to charity with the Registrar's sanction."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "Contribution to the Education Fund is treated as:", "o": ["An asset of the society", "An appropriation of profits", "A charge on profits", "A donation by members"], "a": 2, "e": "Contribution to the Education Fund is an expense charged against profit, not an appropriation after profit."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "Overdue interest in co-operative society accounts is:", "o": ["Included in interest outstanding and accrued", "Excluded from interest outstanding and accrued", "Capitalised with the principal of the loan", "Written off in the year of the audit"], "a": 1, "e": "Overdue interest is not income, so it is excluded from interest outstanding and accrued."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "In some states, bad debts of a co-operative society must be written off only after:", "o": ["The auditor certifies them", "The bank confirms them", "The members approve them", "The Registrar waives them"], "a": 0, "e": "In some states the auditor must certify bad debts before they are written off."}, {"c": "Co-operative", "t": "Co-operative Societies", "q": "The co-operative auditor reports serious irregularities such as personal profiteering to:", "o": ["The managing committee in the draft report", "The m
