<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 10 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

const DECK = [{"c": "Types", "t": "Banks &amp; RBI", "q": "Banks whose core functions are accepting deposits and granting advances are:", "o": ["Regional rural banks", "Development banks", "Payment banks", "Commercial banks"], "a": 3, "e": "Commercial banks' core functions are accepting deposits and granting advances, unlike payments or development banks."}, {"c": "Types", "t": "Banks &amp; RBI", "q": "Which bank can accept restricted deposits but cannot issue loans or credit cards?", "o": ["Small finance bank", "Co-operative bank", "Payments bank", "Commercial bank"], "a": 2, "e": "Examples: Airtel, India Post."}, {"c": "Types", "t": "Banks &amp; RBI", "q": "Banks set up to serve small farmers and micro-businesses in unserved sectors are:", "o": ["Development banks", "Small finance banks", "Payments banks", "Commercial banks"], "a": 1, "e": "Small finance banks serve unserved and underserved sectors such as small farmers and micro-businesses."}, {"c": "Types", "t": "Banks &amp; RBI", "q": "IFCI, IDBI and SIDBI are examples of:", "o": ["Development banks (term-lending institutions)", "Payments banks (restricted-deposit institutions)", "Small finance banks (micro-credit institutions)", "Regional rural banks (rural-area institutions)"], "a": 0, "e": "IFCI, IDBI and SIDBI provide long-term funds for infrastructure and growth, so they are development banks."}, {"c": "Types", "t": "Banks &amp; RBI", "q": "Regional Rural Banks were established to meet:", "o": ["The foreign exchange needs of exporters", "The large corporate needs of urban industries", "The basic banking needs of rural communities", "The long-term needs of infrastructure projects"], "a": 2, "e": "Regional rural banks were set up for the basic banking needs of rural communities."}, {"c": "RBI", "t": "Banks &amp; RBI", "q": "Which is NOT a function of the RBI?", "o": ["Issuance and regulation of currency", "Accepting deposits from the general public", "Banker to the central and state governments", "Inspection of banks and granting of licences"], "a": 1, "e": "RBI is banker to banks, not to the public."}, {"c": "RBI", "t": "Banks &amp; RBI", "q": "The RBI acts as banker to:", "o": ["Individuals, partnerships and unlisted companies of the country", "Exporters, importers and foreign investors of the country", "Trusts, societies and co-operative societies of the country", "Governments, commercial banks and term-lending institutions"], "a": 3, "e": "The RBI is banker to the Central and State governments and to commercial banks and term-lending institutions."}, {"c": "RBI", "t": "Banks &amp; RBI", "q": "Banking operations are conducted primarily at:", "o": ["Branches", "Head office", "Regional offices", "Zonal offices"], "a": 0, "e": "Other offices control and administer."}, {"c": "Reports", "t": "Bank Audit Reports", "q": "The report on Internal Financial Controls of a bank is issued under:", "o": ["Section 134(5) of the Companies Act, 2013", "Section 128 of the Companies Act, 2013", "Section 143(3)(i) of the Companies Act, 2013", "Section 143(1) of the Companies Act, 2013"], "a": 2, "e": "Section 143(3)(i) requires reporting on adequacy and operating effectiveness of internal financial controls over financial reporting."}, {"c": "Reports", "t": "Bank Audit Reports", "q": "The Long Form Audit Report provides:", "o": ["A detailed analysis of the bank's financial and operational aspects", "A short summary of the bank's profits and the capital position", "A list of the bank's customers and the advances sanctioned", "A brief note on the bank's branches and the staff strength"], "a": 0, "e": "The LFAR is a detailed RBI-mandated report on the bank's controls, compliance and financial performance."}, {"c": "Reports", "t": "Bank Audit Reports", "q": "The report on SLR verifies that banks maintain a percentage of NDTL in:", "o": ["Priority sector loans", "Liquid assets", "Fixed assets", "Capital reserves"], "a": 1, "e": "Banks must hold a prescribed percentage of NDTL in liquid assets under the SLR; the auditor reports compliance."}, {"c": "Reports", "t": "Bank Audit Reports", "q": "The report on treasury operations confirms conduct per:", "o": ["SEBI instructions", "Government instructions", "ICAI instructions", "RBI instructions"], "a": 3, "e": "Treasury operations must follow RBI instructions on investments and transactions, and the auditor reports on that."}, {"c": "Reports", "t": "Bank Audit Reports", "q": "The report on IRAC covers income recognition, asset classification and:", "o": ["Priority lending", "Liquidity", "Revaluation", "Provisioning"], "a": 3, "e": "The IRAC report covers whether income recognition, asset classification and provisioning follow RBI norms."}, {"c": "Reports", "t": "Bank Audit Reports", "q": "Compliance with the Ghosh and Jilani Committee recommendations relate to:", "o": ["Technology adoption, and customer service in the banks", "Frauds and malpractices, and internal control and inspection", "Capital adequacy, and liquidity coverage in the banks", "Priority sector lending, and rural credit in the banks"], "a": 1, "e": "The Ghosh Committee dealt with frauds and malpractices and the Jilani Committee with internal control and inspection."}, {"c": "Reports", "t": "Bank Audit Reports", "q": "The report on adverse credit-deposit ratio in rural areas reports instances where:", "o": ["The ratio of urban credit to total deposits is adversely affected", "The ratio of capital to risk assets is adversely affected", "The ratio of rural credit to rural deposits is adversely affected", "The ratio of liquid assets to demand liabilities is adversely affected"], "a": 2, "e": "This report covers instances where the rural credit-deposit ratio is adverse, i.e. rural deposits are not lent in rural areas."}, {"c": "Reports", "t": "Bank Audit Reports", "q": "Which is NOT a special report from the statutory central auditors of a bank?", "o": ["Report on corporate social responsibility spending", "Report on serious irregularities in the bank", "Report on treasury operations of the bank", "Report on compliance with SLR requirements"], "a": 0, "e": "Others are special reports."}, {"c": "CBS", "t": "CBS &amp; Audit Approach", "q": "In a CBS environment, the auditor should treat system-generated information as:", "o": ["Reliable if it is certified by the head of the IT department", "Requiring supporting evidence and professional scepticism", "Unreliable and ignored in favour of manual records alone", "Reliable since it is automatically produced by the system"], "a": 1, "e": "System output is not evidence by itself; it needs supporting evidence and professional scepticism."}, {"c": "CBS", "t": "CBS &amp; Audit Approach", "q": "The auditor ensures the bank's system is configured to:", "o": ["The latest IRDAI guidelines on solvency, reserves and investments", "The latest ICAI guidelines on documentation, supervision and reporting", "The latest SEBI guidelines on disclosure, listing and trading", "The latest RBI guidelines on classification, provisioning and income recognition"], "a": 3, "e": "The system must be set to the latest RBI parameters for classification, provisioning and income recognition, otherwise outputs will be wrong."}, {"c": "CBS", "t": "CBS &amp; Audit Approach", "q": "Where necessary, the auditor performs manual checks to confirm:", "o": ["Authenticity and consistency of information from automated systems", "Number and type of the customers served at the counter", "Quantity and quality of the stationery used at the branch", "Presence and attendance of the bank staff at the branch"], "a": 0, "e": "Manual checks confirm that information from the automated systems is authentic and consistent."}, {"c": "Plan", "t": "CBS &amp; Audit Approach", "q": "An audit plan for a bank is based on nature of operations, adverse features, level of compliance and:", "o": ["Audit staff", "Audit deadlines", "Audit risks", "Audit fees"], "a": 2, "e": "The plan depends on operations, adverse features, compliance and audit risks, so work is focused on risk areas."}, {"c": "Control", "t": "CBS &amp; Audit Approach", "q": "Clear division of responsibilities between front office and back office is:", "o": ["Exception reporting", "Reconciliation of positions", "Delegation of powers", "Segregation of duties"], "a": 3, "e": "Dividing front-office and back-office responsibilities prevents conflicts of interest and errors; this is segregation of duties."}, {"c": "Control testing", "t": "CBS &amp; Audit Approach", "q": "To test whether a bank control is properly designed and operated, the auditor asks who performs it, what evidence exists, when, where it is kept, why it is needed and:", "o": ["How the control is described in the policy manual of the bank", "How it can be bypassed and how exceptions are resolved", "How much it costs and how often it is revised by management", "How many staff operate it and how long they have served"], "a": 1, "e": "Testing controls means checking design, authority, evidence, frequency, retention, purpose and whether the control can be bypassed."}, {"c": "Control testing", "t": "CBS &amp; Audit Approach", "q": "A control that can easily be bypassed by staff, even though it operates regularly, is:", "o": ["Weak in design, so the auditor cannot rely on it", "Strong in design, so the auditor can rely on it fully", "Adequate in design, so the auditor reduces testing", "Irrelevant to the audit, so the auditor can ignore it"], "a": 0, "e": "A control that can be bypassed does not reliably prevent or detect misstatements, however regularly it operates."}, {"c": "Control testing", "t": "CBS &amp; Audit Approach", "q": "A control meant to operate daily but performed only monthly fails mainly because its:", "o": ["Cost is not justified by the benefit it gives to the bank", "Owner is not senior enough to approve the transactions", "Frequency is not sufficient to prevent or detect errors in time", "Evidence is not retained in the physical form of a register"], "a": 2, "e": "Frequency must match the pace of the transactions, otherwise errors go undetected for long."}, {"c": "Team", "t": "CBS &amp; Audit Approach", "q": "Engagement team discussions in a bank audit are:", "o": ["Documented and cover errors, fraud risks and professional scepticism", "Informal and cover only the audit fee and the staff allocation", "Confined to the partner and cover only the tax and the legal risks", "Optional and cover only the prior year's errors and the deadlines"], "a": 0, "e": "Discussions are documented and cover likely errors, fraud risks and the need for professional scepticism."}, {"c": "Team", "t": "CBS &amp; Audit Approach", "q": "An advantage of engagement team discussions is that they help:", "o": ["Reduce the audit fee of the bank and remove the need for a specialist", "Transfer the responsibility for fraud to the management of the bank", "Replace the audit programme with an informal oral briefing of staff", "Identify susceptibility of the FS to fraud and decide whether specialists are needed"], "a": 3, "e": "They help identify susceptibility to fraud, assign tasks and decide whether specialists are needed."}, {"c": "Appointment", "t": "Appointment &amp; Reporting", "q": "The auditor of a banking company is appointed by:", "o": ["The Board with prior approval of the RBI", "The Reserve Bank of India", "The shareholders at the AGM", "The Central Government"], "a": 2, "e": "A banking company is a company, so shareholders appoint the auditor at the AGM."}, {"c": "Appointment", "t": "Appointment &amp; Reporting", "q": "The auditor of a nationalised bank is appointed by:", "o": ["The Central Government on the advice of the C&amp;AG", "The Board of Directors, with the prior approval of the RBI", "The shareholders at the annual general meeting", "The Reserve Bank of India on its own authority"], "a": 1, "e": "Nationalised bank auditors are appointed by the bank's Board with the RBI's prior approval."}, {"c": "Appointment", "t": "Appointment &amp; Reporting", "q": "The auditor of a regional rural bank is appointed by the bank with the approval of:", "o": ["The Central Government", "The State Government", "The Reserve Bank of India", "The shareholders"], "a": 0, "e": "Regional rural bank auditors are appointed by the bank with the approval of the Central Government."}, {"c": "Remuneration", "t": "Appointment &amp; Reporting", "q": "The remuneration of the auditor of a banking company is determined under:", "o": ["Section 141 of the Companies Act, 2013", "Section 139 of the Companies Act, 2013", "Section 142 of the Companies Act, 2013", "Section 143 of the Companies Act, 2013"], "a": 2, "e": "Section 142 of the Companies Act, 2013 sets remuneration for a banking company, fixed by the company in general meeting."}, {"c": "Remuneration", "t": "Appointment &amp; Reporting", "q": "The remuneration of the auditors of nationalised banks and SBI is fixed by:", "o": ["The Central Government in consultation with the C&amp;AG", "The RBI in consultation with the Central Government", "The Board in consultation with the shareholders", "The ICAI in consultation with the Central Government"], "a": 1, "e": "The RBI fixes the remuneration of auditors of nationalised banks and SBI in consultation with the Central Government."}, {"c": "Report", "t": "Appointment &amp; Reporting", "q": "The report of a nationalised bank's auditor also covers whether transactions noticed are:", "o": ["Within the budget of the bank", "Within the profits of the bank", "Within the knowledge of the bank", "Within the powers of the bank"], "a": 3, "e": "The auditor reports on whether transactions noticed are within the powers of the bank."}, {"c": "Report", "t": "Appointment &amp; Reporting", "q": "The report on a bank must disclose quantitative details of unaudited branches such as advances, deposits and:", "o": ["Staff strength and branch rentals", "Customers served and complaints received", "Fixed assets and capital reserves", "Interest income and interest expense"], "a": 3, "e": "For unaudited branches, the report gives quantitative details such as advances, deposits, interest income and interest expense."}, {"c": "Report", "t": "Appointment &amp; Reporting", "q": "CARO 2020 does NOT apply to:", "o": ["Banking companies", "Listed companies", "Foreign companies", "Private companies"], "a": 0, "e": "CARO 2020 does not apply to banking companies, which have their own reporting requirements."}, {"c": "Report", "t": "Appointment &amp; Reporting", "q": "The Long Form Audit Report is required by the RBI to be submitted by SCAs by:", "o": ["31 December each year", "30 June each year", "30 September each year", "31 March each year"], "a": 1, "e": "The LFAR must be submitted by the statutory central auditors to the RBI by 30 June each year."}, {"c": "Report", "t": "Appointment &amp; Reporting", "q": "The LFAR is required for auditors of:", "o": ["Commercial banks alone, but not the co-operative banks", "Listed banks alone, but not the unlisted banks", "Public-sector, private-sector and foreign banks and their branches", "Public-sector banks and their branches alone, but not other banks"], "a": 2, "e": "The RBI requires the LFAR from auditors of public-sector, private-sector and foreign banks and their branches."}, {"c": "Report", "t": "Appointment &amp; Reporting", "q": "Suspected fraud detected by the bank auditor must be reported to:", "o": ["The RBI, and deliberate failure can create liability", "The press, and silence can create an adverse publicity", "The bank's customers, and delay can create a goodwill risk", "The members, and omission can create a minor penalty"], "a": 0, "e": "Suspected fraud must be reported to the RBI, and a deliberate failure to do so can create liability for the auditor."}, {"c": "Report", "t": "Appointment &amp; Reporting", "q": "The duty of confidentiality of the bank auditor is overridden when:", "o": ["The auditor prefers reporting", "Statute or law requires reporting", "The management asks for reporting", "The customers ask for reporting"], "a": 1, "e": "Confidentiality yields to statutory or legal reporting requirements, so fraud reporting to the RBI is allowed."}, {"c": "Report", "t": "Appointment &amp; Reporting", "q": "Reasonable assurance on fraud in bank audit is obtained under:", "o": ["SA 250", "SA 260", "SA 265", "SA 240"], "a": 3, "e": "SA 240 requires reasonable assurance that the FS are free of material misstatement from fraud or error."}, {"c": "Initial", "t": "Conducting the Audit", "q": "Before appointment, a bank obtains from the auditor a declaration of:", "o": ["Impartiality", "Integrity", "Indebtedness", "Independence"], "a": 2, "e": "A bank obtains a declaration of indebtedness to know whether the auditor owes it money, which could impair independence."}, {"c": "Initial", "t": "Conducting the Audit", "q": "An auditor who does internal assignments such as concurrent audit of a bank:", "o": ["Can undertake the statutory audit of the same bank in the same year", "Can undertake it with the approval of the RBI in the same year", "Cannot undertake the statutory audit of the same bank in the same year", "Can undertake it with the approval of the board in the same year"], "a": 2, "e": "An auditor with an internal assignment such as concurrent audit cannot also be the statutory auditor of the same bank in that year."}, {"c": "Initial", "t": "Conducting the Audit", "q": "Before accepting the position of the previous auditor, the incoming auditor obtains:", "o": ["A No Objection Certificate from the former auditor", "A clearance from the Registrar of Companies", "An approval from the Reserve Bank of India", "A consent letter from the management of the bank"], "a": 0, "e": "The incoming auditor must communicate with the former auditor and obtain a No Objection Certificate under the CA Act, 1949."}, {"c": "Initial", "t": "Conducting the Audit", "q": "If opening balances are materially misstated and not properly adjusted or disclosed, the auditor issues:", "o": ["A disclaimer of opinion in all cases", "An unmodified opinion with a KAM", "An unmodified opinion with an EOM", "A qualified or adverse opinion"], "a": 3, "e": "If opening balances are materially misstated and not corrected or disclosed, SA 510 requires a qualified or adverse opinion."}, {"c": "Initial", "t": "Conducting the Audit", "q": "Terms of engagement to avoid misunderstanding about scope are agreed under:", "o": ["SA 230", "SA 210", "SA 220", "SA 240"], "a": 1, "e": "SA 210 requires terms of engagement to be agreed to avoid misunderstanding about scope and responsibilities."}, {"c": "Risk", "t": "Conducting the Audit", "q": "The components of the bank's risk management process include oversight, risk identification, control activities, monitoring and:", "o": ["Reliable information systems", "Reliable staff members", "Reliable funding sources", "Reliable branch networks"], "a": 0, "e": "A bank's risk management process covers oversight, identification and monitoring, control activities, monitoring activities and reliable information systems."}, {"c": "Risk", "t": "Conducting the Audit", "q": "Risks of material misstatement at the FS level and the assertion level are identified under:", "o": ["SA 320", "SA 315", "SA 300", "SA 330"], "a": 1, "e": "SA 315 requires the auditor to identify and assess risks of material misstatement at FS and assertion levels."}, {"c": "Risk", "t": "Conducting the Audit", "q": "Response to assessed risks is designed under:", "o": ["SA 315", "SA 320", "SA 330", "SA 300"], "a": 2, "e": "SA 330 deals with designing and implementing responses to assessed risks."}, {"c": "Risk", "t": "Conducting the Audit", "q": "Banks must adhere to RBI's KYC and anti-money-laundering standards, which relates to the risk of:", "o": ["Materiality including trivial items", "Going concern including liquidity", "Outsourcing including cloud storage", "Fraud including money laundering"], "a": 3, "e": "Banks must follow RBI's KYC and anti-money-laundering standards, which relates to the risk of fraud including money laundering."}, {"c": "Risk", "t": "Conducting the Audit", "q": "Stress testing evaluates:", "o": ["The speed of the banking system under normal conditions", "The robustness of the banking system under extreme conditions", "The security of the banking system under audit conditions", "The profitability of the banking system under growth conditions"], "a": 1, "e": "Stress testing checks whether the bank can withstand extreme conditions, as RBI guidelines require."}, {"c": "Risk", "t": "Conducting the Audit", "q": "Basel III focuses on:", "o": ["Statutory liquidity requirements", "Branch licensing requirements", "Priority sector lending requirements", "Regulatory capital requirements"], "a": 3, "e": "Basel III sets global standards for bank capital and resilience."}, {"c": "Risk", "t": "Conducting the Audit", "q": "The audit planning memorandum:", "o": ["Lists the fees billed and the time spent by the staff", "Records the management's response to the audit report", "Summarises the audit plan in a structured approach", "Replaces the audit programme for all the branches"], "a": 2, "e": "The planning memorandum records the audit plan in a structured form."}, {"c": "Risk", "t": "Conducting the Audit", "q": "The auditor reviews adverse comments in the RBI's Annual Financial Inspection report to:", "o": ["Ensure proper consideration of any variation in provisions", "Ensure proper recording of the inspection fee in the books", "Ensure proper tenure of the management of the bank", "Ensure proper licence for the branches of the bank"], "a": 0, "e": "Adverse comments in the RBI inspection report may show provisions are inadequate, so the auditor considers them."}, {"c": "Advances", "t": "Advances &amp; Security", "q": "Which is a FUNDED facility?", "o": ["Standby commitment", "Letter of credit", "Bank guarantee", "Cash credit"], "a": 3, "e": "Funded: bank parts with funds."}, {"c": "Advances", "t": "Advances &amp; Security", "q": "Which is a NON-FUNDED facility?", "o": ["Demand loan", "Overdraft", "Bank guarantee", "Term loan"], "a": 2, "e": "Bank lends its credit."}, {"c": "Advances", "t": "Advances &amp; Security", "q": "A revolving credit up to a specified limit is:", "o": ["Cash credit", "Demand loan", "Bill discounting", "Term loan"], "a": 0, "e": "A cash credit is a revolving credit up to a sanctioned limit, used for working capital."}, {"c": "Advances", "t": "Advances &amp; Security", "q": "Withdrawing more than the account balance is permitted in an:", "o": ["Term loan", "Overdraft", "Demand loan", "Letter of credit"], "a": 1, "e": "An overdraft lets the account holder withdraw more than the balance up to a limit."}, {"c": "Advances", "t": "Advances &amp; Security", "q": "Priority sector lending requires banks to lend a percentage of credit to:", "o": ["Agriculture, MSME, Education and Housing", "Real estate, exports, mining and imports", "Luxury goods, jewellery, cars and electronics", "Retail, aviation, telecom and tourism"], "a": 0, "e": "RBI requires banks to lend a prescribed percentage of credit to priority sectors such as agriculture, MSME, education and housing."}, {"c": "Advances", "t": "Advances &amp; Security", "q": "Security over and above the main security is:", "o": ["Guarantee", "Collateral security", "Primary security", "Margin money"], "a": 1, "e": "Collateral security is additional to the primary security the borrower provides."}, {"c": "Security", "t": "Advances &amp; Security", "q": "In which mode does possession of goods PASS to the bank?", "o": ["Hypothecation", "Mortgage", "Assignment", "Pledge"], "a": 3, "e": "In a pledge, goods are delivered to the bank, so possession passes to the bank while ownership stays with the pledger."}, {"c": "Security", "t": "Advances &amp; Security", "q": "Hypothecation is a charge over:", "o": ["Immovable assets, which pass to the bank", "Policies, which are held by the borrower", "Movable assets, which remain with the borrower", "Debts, which are transferred to the bank"], "a": 2, "e": "In hypothecation, the borrower keeps possession of movable assets while the bank holds a charge on them."}, {"c": "Security", "t": "Advances &amp; Security", "q": "A mortgage is a charge over:", "o": ["Immovable property", "Movable goods", "Book debts", "Insurance policies"], "a": 0, "e": "A mortgage is a transfer of an interest in immovable property as security."}, {"c": "Security", "t": "Advances &amp; Security", "q": "Transfer of book debts or insurance policies to the bank is:", "o": ["Pledge", "Hypothecation", "Assignment", "Set-off"], "a": 2, "e": "Assignment transfers existing or future debts or policies to the bank as security."}, {"c": "Security", "t": "Advances &amp; Security", "q": "The statutory right of the bank to adjust debit balance in one account against credit balance in another of the same person is:", "o": ["Lien", "Assignment", "Pledge", "Set-off"], "a": 3, "e": "Set-off lets the bank adjust a debit balance in one account against a credit balance in another of the same person."}, {"c": "Security", "t": "Advances &amp; Security", "q": "A mortgage without registration, by deposit of title deeds, is:", "o": ["Registered mortgage", "Equitable mortgage", "Simple mortgage", "Usufructuary mortgage"], "a": 1, "e": "An equitable mortgage is created by deposit of title deeds without registration."}, {"c": "NPA", "t": "IRAC · NPA", "q": "A term loan becomes NPA when interest or principal is overdue for more than:", "o": ["60 days", "180 days", "90 days", "30 days"], "a": 2, "e": "A term loan turns NPA when interest or principal stays overdue for more than 90 days."}, {"c": "NPA", "t": "IRAC · NPA", "q": "An overdraft or cash credit account becomes NPA when it is:", "o": ["Out of order", "Overdue for 90 days", "Overdue for 365 days", "Overdue for 180 days"], "a": 0, "e": "An OD/CC account is NPA when it is out of order, as it has no overdue date."}, {"c": "NPA", "t": "IRAC · NPA", "q": "Bills purchased and discounted become NPA when overdue for more than:", "o": ["60 days", "90 days", "180 days", "30 days"], "a": 1, "e": "Bills purchased or discounted become NPA when overdue for more than 90 days."}, {"c": "Out of order", "t": "IRAC · NPA", "q": "Which makes an OD/CC account 'out of order'?", "o": ["Overdue principal for 30 days", "Overdue interest for 60 days", "No debits recorded for 90 days", "No credits recorded for 90 days"], "a": 3, "e": "An account is out of order if there are no credits for 90 days, even if the balance is within the limit."}, {"c": "Out of order", "t": "IRAC · NPA", "q": "An account is out of order if the balance:", "o": ["Occasionally exceeds the sanctioned limit or drawing power", "Continuously exceeds the sanctioned limit or drawing power", "Remains within the sanctioned limit or drawing power", "Remains close to the sanctioned limit or drawing power"], "a": 1, "e": "An account is out of order when the balance continuously exceeds the sanctioned limit or drawing power."}, {"c": "Out of order", "t": "IRAC · NPA", "q": "An OD account within its limit, with credits of ₹2 lakh against interest debited of ₹5 lakh in the same period, is:", "o": ["Out of order, as credits are insufficient to cover the interest", "Standard, as the credits in the account are more than the debits", "Overdue, as the interest is outstanding for more than 30 days", "Regular, as the balance is within the sanctioned limit of the account"], "a": 0, "e": "Credits that do not even cover the interest debited show the account is not being serviced, so it is out of order."}, {"c": "Overdue", "t": "IRAC · NPA", "q": "An amount is 'overdue' if it is not paid by:", "o": ["The next review of the account", "The end of the financial year", "The date of the board meeting", "The due date fixed by the bank"], "a": 3, "e": "Any amount unpaid by the due date fixed by the bank is overdue."}, {"c": "Classification", "t": "IRAC · NPA", "q": "NPA classification is based on the:", "o": ["Security available", "Net worth of the borrower", "Record of recovery", "Guarantee of the director"], "a": 2, "e": "NPA status depends on recovery record, not on the security or net worth of the borrower."}, {"c": "Classification", "t": "IRAC · NPA", "q": "NPA classification is:", "o": ["Sector-wise", "Branch-wise", "Borrower-wise", "Facility-wise"], "a": 2, "e": "If one facility of a borrower is NPA, all facilities of that borrower are NPA."}, {"c": "Classification", "t": "IRAC · NPA", "q": "Raman's car loan is NPA but his housing loan is regular. The bank classifies:", "o": ["Both loans as NPA", "Only the car loan as NPA", "Only the housing loan as NPA", "Neither loan as NPA"], "a": 0, "e": "Classification is borrower-wise, so the regular housing loan is also NPA when the car loan is NPA."}, {"c": "Classification", "t": "IRAC · NPA", "q": "Accounts regularised just before the balance sheet date by a few credits should be:", "o": ["Reported as standard since the limit is not exceeded", "Ignored since the credits are within the financial year", "Accepted as regular since the credits have been received", "Scrutinised and classified as NPA if inherently weak"], "a": 3, "e": "Credits just before the year-end may be window dressing, so weak accounts are classified as NPA."}, {"c": "Guarantee", "t": "IRAC · NPA", "q": "An advance guaranteed by the Central Government is:", "o": ["NPA for classification but standard for income recognition", "Standard for classification but NPA for income recognition", "Standard for both classification and income recognition", "NPA for both classification and income recognition"], "a": 1, "e": "A Central Government guaranteed advance stays Standard for classification, but income is not recognised until realised."}, {"c": "Guarantee", "t": "IRAC · NPA", "q": "A State-Government guaranteed advance overdue for more than 90 days is NPA for:", "o": ["Neither of the two", "Provisioning only", "Both provisioning and income recognition", "Income recognition only"], "a": 2, "e": "A State-guaranteed advance overdue for more than 90 days is NPA for both provisioning and income recognition."}, {"c": "Consortium", "t": "IRAC · NPA", "q": "In consortium advances, each member bank classifies based on:", "o": ["The average recovery of all banks", "Its own recovery record", "The security valuation of the lead bank", "The lead bank's recovery record"], "a": 1, "e": "Each consortium member classifies on its own recovery record."}, {"c": "Consortium", "t": "IRAC · NPA", "q": "If remittances are pooled with one bank and not shared, the other member banks treat the non-serviced accounts as:", "o": ["Restructured", "Standard", "Overdue", "NPA"], "a": 3, "e": "If recoveries are pooled with one bank and not shared, other members treat the accounts as NPA."}, {"c": "Erosion", "t": "IRAC · NPA", "q": "If the realisable value of security is less than 50% of the value assessed, the asset is classified as:", "o": ["Doubtful", "Sub-standard", "Loss", "Standard"], "a": 0, "e": "Security worth less than 50% of the assessed value signals significant erosion, so the asset is doubtful."}, {"c": "Erosion", "t": "IRAC · NPA", "q": "If the realisable value of security is less than 10% of the outstanding, the asset is classified as:", "o": ["Sub-standard", "Loss", "Standard", "Doubtful"], "a": 1, "e": "Security worth less than 10% of the outstanding signals severe erosion, so the asset is a loss asset."}, {"c": "Erosion", "t": "IRAC · NPA", "q": "Advances against term deposits, NSCs and insurance policies need NOT be classified as NPA if:", "o": ["There is adequate margin in the accounts", "There is a lien on the stocks of the borrower", "There is a guarantee from the Government", "There is a registered mortgage on the property"], "a": 0, "e": "Advances against term deposits, NSCs and policies are well covered, so they are not NPA if margin is adequate."}, {"c": "Crops", "t": "IRAC · NPA", "q": "A short-duration crop loan becomes NPA if overdue for:", "o": ["One crop season", "Three crop seasons", "Four crop seasons", "Two crop seasons"], "a": 3, "e": "A short-duration crop loan becomes NPA if principal or interest is overdue for two crop seasons."}, {"c": "Crops", "t": "IRAC · NPA", "q": "A long-duration crop loan becomes NPA if overdue for:", "o": ["Three crop seasons", "Two crop seasons", "One crop season", "Half a crop season"], "a": 2, "e": "A long-duration crop loan becomes NPA after one crop season."}, {"c": "Crops", "t": "IRAC · NPA", "q": "A crop with a season of more than one year is a:", "o": ["Plantation crop", "Short-duration crop", "Long-duration crop", "Cash crop"], "a": 2, "e": "A crop with a season of more than one year is long-duration."}, {"c": "Staff", "t": "IRAC · NPA", "q": "For staff housing loans where interest is payable after recovery of principal, interest is not treated as overdue in:", "o": ["The first half-year", "The first quarter", "The first year", "The first month"], "a": 1, "e": "On staff housing loans, interest is not treated as overdue in the first quarter, because it is paid after the principal."}, {"c": "Staff", "t": "IRAC · NPA", "q": "Staff advances by a bank as an employer are included in the schedule of other assets under:", "o": ["Advances", "Investments", "Fixed assets", "Others"], "a": 3, "e": "Staff advances by the bank as employer are shown under 'Others' in the schedule of other assets."}, {"c": "Calamity", "t": "IRAC · NPA", "q": "Agricultural advances hit by natural calamities may be:", "o": ["Rescheduled, with NPA classification per the rescheduled terms", "Recalled, with NPA classification applied at once by the bank", "Ignored, with NPA classification deferred for five years", "Waived, with NPA classification written off by the bank"], "a": 0, "e": "After natural calamities, loans can be rescheduled, and NPA status follows the rescheduled terms."}, {"c": "SMA", "t": "IRAC · NPA", "q": "SMA-1 accounts are overdue for:", "o": ["91 to 120 days", "31 to 60 days", "61 to 90 days", "1 to 30 days"], "a": 1, "e": "SMA-1 accounts are overdue between 31 and 60 days."}, {"c": "SMA", "t": "IRAC · NPA", "q": "SMA-2 accounts are overdue for:", "o": ["61 to 90 days", "31 to 60 days", "91 to 180 days", "1 to 30 days"], "a": 0, "e": "SMA-2 accounts are overdue between 61 and 90 days, just short of NPA."}, {"c": "SMA", "t": "IRAC · NPA", "q": "SMA-0 accounts are overdue for:", "o": ["61 to 90 days", "31 to 60 days", "91 to 120 days", "Up to 30 days"], "a": 3, "e": "SMA-0 accounts are overdue up to 30 days."}, {"c": "SMA", "t": "IRAC · NPA", "q": "SMA classification is:", "o": ["A provisioning method for the loss assets of the bank", "A sector classification for the priority sector loans", "An early-warning system before the account becomes NPA", "A final classification after the account becomes NPA"], "a": 2, "e": "SMA flags stress early, so the bank can act before the account turns NPA."}, {"c": "Meaning", "t": "Drawing Power", "q": "Drawing Power is:", "o": ["The amount up to which a bank can lend to a single borrower", "The amount of security available to the bank against the advance", "The amount up to which a borrower can withdraw from the sanctioned limit", "The amount of margin money deposited by the borrower"], "a": 2, "e": "Drawing power is the limit that can actually be drawn, computed from the primary security and margin."}, {"c": "Meaning", "t": "Drawing Power", "q": "The account must remain within:", "o": ["The drawing power but not the sanctioned limit", "Both the drawing power and the sanctioned limit", "Either the drawing power or the sanctioned limit", "The sanctioned limit but not the drawing power"], "a": 1, "e": "An account must stay within both the sanctioned limit and the drawing power; exceeding either is flagged."}, {"c": "Meaning", "t": "Drawing Power", "q": "DP should be based on stock statements not older than:", "o": ["Six months", "One month", "One year", "Three months"], "a": 3, "e": "Stock statements older than three months make DP unreliable, and such accounts become irregular."}, {"c": "Stock audit", "t": "Drawing Power", "q": "A stock audit is mandatory for accounts with funded exposure exceeding:", "o": ["₹5 crore", "₹50 lakh", "₹10 crore", "₹1 crore"], "a": 0, "e": "Banks must carry out a stock audit for accounts with funded exposure above ₹5 crore."}, {"c": "Stock audit", "t": "Drawing Power", "q": "In consortium cases, stock audit reports are obtained from:", "o": ["The borrower", "The RBI", "The lead bank", "The member banks"], "a": 2, "e": "In consortium cases, stock audit reports are taken from the lead bank."}, {"c": "Computation", "t": "Drawing Power", "q": "DP is computed on paid stock, i.e. stock less:", "o": ["Sold stock and unpaid creditors for goods", "Obsolete stock and paid creditors for goods", "Damaged stock and unpaid creditors for services", "Damaged stock and unpaid creditors for goods"], "a": 3, "e": "Only paid stock counts, so damaged stock and unpaid creditors for goods are deducted."}, {"c": "Computation", "t": "Drawing Power", "q": "Stock ₹125 lakh (damaged ₹5 lakh), creditors ₹50 lakh, margin 25%. DP against stock is:", "o": ["₹52.50 lakh", "₹70.00 lakh", "₹60.00 lakh", "₹90.00 lakh"], "a": 0, "e": "125 − 5 − 50 = 70; less 25% margin (17.50) gives 52.50."}, {"c": "Computation", "t": "Drawing Power", "q": "Debtors ₹50 lakh (over 90 days ₹10 lakh), margin 40%. DP against debtors is:", "o": ["₹30.00 lakh", "₹24.00 lakh", "₹16.00 lakh", "₹40.00 lakh"], "a": 1, "e": "50 − 10 = 40; less 40% margin (16.00) gives 24.00."}, {"c": "Computation", "t": "Drawing Power", "q": "With DP against stock of ₹52.50 lakh and against debtors of ₹24.00 lakh, the total DP is:", "o": ["₹76.50 lakh", "₹82.50 lakh", "₹100.00 lakh", "₹70.00 lakh"], "a": 0, "e": "52.50 + 24.00 = 76.50 lakh."}, {"c": "Computation", "t": "Drawing Power", "q": "CA P computed DP of ₹82.50 lakh in that case. This is:", "o": ["Not proper; DP is ₹100.00 lakh", "Proper, as the sanctioned limit is ₹100 lakh", "Not proper; DP is ₹76.50 lakh", "Proper, as margins are applied correctly"], "a": 2, "e": "₹82.50 lakh ignores the exclusions; the correct DP is ₹76.50 lakh."}, {"c": "Concerns", "t": "Audit of Advances", "q": "The auditor's concern of existence in advances is to confirm that they:", "o": ["Represent amounts properly sanctioned by the board", "Represent amounts genuinely due to the bank", "Represent amounts duly classified as standard", "Represent amounts fully secured by collateral"], "a": 1, "e": "Existence means advances are genuine amounts due to the bank, supported by loan documents."}, {"c": "Concerns", "t": "Audit of Advances", "q": "Provisioning on advances is checked against:", "o": ["Board norms, tax rules and statutory ratios", "SEBI norms, listing rules and disclosure ratios", "ICAI norms, audit standards and peer review rules", "RBI norms, accounting standards and accepted practices"], "a": 3, "e": "Provisions are checked against RBI norms, accounting standards and accepted practice."}, {"c": "Evidence", "t": "Audit of Advances", "q": "In obtaining audit evidence on advances, the auditor examines security for:", "o": ["Existence, enforceability and valuation", "Quantity, quality and storage", "Ownership, location and insurance", "Cost, depreciation and obsolescence"], "a": 0, "e": "Security must exist, be enforceable and be properly valued, otherwise the advance is under-secured."}, {"c": "Controls", "t": "Audit of Advances", "q": "A good control over advances is that documents are executed:", "o": ["At the time of the audit", "At the time of the annual review", "After the advances are made", "Before the advances are made"], "a": 3, "e": "Documents must be executed before the advance is made, so the bank has legal rights from the start."}, {"c": "Controls", "t": "Audit of Advances", "q": "The Drawing Power Register is updated:", "o": ["Quarterly and verified by the borrower", "Annually and verified by the auditor", "Monthly and verified by an officer", "Half-yearly and verified by the manager"], "a": 2, "e": "The Drawing Power Register is updated monthly and checked by an officer so that limits are not exceeded."}, {"c": "Controls", "t": "Audit of Advances", "q": "Each advance account is reviewed at least:", "o": ["Half-yearly, with the same reviews for all the advances", "Annually, with more frequent reviews for large advances", "Every three years, with annual reviews for large advances", "Quarterly, with less frequent reviews for large advances"], "a": 1, "e": "Each account is reviewed at least annually, and large ones more often, to catch deterioration."}, {"c": "Controls", "t": "Audit of Advances", "q": "Margins against securities are maintained to cover:", "o": ["A delay in receipts from the borrowers", "A rise in interest rates on the advances", "A change in the policies of the RBI", "A decline in value of the securities"], "a": 3, "e": "Margins protect the bank against a fall in the value of security."}, {"c": "Revenue", "t": "Revenue &amp; Expenses", "q": "Under RBI's materiality direction, income exceeding what percentage of total income is recognised on accrual?", "o": ["1%", "5%", "10%", "2%"], "a": 0, "e": "Income above 1% of total income (or of PBT, if reckoned gross) is recognised on accrual under AS 9."}, {"c": "Revenue", "t": "Revenue &amp; Expenses", "q": "Income below the RBI materiality threshold may be recognised on:", "o": ["Accrual basis, with a qualification", "Accrual basis, without a qualification", "Cash basis, without a qualification", "Cash basis, with a qualification"], "a": 2, "e": "Immaterial income below the threshold may be on cash basis; this need not lead to a qualification."}, {"c": "Revenue", "t": "Revenue &amp; Expenses", "q": "Income on an NPA is recognised:", "o": ["On a cash basis after 90 days", "Only when realised", "On the due date of the instalment", "On accrual basis"], "a": 1, "e": "Income on an ut loan is a long-term loan that replaces a short-term or bridge loan."}, {"c": "Revenue", "t": "Revenue &amp; Expenses", "q": "Income on take-out finance classified as NPA is recognised:", "o": ["Only when realised", "On accrual basis", "On a cash basis after 90 days", "On the date of takeover"], "a": 0, "e": "If the account is NPA, income on take-out finance is recognised only when realised."}, {"c": "Revenue", "t": "Revenue &amp; Expenses", "q": "Partially realised interest in NPA accounts can be taken to income, but NOT from:", "o": ["The guarantor's payments to the bank", "The borrower's own deposits with the bank", "Fresh or additional credit facilities", "The same credit facility given earlier"], "a": 2, "e": "Realised interest on NPAs can be taken to income, but not if funded from fresh or additional facilities."}, {"c": "Revenue", "t": "Revenue &amp; Expenses", "q": "Uncollected interest reversed from the P&amp;L in NPA accounts is recorded in:", "o": ["A memorandum account", "The provision account", "The reserve account", "The suspense account"], "a": 0, "e": "Uncollected interest reversed from P&amp;L is kept in a memorandum account and excluded from gross advances."}, {"c": "Revenue", "t": "Revenue &amp; Expenses", "q": "Commission on letters of credit and guarantees is classified under:", "o": ["Profit on sale of investments", "Miscellaneous income", "Commission, exchange and brokerage", "Interest earned"], "a": 2, "e": "Commission on letters of credit and guarantees falls under commission, exchange and brokerage."}, {"c": "Expenses", "t": "Revenue &amp; Expenses", "q": "The reasonableness of interest expense is assessed by comparing:", "o": ["The deposit growth rate with the loan growth rate of the bank", "The branch profit with the head office profit for the period", "The interest earned with the interest paid in the same period", "The weighted average rate with the actual average rate in the accounts"], "a": 3, "e": "Comparing the weighted average rate from deposit balances with the actual average rate tests reasonableness of interest expense."}, {"c": "Expenses", "t": "Revenue &amp; Expenses", "q": "An analytical procedure for interest on deposits is to compare the current average rate with:", "o": ["Government bond rates", "Previous years' average rates", "Peer banks' loan rates", "Next year's budget rates"], "a": 1, "e": "Comparing the current average rate with earlier years highlights unusual movements."}, {"c": "Expenses", "t": "Revenue &amp; Expenses", "q": "To compute the weighted average rate, the auditor obtains deposit analysis at:", "o": ["Each month-start", "Each week-end", "Each year-end", "Each quarter-end"], "a": 3, "e": "A quarter-end analysis of deposits gives the data for the weighted average rate."}, {"c": "Expenses", "t": "Revenue &amp; Expenses", "q": "Provisions on standard and non-performing assets are checked by verifying loan classification on:", "o": ["A sample basis", "A complete basis", "An estimated basis", "A budgeted basis"], "a": 0, "e": "Loan classification is checked on a sample basis because testing every account is impractical."}, {"c": "Expenses", "t": "Revenue &amp; Expenses", "q": "Operating expenses are verified through internal control evaluation, trend analysis and:", "o": ["Inspection of the cash reserves", "Substantive analytical procedures", "Observation of the branch operations", "Confirmation by the depositors"], "a": 1, "e": "Operating expenses are verified through controls, trend analysis and substantive analytical procedures."}, {"c": "Scenario", "t": "Scenarios", "q": "Kanishka Ceramics gets a ₹100 lakh cash credit and a ₹10 lakh bank guarantee. These are, respectively:", "o": ["Non-funded (term finance) and funded (statutory obligation)", "Funded (statutory obligation) and non-funded (working capital)", "Funded (working capital) and non-funded (statutory obligation)", "Non-funded (working capital) and funded (statutory obligation)"], "a": 2, "e": "A cash credit funds working capital, whereas a bank guarantee is an assurance for a statutory or contractual obligation."}, {"c": "Scenario", "t": "Scenarios", "q": "The system marks ten term-loan accounts as SMA. The auditor understands that these accounts are:", "o": ["Already written off as they are loss assets", "Showing early stress but not yet past 90 days", "Already restructured as they are sub-standard", "Already NPA as they are past 90 days"], "a": 1, "e": "SMA accounts show early stress but are not past 90 days, so they are not yet NPA."}, {"c": "Scenario", "t": "Scenarios", "q": "A borrower's OD account shows large credits on 28 March which are reversed in April. The auditor should:", "o": ["Treat the account as standard since the limit was not exceeded at year-end", "Ignore the reversals since they fall in the next financial year of the bank", "Accept the credits as genuine since they fall before the balance sheet date", "Suspect window dressing and examine whether the account is really regular"], "a": 3, "e": "Regularised near BS date."}, {"c": "Scenario", "t": "Scenarios", "q": "A borrower's cash credit shows balance above DP for the entire quarter, though below the sanctioned limit. The account is:", "o": ["Regular, since the balance is within the sanctioned limit", "Overdue, since the interest is outstanding for 60 days", "Out of order, since the balance continuously exceeds the drawing power", "Standard, since the security is adequate to cover the balance"], "a": 2, "e": "The balance continuously exceeds the drawing power, which is one of the out-of-order tests."}, {"c": "Scenario", "t": "Scenarios", "q": "The branch suspects a fraud by a borrower. The auditor of the bank should:", "o": ["Report to the RBI under the circular on bank frauds", "Keep it confidential under the duty of confidentiality to the bank", "Wait for the management to decide whether it should be reported", "Report only to the shareholders at the next general meeting"], "a": 0, "e": "Auditors const LAB=['A','B','C','D'];
let cur='All', order=[], pos=0;
const answered=new Array(DECK.length).fill(null);
const $=id=>document.getElementById(id);
const stage=$('stage'),navwrap=$('navwrap'),elProg=$('prog'),elCount=$('count'),elScore=$('score'),
      btnPrev=$('prev'),btnNext=$('next'),btnReveal=$('reveal'),chipsEl=$('chips');
function build(shuf){
  order=[];DECK.forEach((c,i)=>{if(cur==='All'||c.t===cur)order.push(i);});
  if(shuf){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;
}
function drawChips(){
  const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
</body>
