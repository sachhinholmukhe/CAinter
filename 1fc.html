<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 1 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

const DECK = [{"c": "Origin", "t": "Origin &amp; Meaning", "q": "The word 'audit' comes from the Latin word 'audire', which means:", "o": ["To certify", "To verify", "To record", "To hear"], "a": 3, "e": "Medieval auditors literally listened as accounts were read aloud to detect errors."}, {"c": "Origin", "t": "Origin &amp; Meaning", "q": "Kautilya's Arthashastra, referring to yearly accounting and audit, belongs to:", "o": ["4th century BC India", "12th century AD India", "18th century AD Britain", "19th century AD Britain"], "a": 0, "e": "Ancient Indian roots of audit; Arthashastra mentions yearly accounts and audits."}, {"c": "Origin", "t": "Origin &amp; Meaning", "q": "The Institute of Chartered Accountants of India was set up in:", "o": ["1956", "1860", "1949", "1913"], "a": 2, "e": "ICAI was established in 1949; British India appointed its first Auditor General in 1860."}, {"c": "Meaning", "t": "Origin &amp; Meaning", "q": "As defined, an audit is an independent examination of the financial information of:", "o": ["A profit-oriented entity only, with a view to certifying its accounts", "Any entity, whatever its size or legal form, with a view to expressing an opinion", "Any entity above a size threshold, with a view to detecting fraud", "A company only, with a view to preparing its financial statements"], "a": 1, "e": "The definition covers profit-oriented or not, irrespective of size or legal form."}, {"c": "Meaning", "t": "Origin &amp; Meaning", "q": "What does the auditor do with the financial statements prepared by management?", "o": ["Guarantees their accuracy", "Approves and publishes them", "Prepares and certifies them", "Expresses an opinion on them"], "a": 3, "e": "The auditor does not prepare or certify accounts; he forms and reports an opinion."}, {"c": "Meaning", "t": "Origin &amp; Meaning", "q": "The statement 'audit begins where accounting ends' means that:", "o": ["Accounting and audit are performed at the same time by one person", "Accounting records the transactions and audit then examines them", "Audit records the transactions and accounting then examines them", "Audit is needed only where no accounting records exist"], "a": 1, "e": "Accountancy produces the statements; audit independently examines them."}, {"c": "Meaning", "t": "Origin &amp; Meaning", "q": "Which of the following is a duty of the auditor in forming an opinion?", "o": ["Verifying that entries are backed by sufficient appropriate evidence", "Safeguarding the assets of the entity from misuse", "Preparing the classification of items in the statements", "Approving the accounting policies on behalf of the management"], "a": 0, "e": "Management prepares and safeguards; the auditor substantiates entries and checks classification and fairness."}, {"c": "Independence", "t": "Independence", "q": "Independence of the auditor is best described as:", "o": ["Freedom from fees so that the engagement is carried out at no cost", "Freedom from management so that no discussions are needed", "Freedom from influence so that judgment is objective and unbiased", "Freedom from rules so that procedures can be chosen as he likes"], "a": 2, "e": "Independence = objectivity = no bias."}, {"c": "Independence", "t": "Independence", "q": "An auditor's CEO-client appoints the CEO's sister's firm as auditor. The main threat is:", "o": ["Familial", "Business", "Financial", "Employment"], "a": 0, "e": "Family ties create a conflict of interest."}, {"c": "Independence", "t": "Independence", "q": "Ms. Meera audits LMN Corp. and owns substantial shares in it. The threat is:", "o": ["Employment", "Familial", "Financial", "Business"], "a": 2, "e": "Self-interest — a rosy report protects her own shareholding."}, {"c": "Independence", "t": "Independence", "q": "Mr. Sameer audits BuildWell Ltd. and also runs a consultancy serving it. The threat is:", "o": ["Financial", "Business", "Employment", "Familial"], "a": 1, "e": "He may go soft on the audit to protect the consultancy income."}, {"c": "Independence", "t": "Independence", "q": "Ms. Neha audits XYZ Technologies where she recently was the CFO. The threat is:", "o": ["Financial", "Business", "Familial", "Employment"], "a": 3, "e": "Familiarity/self-review: she may be reviewing her own past work."}, {"c": "Users", "t": "Users &amp; Related Subjects", "q": "Which user of financial statements is mainly interested in liquidity, debt levels and repayment capacity?", "o": ["Employees and unions", "Regulators and tax authorities", "Creditors and lenders", "Investors and shareholders"], "a": 2, "e": "Lenders judge creditworthiness; investors look at earnings, growth and dividends."}, {"c": "Users", "t": "Users &amp; Related Subjects", "q": "Which user is mainly interested in standards compliance and tax obligations?", "o": ["Employees", "Customers", "Investors", "Regulators"], "a": 3, "e": "Regulators check legal and regulatory compliance."}, {"c": "Users", "t": "Users &amp; Related Subjects", "q": "CSR and environmental impact in the statements are of most interest to:", "o": ["The public and community", "Customers and suppliers", "Investors and lenders", "Management and the Board"], "a": 0, "e": "The public wants to understand economic and social impact."}, {"c": "Other subjects", "t": "Users &amp; Related Subjects", "q": "Sampling makes an audit feasible and keeps it scientific. This is the contribution of:", "o": ["Economics", "Statistics", "Financial management", "Behavioural science"], "a": 1, "e": "Statistics supports sampling; behavioural science supports inquiry and communication."}, {"c": "Other subjects", "t": "Users &amp; Related Subjects", "q": "Which subject helps the auditor in inquiring of people and reading behaviour?", "o": ["Statistics and sampling", "Economics", "Production management", "Behavioural science"], "a": 3, "e": "Audit involves inquiry of people, so communication and reading behaviour matter."}, {"c": "Other subjects", "t": "Users &amp; Related Subjects", "q": "ERP and IT systems audit is an application of the link between audit and:", "o": ["Law and regulation", "Accountancy and costing", "Data processing (EDP / IT)", "Economics and policy"], "a": 2, "e": "IT audit is a growing discipline as finance goes digital."}, {"c": "Objective", "t": "SA 200 &amp; Assurance", "q": "Which is one of the two objectives of the auditor under SA 200?", "o": ["Prepare the FS to be reported on to the shareholders", "Obtain reasonable assurance that the FS are free from material misstatement", "Obtain absolute assurance that the FS are free from every misstatement", "Detect every fraud and report each one to the Registrar"], "a": 1, "e": "Objectives: (1) reasonable assurance; (2) report and communicate as the SAs require."}, {"c": "Reasonable assurance", "t": "SA 200 &amp; Assurance", "q": "Reasonable assurance is:", "o": ["High, but not total, confidence that the FS are free from material misstatement", "Moderate confidence obtained from a review of the draft FS only", "Complete certainty that the FS are free from any error whatsoever", "Low confidence obtained from enquiry and analytical procedures alone"], "a": 0, "e": "It is the standard model of auditing; absolute assurance is impractical."}, {"c": "Reasonable assurance", "t": "SA 200 &amp; Assurance", "q": "Absolute assurance is NOT achievable in an audit because it would require:", "o": ["Reliance on management and would be quick to complete", "Sampling of items and would be inexpensive to carry out", "Judgment by the auditor and would be easy to document", "100% verification of everything and would be prohibitively costly"], "a": 3, "e": "Sampling and human limits make it impossible; it would eliminate judgment."}, {"c": "Reasonable assurance", "t": "SA 200 &amp; Assurance", "q": "Which feature is of reasonable assurance and NOT of absolute assurance?", "o": ["Removes the need for professional judgment", "Accepts a small risk of undetected misstatement", "Assumes zero risk of undetected misstatement", "Requires 100% verification of all transactions"], "a": 1, "e": "Reasonable assurance accepts a small residual risk and relies heavily on judgment."}, {"c": "Misstatement", "t": "Misstatement &amp; Framework", "q": "A misstatement is a difference between the reported item and the framework's requirement in respect of:", "o": ["Amount, authorisation, posting or documentation", "Audit, compilation, review or certification", "Amount, classification, presentation or disclosure", "Accuracy, completeness, validity or cut-off"], "a": 2, "e": "A-C-P-D: Amount, Classification, Presentation, Disclosure."}, {"c": "Misstatement", "t": "Misstatement &amp; Framework", "q": "Which is NOT one of the four forms a misstatement can take?", "o": ["Inefficient management of working capital", "Omission of necessary information", "Inaccurate processing of data", "Misapplication of accounting policies"], "a": 0, "e": "Forms: inaccuracies, omissions, misapplication of policies, inappropriate judgments/estimates."}, {"c": "Misstatement", "t": "Misstatement &amp; Framework", "q": "A misstatement is considered material if it could:", "o": ["Be detected by a test of controls", "Influence the economic decisions of users", "Be corrected before the end of the audit", "Be traced to a single transaction"], "a": 1, "e": "The test is user decision-based."}, {"c": "Framework", "t": "Misstatement &amp; Framework", "q": "The financial reporting framework is:", "o": ["The criteria used to prepare and audit the statements", "The sampling plan used to select items to be audited", "The working paper file maintained by the auditor", "The engagement letter agreed with the management"], "a": 0, "e": "Recognition, measurement, presentation and disclosure criteria — the benchmark for evaluating the FS."}, {"c": "Framework", "t": "Misstatement &amp; Framework", "q": "Which of these is NOT a component of the financial reporting framework?", "o": ["Accounting standards", "Industry guidelines of RBI and IRDAI", "Companies Act, 2013 and Income-tax Act, 1961", "The auditor's own audit programme"], "a": 3, "e": "The framework is the entity's criteria; the audit programme is the auditor's own plan."}, {"c": "Limitations", "t": "Inherent Limitations", "q": "Why can't an auditor give absolute assurance or 'certify' the FS?", "o": ["Because of the reluctance of the management", "Because of the size of the entity being audited", "Because of the inherent limitations of an audit", "Because of the cost of the audit to the entity"], "a": 2, "e": "Four forms of the same question, one answer: inherent limitations."}, {"c": "Limitations", "t": "Inherent Limitations", "q": "How many heads of inherent limitations does the chapter list?", "o": ["Six", "Three", "Five", "Four"], "a": 2, "e": "Nature of financial reporting, nature of audit procedures, not an investigation, timeliness and relevance, future events."}, {"c": "Limitations", "t": "Inherent Limitations", "q": "Collusion that defeats internal controls falls under which head?", "o": ["Timeliness of information", "Audit is not an investigation", "Future events", "Nature of financial reporting"], "a": 3, "e": "Subjective judgments and control override are features of financial reporting."}, {"c": "Limitations", "t": "Inherent Limitations", "q": "Sampling and reliance on management's information fall under:", "o": ["Timeliness and relevance", "Nature of audit procedures", "Nature of financial reporting", "Future events"], "a": 1, "e": "Auditors test on a sample; they are also not forgery experts."}, {"c": "Limitations", "t": "Inherent Limitations", "q": "The auditor's lack of legal power to compel disclosure shows that:", "o": ["Audit is not an investigation", "Audit is a guarantee of accuracy", "Audit is a check on the management", "Audit is a form of inspection"], "a": 0, "e": "No power of search or compulsion, so fraud cannot be guaranteed to surface."}, {"c": "Limitations", "t": "Inherent Limitations", "q": "Market shifts after the audit that change the financial health of the entity fall under:", "o": ["Nature of audit procedures used", "Future events beyond the audit date", "Nature of financial reporting done", "Timeliness and relevance of information"], "a": 1, "e": "Future events are outside the auditor's control."}, {"c": "Inherent Limitations", "t": "Inherent Limitations", "q": "An audit is not a guarantee of absolute accuracy. It provides:", "o": ["Limited assurance that the FS are free from material misstatement", "Assurance that the entity will continue to operate in the future", "Reasonable assurance that the FS are free from material misstatement", "Absolute assurance that the FS are free from all misstatement"], "a": 2, "e": "Because of inherent limitations (testing, judgment, estimates, fraud concealment), an audit gives reasonable, not absolute, assurance."}, {"c": "Benefits of Audit", "t": "Benefits of Audit", "q": "Early discovery of errors and frauds through audit is a benefit relating to:", "o": ["Goodwill and valuation", "Borrowing facilities", "Insurance claim settlement", "Error and fraud detection"], "a": 3, "e": "Audit examines records in depth, so errors and frauds are detected and also deterred."}, {"c": "Benefits", "t": "Benefits of Audit", "q": "Audited accounts help a business obtain bank credit. This benefit is:", "o": ["Borrowing facilities", "Licences", "Insurance claim settlement", "Tax settlement"], "a": 0, "e": "Banks and lenders lend more readily against audited accounts because the figures are credible."}, {"c": "Benefits", "t": "Benefits of Audit", "q": "Insurers rely on audited figures to settle claims for loss of stock. This benefit is:", "o": ["Licences from regulators", "Insurance claim settlement", "Settlement of disputes", "Tax settlement benefit"], "a": 1, "e": "Insurers rely on audited stock and accounts to verify the loss claimed, so audit helps settle claims."}, {"c": "Benefits", "t": "Benefits of Audit", "q": "Audit gives credible evidence in a dispute with partners or suppliers. The benefit is:", "o": ["Settlement of disputes", "Advisory role of auditor", "Moral check on conduct", "Records kept up to date"], "a": 0, "e": "Audited accounts are independent evidence, so they help settle disputes among partners or with suppliers."}, {"c": "Benefits", "t": "Benefits of Audit", "q": "Reliable audited data used for mergers and acquisitions is the benefit of:", "o": ["Confidence of the users", "Licences from regulators", "Goodwill and business valuation", "Internal control evaluation"], "a": 2, "e": "Reliable audited data supports valuation of goodwill and the business in mergers and acquisitions."}, {"c": "Benefits", "t": "Benefits of Audit", "q": "Which is NOT a benefit of audit?", "o": ["Support for accurate tax reporting", "Credible evidence in disputes with others", "Easier borrowing from banks and lenders", "Guarantee that no fraud exists in the entity"], "a": 3, "e": "An audit cannot guarantee freedom from fraud."}, {"c": "Mandatory vs Voluntary", "t": "Mandatory vs Voluntary", "q": "Statutory audit of a company under the Companies Act, 2013 is mandatory:", "o": ["For listed companies above a net worth threshold", "For every company, with no turnover threshold", "For public companies, with no turnover threshold", "For companies above a turnover threshold only"], "a": 1, "e": "The threshold concept belongs to tax audit, not company audit."}, {"c": "Mandatory vs Voluntary", "t": "Mandatory vs Voluntary", "q": "Tax audit under Sec 44AB of the Income-tax Act, 1961 is:", "o": ["Based on turnover thresholds", "Mandatory for every company", "Mandatory for every business", "Voluntary for every professional"], "a": 0, "e": "Tax audit is turnover-threshold based."}, {"c": "Mandatory vs Voluntary", "t": "Mandatory vs Voluntary", "q": "A statement 'a company must be audited only if its turnover crosses a threshold' is wrong because it:", "o": ["Mixes up company audit with internal audit", "Mixes up company audit with cost audit", "Mixes up company audit with tax audit", "Mixes up company audit with secretarial audit"], "a": 2, "e": "Statutory company audit: Sec 139/143/129; tax audit: Sec 44AB."}, {"c": "Appointment", "t": "Mandatory vs Voluntary", "q": "Who appoints the auditor of a company?", "o": ["The Board at its first meeting", "The Registrar of Companies", "The Central Government", "The shareholders at the AGM"], "a": 3, "e": "Company auditors are appointed by shareholders at the AGM."}, {"c": "Appointment", "t": "Mandatory vs Voluntary", "q": "The auditor of a government entity is appointed by:", "o": ["The Comptroller and Auditor General of India", "The Registrar of Companies", "The Institute of Chartered Accountants of India", "The Central Vigilance Commission"], "a": 0, "e": "CAG audits government finances."}, {"c": "Appointment", "t": "Mandatory vs Voluntary", "q": "The audit report of a partnership firm is addressed to:", "o": ["The members", "The Income-tax department", "The partners", "The Registrar of Firms"], "a": 2, "e": "The partners appoint the auditor and receive the report."}, {"c": "Scope", "t": "Scope &amp; GPFS", "q": "Which of the following is within the scope of the auditor?", "o": ["Authenticating documents as a forgery expert", "Conducting an official investigation with search powers", "Assessing the physical condition of machinery and buildings", "Evaluating internal controls and verifying disclosure"], "a": 3, "e": "Physical condition, forgery and investigation need other expertise or powers."}, {"c": "Scope", "t": "Scope &amp; GPFS", "q": "Which is OUTSIDE the scope of an audit?", "o": ["Reviewing historical information for consistency across periods", "Detecting every specific fraud through targeted fraud hunting", "Verifying the accuracy of the summaries and policies", "Checking compliance with the Companies Act and RBI norms"], "a": 1, "e": "Audit focuses on the overall true and fair view, not targeted fraud hunting."}, {"c": "Scope", "t": "Scope &amp; GPFS", "q": "Clean Earth Ltd. did not disclose an NGT notice with a heavy penalty and said the auditor was going beyond scope. The auditor is:", "o": ["Wrong to examine it, since a legal notice is outside scope", "Wrong to examine it, unless the amount is paid during the year", "Right to examine it, since a potential material liability is within scope", "Right to examine it, only if the Board asks for it in writing"], "a": 2, "e": "Scope is defined by impact on the FS, not by the label of the topic."}, {"c": "GPFS", "t": "Scope &amp; GPFS", "q": "General purpose financial statements are prepared to meet:", "o": ["The common needs of a wide range of users", "The needs of regulators for supervision only", "The needs of management for internal use", "The specific needs of one particular user"], "a": 0, "e": "Statements prepared for one particular user's need become special purpose statements."}, {"c": "GPFS", "t": "Scope &amp; GPFS", "q": "Which is NOT part of a complete set of financial statements under IAS 1?", "o": ["Accounting policies and explanatory notes", "A cash flow statement", "A balance sheet", "A directors' report on the entity"], "a": 3, "e": "Complete set: balance sheet, income statement, changes in equity, cash flow statement, policies and notes."}, {"c": "Responsibility", "t": "Scope &amp; GPFS", "q": "Which is the responsibility of management and NOT of the auditor?", "o": ["Expressing an opinion on whether the FS give a true and fair view", "Maintaining adequate accounting records and internal controls", "Obtaining reasonable assurance on whether the FS are misstated", "Communicating the findings of the audit in a written report"], "a": 1, "e": "Management prepares and controls; the auditor opines."}, {"c": "Responsibility", "t": "Scope &amp; GPFS", "q": "Which statement is correct?", "o": ["An audit does not relieve management of its responsibilities", "An audit relieves management of its responsibility for the FS", "The opinion reflects on the efficiency of the management", "The opinion is a guarantee of the future viability of the entity"], "a": 0, "e": "The opinion speaks only to whether the FS are true and fair."}, {"c": "Qualities", "t": "Scope &amp; GPFS", "q": "In the chapter, which is NOT a personal attribute of an auditor?", "o": ["Integrity and discretion", "Judgment and patience", "Aggressive bargaining", "Tact and caution"], "a": 2, "e": "Personal attributes include tact, caution, firmness, good temper, integrity, discretion, industry, judgment, patience and reliability."}, {"c": "AASB", "t": "Standards &amp; SQC", "q": "Standards on Auditing (SAs) issued by the AASB are numbered in the range:", "o": ["3000–3699", "2000–2699", "1000–1999", "100–999"], "a": 3, "e": "SAs 100–999; SREs 2000–2699; SAEs 3000–3699; SRSs 4000–4699."}, {"c": "AASB", "t": "Standards &amp; SQC", "q": "Review of historical financial information is governed by:", "o": ["Standards on Assurance Engagements", "Standards on Review Engagements", "Standards on Related Services", "Standards on Auditing"], "a": 1, "e": "SREs are numbered 2000–2699 and give limited assurance."}, {"c": "AASB", "t": "Standards &amp; SQC", "q": "Agreed-upon procedures are governed by:", "o": ["Standards on Assurance Engagements", "Standards on Review Engagements", "Standards on Related Services", "Standards on Auditing"], "a": 2, "e": "SRSs are numbered 4000–4699 and give no assurance."}, {"c": "AASB", "t": "Standards &amp; SQC", "q": "Assurance engagements other than audit or review of historical information are governed by:", "o": ["Standards on Related Services", "Standards on Auditing", "Standards on Review Engagements", "Standards on Assurance Engagements"], "a": 3, "e": "SAEs 3000–3699 give limited assurance."}, {"c": "SA series", "t": "Standards &amp; SQC", "q": "Which series of SAs relates to risk assessment and response to assessed risks?", "o": ["500–599", "300–499", "200–299", "700–799"], "a": 1, "e": "200–299 general principles; 300–499 risk assessment; 500–599 audit evidence; 600–699 using work of others; 700–799 conclusions and reporting."}, {"c": "SA series", "t": "Standards &amp; SQC", "q": "The SAs on audit evidence fall in the range:", "o": ["500–599", "500–580", "600–699", "400–499"], "a": 0, "e": "The audit evidence band is 500–599."}, {"c": "SA series", "t": "Standards &amp; SQC", "q": "SAs dealing with audit conclusions and reporting are in the series:", "o": ["700–799", "800–899", "500–599", "600–699"], "a": 0, "e": "700–799 conclusions and reporting; 800–899 specialised areas."}, {"c": "Issuing SAs", "t": "Standards &amp; SQC", "q": "In the process of issuing an SA, which step comes immediately after the Exposure Draft is circulated to members for comment?", "o": ["The draft is submitted to the Council of the Institute", "The AASB identifies the area needing a new SA", "The SA is issued under the authority of the Council", "AASB finalises the draft considering the comments"], "a": 3, "e": "Flow: identify area → exposure draft → circulate → finalise → Council → issue."}, {"c": "Issuing SAs", "t": "Standards &amp; SQC", "q": "An SA is issued under the authority of:", "o": ["The Auditing and Assurance Standards Board", "The Study Group of the AASB", "The Council of the Institute", "The Ministry of Corporate Affairs"], "a": 2, "e": "The AASB frames; the Council authorises issue."}, {"c": "SQC", "t": "Standards &amp; SQC", "q": "SQC 1 applies to:", "o": ["Only assurance engagements covered by the SAEs", "All engagements covered by SAs, SREs, SAEs and SRSs", "Only review engagements covered by the SREs", "Only audit engagements covered by the SAs"], "a": 1, "e": "SQC is the umbrella over all engagement standards."}, {"c": "SQC", "t": "Standards &amp; SQC", "q": "SQC 1 requires a firm to:", "o": ["Rotate the engagement partner after every audit", "Submit every report to ICAI for quality review", "Appoint a partner to approve every report personally", "Establish a quality control system for its engagements"], "a": 3, "e": "The system ensures compliance with standards and issue of the right reports."}, {"c": "SQC", "t": "Standards &amp; SQC", "q": "A member departs materially from the SAs. The consequence is that he:", "o": ["Must get the permission of ICAI, and may then sign the report", "Must state the reason for departure, and may face disciplinary action", "Must withdraw from the audit, and cannot sign the report", "Need not state the reason, and cannot face disciplinary action"], "a": 1, "e": "Clause (9) of Part I of the Second Schedule to the CA Act, 1949 deals with non-compliance."}, {"c": "Assurance", "t": "Assurance Engagements", "q": "A three-party relationship in an assurance engagement consists of:", "o": ["Auditor, management and internal auditor", "Auditor, shareholders and the Registrar", "Practitioner, responsible party and intended users", "Practitioner, regulator and responsible party"], "a": 2, "e": "Intended users are other than the responsible party."}, {"c": "Assurance", "t": "Assurance Engagements", "q": "Which is NOT an element of an assurance engagement?", "o": ["An engagement letter from the practitioner", "Appropriate subject matter to be examined", "A written assurance report issued", "Suitable criteria for evaluation"], "a": 0, "e": "P-S-C-E-R: Parties, Subject matter, Criteria, Evidence, Report."}, {"c": "Assurance", "t": "Assurance Engagements", "q": "In a statutory audit, 'suitable criteria' are:", "o": ["Audit programmes drawn up by the engagement partner", "Standards, laws and regulations used to evaluate the subject matter", "Sampling methods used to select the items for testing", "Terms of the engagement letter signed by the management"], "a": 1, "e": "Criteria are the benchmarks for evaluation."}, {"c": "Assurance", "t": "Assurance Engagements", "q": "Evidence in an assurance engagement should be:", "o": ["Sufficient and appropriate", "Complete and conclusive", "Written and signed", "Voluminous and independent"], "a": 0, "e": "Sufficient = quantity; appropriate = quality."}, {"c": "Audit vs review", "t": "Assurance Engagements", "q": "Compared with an audit, a review engagement provides:", "o": ["A lower level of assurance with more procedures", "The same level of assurance with fewer procedures", "A lower level of assurance with fewer procedures", "A higher level of assurance with fewer procedures"], "a": 2, "e": "Audit = reasonable (high) assurance; review = limited assurance."}, {"c": "Audit vs review", "t": "Assurance Engagements", "q": "The correct ladder of assurance, from highest to lowest, is:", "o": ["Review, audit, agreed-upon procedures, prospective information", "Audit, review, prospective information, agreed-upon procedures", "Prospective information, audit, review, agreed-upon procedures", "Audit, prospective information, review, agreed-upon procedures"], "a": 3, "e": "Reasonable &gt; moderate &gt; limited &gt; none."}, {"c": "Prospective FI", "t": "Assurance Engagements", "q": "An examination of prospective financial information gives:", "o": ["A moderate level of assurance", "No assurance whatsoever", "A reasonable level of assurance", "An absolute level of assurance"], "a": 0, "e": "The practitioner cannot opine that results will be achieved."}, {"c": "Case study", "t": "Case Studies", "q": "Mr. Ramesh buys shares of a listed company because its audited statements look healthy and he believes his money is safe. His belief is:", "o": ["Correct — audited FS guarantee the safety of investments", "Correct — audit covers the future share price movements", "Incorrect — audit applies only to unlisted companies", "Incorrect — audit gives only reasonable assurance on the FS"], "a": 3, "e": "Share prices depend on many factors beyond financial performance."}, {"c": "Case study", "t": "Case Studies", "q": "RS &amp; Co. did proper procedures, but a manager colluded with dealers and the accountant to book small fake purchases. The audit is:", "o": ["Negligent — the auditor should have tested all the purchases", "Not necessarily negligent — collusion is an inherent limitation", "Invalid — the auditor should have been an investigator", "Negligent — the auditor ought to have detected the collusion"], "a": 1, "e": "Failure of internal control through collusion; the auditor reasonably relied on it."}, {"c": "Case study", "t": "Case Studies", "q": "CA Suresh could not get external confirmations from some debtors and used e-invoices, e-way bills and bank receipts. He must:", "o": ["Ignore the departure since the alternatives gave comfort", "Disclaim an opinion since confirmations were not obtained", "Document how the alternatives met the purpose and why he departed", "Qualify the opinion since the confirmations were not received"], "a": 2, "e": "Document the alternative procedures and the reason for departure; the report draws attention to it."}, {"c": "Case study", "t": "Case Studies", "q": "A client reports ₹2 crore of sales. Checking that recorded sales actually exist and are supported by invoices tests the assertion of:", "o": ["Presentation", "Occurrence", "Completeness", "Cut-off"], "a": 1, "e": "Existence of sales = occurrence; all sales recorded = completeness; right period = cut-off."}];

const LAB=['A','B','C','D'];
let cur='All', order=[], pos=0;
const answered=new Array(DECK.length).fill(null);
const $=id=>document.getElementById(id);
const stage=$('stage'),navwrap=$('navwrap'),elProg=$('prog'),elCount=$('count'),elScore=$('score'),
      btnPrev=$('prev'),btnNext=$('next'),btnReveal=$('reveal'),chipsEl=$('chips');
function build(shuf){
  order=[];DECK.forEach((c,i)=>{if(cur==='All'||c.t===cur)order.push(i);});
  if(shuf){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;
}
function drawChips(){
  const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
</body>
</html>
