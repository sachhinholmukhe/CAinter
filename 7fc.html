<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 7 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

const DECK = [{"c": "Meaning", "t": "SA 560 · Subsequent Events", "q": "Subsequent events are events occurring between the date of the FS and:", "o": ["The date of the next audit, plus events known before then", "The date of filing of the return, plus the events known later", "The date of the AGM, plus facts known after the meeting", "The date of the auditor's report, plus facts known after that date"], "a": 3, "e": "Includes facts discovered after the report date."}, {"c": "Types", "t": "SA 560 · Subsequent Events", "q": "Insolvency of a major debtor after the year-end but before the report date is:", "o": ["A non-adjusting event, as it arose after the year-end date", "An adjusting event, as it evidences a condition existing at the year-end", "An event to be ignored, as it relates to the debtor only", "A disclosure-only event, as it is a matter of the next year"], "a": 1, "e": "The debtor's insolvency evidences a condition (doubtful recovery) that existed at the year-end, so the receivable is adjusted."}, {"c": "Types", "t": "SA 560 · Subsequent Events", "q": "Settlement of a provided legal claim at a lower amount after the year-end is:", "o": ["An adjusting event requiring revision of the provision", "An event of the next year requiring no action", "A non-adjusting event requiring disclosure alone", "A contingent event requiring a fresh provision"], "a": 0, "e": "A provision already made for the claim is adjusted to the settled amount, because the claim existed at the balance sheet date."}, {"c": "Types", "t": "SA 560 · Subsequent Events", "q": "Destruction of substantial inventories by fire after the year-end is typically:", "o": ["Adjusted by creating a provision in the year-end accounts", "Ignored since the loss falls in the next period of account", "Disclosed in the notes, with no adjustment to the figures", "Adjusted in the inventory figures at the year-end date"], "a": 2, "e": "Arose after → disclose."}, {"c": "Types", "t": "SA 560 · Subsequent Events", "q": "Announcement of a planned merger after the year-end is:", "o": ["Adjusting; the figures are revised", "Non-adjusting; disclosed if material", "Ignorable; the event concerns the next year", "Adjusting; a provision is created"], "a": 1, "e": "A planned merger announced after the year-end does not change conditions at the balance sheet date, so it is only disclosed if material."}, {"c": "Types", "t": "SA 560 · Subsequent Events", "q": "Issue of new share capital after the balance sheet date is:", "o": ["An adjusting event, recorded at the year-end", "An event requiring the audit report to be modified", "A non-adjusting event, disclosed if material", "An event ignored in the accounts of the year"], "a": 2, "e": "New capital issued after the year-end affects future position, not year-end conditions, so it is disclosed, not adjusted."}, {"c": "Types", "t": "SA 560 · Subsequent Events", "q": "Which is NOT an adjusting event?", "o": ["Insolvency of a major debtor after the year-end", "Settlement of a provided claim after the year-end", "Discovery of fraud relating to the year under audit", "Fire destroying substantial inventories after the year-end"], "a": 3, "e": "Fire arose after → non-adjusting."}, {"c": "Types", "t": "SA 560 · Subsequent Events", "q": "A fact that existed at the balance sheet date and is learned after the year-end but before the report date should be:", "o": ["Adjusted in the financial statements", "Reported only to those charged with governance", "Ignored until the next year's audit", "Only disclosed in the notes to accounts"], "a": 0, "e": "Existed at the date of the FS, so the figures are adjusted; conditions arising later are only disclosed."}, {"c": "Procedures", "t": "SA 560 · Subsequent Events", "q": "Procedures for events between the FS date and the report date include:", "o": ["Testing controls over sales and vouching the purchases of the year", "Understanding management's procedures and reading minutes after the FS date", "Confirming balances with debtors and observing the next inventory count", "Recalculating depreciation and re-performing the bank reconciliation"], "a": 1, "e": "SA 560 requires the auditor to understand management's procedures to identify subsequent events and to read minutes of meetings held after the FS date."}, {"c": "Procedures", "t": "SA 560 · Subsequent Events", "q": "If minutes of meetings after the FS date are not yet available, the auditor should:", "o": ["Inquire about the matters discussed at the meetings", "Ignore the meetings since the minutes are not yet signed", "Wait until the minutes are prepared and then date the report", "Rely on the representation of the secretarial auditor alone"], "a": 0, "e": "If minutes are not yet prepared, inquiry about the matters discussed is the substitute for reading them."}, {"c": "Procedures", "t": "SA 560 · Subsequent Events", "q": "Reading the latest interim FS, if available, helps to:", "o": ["Confirm the appointment of the auditor for the next year", "Replace the audit of the FS for the year under audit", "Determine the audit fee for the next year of the audit", "Compare with the audited FS and spot new information"], "a": 3, "e": "Other sources: records, budgets, forecasts."}, {"c": "Procedures", "t": "SA 560 · Subsequent Events", "q": "Which is NOT a procedure for identifying subsequent events?", "o": ["Reading the latest interim financial statements, if available", "Reading minutes of owners, management and governance meetings", "Seeking confirmation from the bank on the fee payable to the auditor", "Inquiring of management and those charged with governance"], "a": 2, "e": "Others are SA 560 procedures."}, {"c": "Procedures", "t": "SA 560 · Subsequent Events", "q": "The auditor requests written representation that all subsequent events:", "o": ["Affecting the profit have been reported to the regulator", "Relating to the next year have been adjusted in the books", "Occurring up to the date of the AGM have been recorded", "Requiring adjustment or disclosure have been dealt with"], "a": 3, "e": "A written representation under SA 580 confirms that all subsequent events needing adjustment or disclosure have been dealt with."}, {"c": "Date", "t": "SA 560 · Subsequent Events", "q": "The auditor's report must not be dated before the auditor has obtained:", "o": ["Approval of the shareholders for the audited financial statements", "Confirmation of the fee payable for the audit assignment", "Sufficient appropriate evidence about subsequent events", "The signed representation of the board for the report of directors"], "a": 2, "e": "Dating the report earlier would imply evidence on subsequent events that the auditor has not yet obtained."}, {"c": "Date", "t": "SA 560 · Subsequent Events", "q": "'Date the FS are issued' is the date on which the report and audited FS are:", "o": ["Made available to third parties", "Adopted by the members in the AGM", "Approved by the board of directors", "Signed by the auditor in the office"], "a": 0, "e": "Not earlier than the date of the auditor's report."}, {"c": "After report", "t": "SA 560 · Subsequent Events", "q": "A fact becomes known after the report date but before the FS are issued. The first step is to:", "o": ["Issue the report as it is and inform the regulator", "Discuss the matter with management and those charged with governance", "Modify the report at once without consulting the management", "Withdraw the report and resign from the audit engagement"], "a": 1, "e": "Then determine need for amendment."}, {"c": "After report", "t": "SA 560 · Subsequent Events", "q": "If management amends the FS, the auditor should provide a new report that is dated:", "o": ["On the date of the original report issued earlier", "On the date of the discovery of the fact by the auditor", "Not earlier than the approval of the amended FS", "On the date of the end of the financial year audited"], "a": 2, "e": "A new report on amended FS cannot be dated before the amended FS are approved, since procedures must cover that period."}, {"c": "After report", "t": "SA 560 · Subsequent Events", "q": "If management does not amend the FS and the report is NOT yet issued, the auditor should:", "o": ["Modify the opinion as per SA 705 and then issue the report", "Report the matter to the registrar before issuing the report", "Withdraw from the engagement without issuing any report", "Issue an unmodified report with an Other Matter paragraph"], "a": 0, "e": "If management will not amend before issue, the FS are misstated, so the opinion is modified under SA 705."}, {"c": "After report", "t": "SA 560 · Subsequent Events", "q": "If the FS are not amended and the report HAS been issued, the auditor first:", "o": ["Informs the registrar of companies of the matter at once", "Notifies management not to release the FS to third parties", "Issues a new report with a disclaimer of the opinion", "Asks the members to reject the FS at the general meeting"], "a": 1, "e": "Then, if released, seek to prevent reliance."}, {"c": "After report", "t": "SA 560 · Subsequent Events", "q": "If management restricts the amendment to the subsequent event, the auditor may:", "o": ["Issue a new report without any paragraph and keep the original date of the report", "Withdraw the report and disclaim the opinion on the whole of the financial statements", "Refuse to issue any report until the whole of the financial statements are amended", "Amend the report with a restricted date, or issue a new report with an EOM or OM paragraph"], "a": 3, "e": "Where management limits the amendment to the subsequent event, the report may carry a restricted date or an EOM/OM paragraph explaining the limited procedures."}, {"c": "After issue", "t": "SA 560 · Subsequent Events", "q": "Where facts become known after the FS are issued and management amends, the new report includes:", "o": ["A Key Audit Matters paragraph on the amount of the amendment", "A Basis for Qualified Opinion on the earlier report issued", "An Emphasis of Matter or Other Matter paragraph referring to the note", "A Going Concern paragraph on the effect of the amendment"], "a": 2, "e": "Referring to the note and the earlier report."}, {"c": "After issue", "t": "SA 560 · Subsequent Events", "q": "Where facts become known after the FS are issued and management does not amend, the auditor:", "o": ["Qualifies the opinion in the report for the following year", "Issues a disclaimer on the FS of the subsequent year audit", "Withdraws from the engagement and returns the fee collected", "Notifies management that he will seek to prevent reliance on the report"], "a": 3, "e": "Then takes appropriate action."}, {"c": "After issue", "t": "SA 560 · Subsequent Events", "q": "After the FS are issued, the auditor has an obligation to perform:", "o": ["No procedures, unless a fact becomes known that may need an amendment", "Procedures for events up to the end of the next financial year", "Procedures for events up to the filing of the annual return", "Procedures for events up to the date of the AGM of the members"], "a": 0, "e": "After issue there is no duty to perform further procedures, but a fact that comes to light and may need amendment must be acted upon."}, {"c": "After issue", "t": "SA 560 · Subsequent Events", "q": "On an amendment after issue, the auditor also reviews:", "o": ["How the shareholders vote on the amended financial statements", "How management informs recipients of the previously issued FS", "How the tax authority assesses the amended financial statements", "How the registrar updates records of the filed financial statements"], "a": 1, "e": "The auditor reviews how management tells recipients of the issued FS, so users are not left relying on the old statements."}, {"c": "Responsibility", "t": "SA 560 · Subsequent Events", "q": "Between the FS date and the report date, the auditor's responsibility is to:", "o": ["Obtain evidence on events occurring in the next financial year", "Obtain evidence that all events needing adjustment or disclosure are identified", "Verify all events occurring up to the date of the AGM of members", "Detect all events that may affect the future of the entity"], "a": 1, "e": "The auditor must get evidence that all events needing adjustment or disclosure up to the report date are identified, are properly reflected, and are covered by a representation."}, {"c": "Documentation", "t": "SA 560 · Subsequent Events", "q": "Documentation under SA 560 includes procedures performed, events identified and:", "o": ["Dates of the AGM", "Names of the staff", "Fees charged", "Conclusions reached"], "a": 3, "e": "Compliance with SA 560."}, {"c": "Meaning", "t": "SA 570 · Going Concern", "q": "Going concern assumes that the entity will continue in operation for:", "o": ["The life of the current loans, without any renewal of them", "A period of three years, without any change in the business", "The foreseeable future, without intent or need to liquidate", "The period of the audit engagement, without any extension"], "a": 2, "e": "Going concern is the assumption that the entity neither intends nor needs to liquidate or materially curtail operations in the foreseeable future."}, {"c": "Meaning", "t": "SA 570 · Going Concern", "q": "If the entity is not a going concern, the FS are prepared on:", "o": ["A liquidation basis, e.g. inventories written down to NRV", "A historical cost basis, e.g. inventories at the cost of purchase", "A cash basis, e.g. receipts and payments for the period", "A replacement cost basis, e.g. assets at current replacement value"], "a": 0, "e": "If the entity is not a going concern, assets are stated at likely liquidation values, e.g. inventory at NRV."}, {"c": "Responsibility", "t": "SA 570 · Going Concern", "q": "Management's duty to assess going concern applies:", "o": ["Only if the entity is listed on a recognised stock exchange", "Only if the auditor requests such assessment in writing", "Only if the framework explicitly requires such assessment", "Even if the framework does not explicitly require it"], "a": 3, "e": "The management assessment is part of preparing FS and applies even where the framework does not explicitly require it."}, {"c": "Responsibility", "t": "SA 570 · Going Concern", "q": "The absence of reference to a material uncertainty in the auditor's report:", "o": ["Is not a guarantee of the entity's ability to continue", "Is a guarantee of the entity's ability to continue", "Is proof of the sufficiency of the working capital available", "Is evidence of the entity's profitability in the coming year"], "a": 0, "e": "An audit cannot predict future events, so silence on material uncertainty gives no guarantee that the entity will continue."}, {"c": "Objectives", "t": "SA 570 · Going Concern", "q": "The auditor concludes on the appropriateness of management's use of the going concern basis and determines whether:", "o": ["A fraud exists in the entity as per the evidence obtained", "A modification exists in the report of the previous auditor", "A material uncertainty exists about the ability to continue", "A deficiency exists in the controls of the entity audited"], "a": 2, "e": "Plus report per SA 570."}, {"c": "Risk assessment", "t": "SA 570 · Going Concern", "q": "If management has NOT yet assessed going concern, the auditor should:", "o": ["Issue a disclaimer of opinion on the FS without discussion", "Discuss the basis for the assumption and inquire about doubtful conditions", "Report to the registrar and the regulator at the first instance", "Ask management to resign and appoint another set of directors"], "a": 1, "e": "Where management has not assessed, the auditor discusses the basis for the going concern assumption and asks about events or conditions of doubt."}, {"c": "Risk assessment", "t": "SA 570 · Going Concern", "q": "If management HAS assessed going concern, the auditor first:", "o": ["Rejects the assessment and prepares his own assessment of the entity", "Discusses the preliminary assessment and management's identified conditions", "Confirms the assessment with the bankers of the entity audited", "Discloses the assessment in the report without further evaluation"], "a": 1, "e": "Where management has assessed, the auditor discusses the preliminary assessment and then evaluates management's plans."}, {"c": "Assessment period", "t": "SA 570 · Going Concern", "q": "The auditor asks management to extend its assessment period if it is less than:", "o": ["Six months from the date of the FS", "Eighteen months from the date of the FS", "Twelve months from the date of the FS", "Twelve months from the date of the report"], "a": 2, "e": "A look-forward period of at least twelve months from the FS date is expected; a shorter period must be extended."}, {"c": "Assessment period", "t": "SA 570 · Going Concern", "q": "A detailed evaluation of management's assessment may NOT be needed when the entity has:", "o": ["A history of profitable operations and ready access to finance", "A new management and a plan to restructure the operations", "A history of losses and a plan to raise finance in the future", "A pending litigation and a plan to settle it in the near term"], "a": 0, "e": "Other procedures may suffice."}, {"c": "Procedures", "t": "SA 570 · Going Concern", "q": "Additional procedures on identifying conditions of doubt include evaluating the reliability of data in:", "o": ["The tax return filed, and the support for its deductions", "The fixed asset register, and the support for its additions", "The AGM notice issued, and the support for its resolutions", "The cash flow forecast, and support for its assumptions"], "a": 3, "e": "Cash flow forecasts show whether the entity can meet obligations, so the reliability of data and assumptions is tested."}, {"c": "Procedures", "t": "SA 570 · Going Concern", "q": "Management's plans for future actions are evaluated for whether they are:", "o": ["Disclosed in the notes and reported to the shareholders", "Likely to improve the situation and feasible in the circumstances", "Consistent with last year and supported by the lenders", "Approved by the board and recorded in the minutes of meetings"], "a": 1, "e": "Plans matter only if they are likely to improve the position and are practicable in the circumstances."}, {"c": "Procedures", "t": "SA 570 · Going Concern", "q": "On going concern concerns, written representations are obtained on:", "o": ["Management's past record and its compliance with the laws", "Management's choice of the auditor and its re-appointment", "Management's fee for the audit and its timing of payment", "Management's plans for future action and their feasibility"], "a": 3, "e": "A representation on management's plans and their feasibility supports the evidence on going concern."}, {"c": "Conclusion", "t": "SA 570 · Going Concern", "q": "A material uncertainty exists if the potential impact and likelihood are:", "o": ["Remote enough that the plan can be ignored by management", "Insignificant enough that disclosure is avoided in the FS", "Significant enough that disclosure is needed in the FS", "Certain enough that liquidation is ordered by the court"], "a": 2, "e": "A material uncertainty exists when impact and likelihood are significant enough that disclosure in the FS is needed."}, {"c": "Disclosure", "t": "SA 570 · Going Concern", "q": "With a material uncertainty, the FS must disclose the principal events and:", "o": ["Management's plans, and state that the entity may be unable to realise assets and discharge liabilities", "The lenders' plans, and state that the entity may be unable to obtain fresh loans in future", "The auditor's plans, and state that the entity may be unable to appoint the auditor again", "Management's fee, and state that the entity may be unable to pay the auditor on due dates"], "a": 0, "e": "Users need to see the events and plans and a clear statement that the entity may be unable to realise assets and discharge liabilities normally."}, {"c": "Reporting", "t": "SA 570 · Going Concern", "q": "Going concern basis used but inappropriate: the auditor expresses:", "o": ["A disclaimer of opinion", "A qualified opinion", "An unmodified opinion", "An adverse opinion"], "a": 3, "e": "If the going concern basis is itself inappropriate, the FS are materially and pervasively misstated, so an adverse opinion is expressed."}, {"c": "Reporting", "t": "SA 570 · Going Concern", "q": "Going concern appropriate, material uncertainty exists and adequately disclosed: the auditor expresses:", "o": ["An unmodified opinion with a 'Material Uncertainty Related to Going Concern' section", "An adverse opinion with a 'Basis for Adverse Opinion' section on the uncertainty", "A disclaimer of opinion with a 'Basis for Disclaimer' section on the uncertainty", "A qualified opinion with a 'Basis for Qualified Opinion' section on the uncertainty"], "a": 0, "e": "When disclosure is adequate, the FS are fairly presented, so the opinion is unmodified, with a separate section drawing attention to the uncertainty."}, {"c": "Reporting", "t": "SA 570 · Going Concern", "q": "Material uncertainty exists but is NOT adequately disclosed: the auditor expresses:", "o": ["A disclaimer of opinion under SA 705 only", "A qualified or adverse opinion under SA 705", "An unmodified opinion with an Emphasis of Matter", "An unmodified opinion with a Key Audit Matter"], "a": 1, "e": "Inadequate disclosure of a material uncertainty is a misstatement, so the opinion is qualified or adverse under SA 705."}, {"c": "Reporting", "t": "SA 570 · Going Concern", "q": "Management is unwilling to make or extend its going concern assessment: the auditor considers:", "o": ["An adverse opinion or an unmodified opinion", "An unmodified opinion or an adverse opinion", "A qualified opinion or a disclaimer of opinion", "An unmodified opinion with an Emphasis of Matter"], "a": 2, "e": "If management will not assess, evidence cannot be obtained, so a qualified opinion or disclaimer is considered."}, {"c": "Reporting", "t": "SA 570 · Going Concern", "q": "The 'Material Uncertainty Related to Going Concern' section states that the opinion is:", "o": ["Disclaimed in respect of the matter", "Qualified in respect of the matter", "Adverse in respect of the matter", "Not modified in respect of the matter"], "a": 3, "e": "Draws attention to the note."}, {"c": "Reporting", "t": "SA 570 · Going Concern", "q": "Which pairing is WRONG?", "o": ["Uncertainty not disclosed — qualified or adverse", "Uncertainty adequately disclosed — qualified opinion", "Management unwilling to assess — qualified or disclaimer", "Basis inappropriate — adverse opinion"], "a": 1, "e": "Disclosed → unmodified + special section."}, {"c": "Reporting", "t": "SA 570 · Going Concern", "q": "When a material uncertainty is not adequately disclosed, the Basis for Qualified (Adverse) Opinion states that:", "o": ["A material misstatement exists and the FS do not carry the correct amount", "A limitation exists and the auditor could not obtain evidence on it", "A material uncertainty exists and the FS do not adequately disclose it", "A deficiency exists and the controls do not operate as designed"], "a": 2, "e": "The basis paragraph must explain that a material uncertainty exists and the FS fail to disclose it adequately."}, {"c": "Purpose", "t": "SA 450 · Misstatements", "q": "SA 450 deals with the auditor's responsibility to evaluate the effect of:", "o": ["Identified misstatements on the audit and uncorrected ones on the FS", "Identified events on the audit and their disclosure in the notes", "Identified deficiencies on the audit and their reporting to management", "Identified fraud on the audit and its reporting to the regulator"], "a": 0, "e": "SA 450 deals with the effect of identified misstatements on the audit and of uncorrected misstatements on the FS."}, {"c": "Accumulation", "t": "SA 450 · Misstatements", "q": "The auditor accumulates identified misstatements during the audit, except those that are:", "o": ["Clearly material", "Clearly disclosed", "Clearly corrected", "Clearly trivial"], "a": 3, "e": "Accumulate all but trivial."}, {"c": "Accumulation", "t": "SA 450 · Misstatements", "q": "Wrongly capitalising repair expenses of ₹5 lakh is:", "o": ["A control deficiency that is to be reported to management only", "A trivial item that is to be excluded from accumulation", "A misstatement overstating profit, to be accumulated", "A disclosure item that is to be reported in the notes only"], "a": 2, "e": "Capitalising repairs wrongly moves expense to assets, so profit and assets are overstated; the item is accumulated."}, {"c": "Revising plan", "t": "SA 450 · Misstatements", "q": "The audit strategy and plan may need revision if the aggregate of misstatements:", "o": ["Approaches the materiality level set under SA 320", "Exceeds the assurance level set under the SA 700", "Approaches the sampling level set under SA 530", "Exceeds the fee level set under the engagement letter"], "a": 0, "e": "When accumulated misstatements approach materiality, the risk of undetected material misstatement rises, so the strategy and plan are revised."}, {"c": "Revising plan", "t": "SA 450 · Misstatements", "q": "The auditor may request management to examine a class of transactions to:", "o": ["Reduce the audit fee and limit the scope of the audit work", "Understand the cause and determine the actual misstatement", "Obtain the management's consent to the audit conclusions", "Replace the auditor's procedures with management's checking"], "a": 1, "e": "Asking management to examine the class helps find the cause and true extent of the misstatement."}, {"c": "Revising plan", "t": "SA 450 · Misstatements", "q": "If management corrects misstatements on request, the auditor performs:", "o": ["No further procedures since the correction is complete", "Additional procedures to confirm no misstatements remain", "Procedures only after the report has been signed by him", "Procedures only on the corrected items and not on the rest"], "a": 1, "e": "After management corrects, the auditor performs more procedures to be satisfied that no misstatement remains."}, {"c": "Communication", "t": "SA 450 · Misstatements", "q": "Identified misstatements are communicated to the appropriate level of management:", "o": ["Only if they are material to the FS as a whole", "Only if the governance body requests the same", "At the end of the audit, together with the report", "On a timely basis, unless law prohibits"], "a": 3, "e": "Timely communication lets management assess, disagree or correct before the FS are finalised."}, {"c": "Communication", "t": "SA 450 · Misstatements", "q": "If management refuses to correct some misstatements, the auditor should:", "o": ["Understand the reasons and consider them in evaluating the FS as a whole", "Treat the refusal as a trivial matter and ignore it in the opinion", "Resign from the engagement at the earliest and inform the regulator", "Correct the misstatements himself in the books of the entity"], "a": 0, "e": "Management's reasons are considered when judging whether the FS as a whole are free of material misstatement."}, {"c": "Evaluation", "t": "SA 450 · Misstatements", "q": "Before evaluating uncorrected misstatements, the auditor reassesses:", "o": ["Sampling risk under SA 530", "Inherent risk under SA 315", "Materiality under SA 320", "Audit risk under SA 200"], "a": 2, "e": "Materiality may change as actual results become known, so it is reassessed before evaluating uncorrected misstatements."}, {"c": "Evaluation", "t": "SA 450 · Misstatements", "q": "In evaluating uncorrected misstatements, the auditor considers size, nature and:", "o": ["Views of the staff on the matter in the books", "Effect of prior-period uncorrected misstatements", "Effect of the future-period budgeted expenditure", "Cost of correcting them in the books of the entity"], "a": 1, "e": "Prior-period uncorrected misstatements can have a cumulative effect on the current FS."}, {"c": "Governance", "t": "SA 450 · Misstatements", "q": "Material uncorrected misstatements are communicated to those charged with governance, who are asked to:", "o": ["Approve them", "Ignore them", "Waive them", "Correct them"], "a": 3, "e": "Governance is asked to correct material uncorrected misstatements so the FS are fairly presented."}, {"c": "Representation", "t": "SA 450 · Misstatements", "q": "The representation on uncorrected misstatements states management's belief that their effects are:", "o": ["Corrected, individually and in aggregate", "Trivial, individually but not in aggregate", "Immaterial, individually and in aggregate", "Material, individually and in aggregate"], "a": 2, "e": "With a summary of them."}, {"c": "Documentation", "t": "SA 450 · Misstatements", "q": "Under SA 450 the auditor documents the threshold for clearly trivial, all misstatements identified, and:", "o": ["The conclusion on materiality of uncorrected misstatements and its basis", "The conclusion on the fraud risks identified and its basis", "The conclusion on the sampling method used and its basis", "The conclusion on the going concern basis and its basis"], "a": 0, "e": "The file must show the trivial threshold, misstatements identified and the materiality conclusion with its basis."}, {"c": "Flow", "t": "SA 450 · Misstatements", "q": "SA 450 flow starts with:", "o": ["Accumulate, then communicate, then reassess materiality", "Communicate, then accumulate, then reassess materiality", "Reassess materiality, then accumulate, then communicate", "Document, then accumulate, then reassess materiality"], "a": 0, "e": "SA 450 begins with accumulating misstatements (excluding clearly trivial ones), then communicating and requesting correction."}, {"c": "Meaning", "t": "SA 580 · Written Reps", "q": "A written representation is a written statement by:", "o": ["A third party to the auditor confirming the balances in books", "Management to the auditor confirming matters or supporting evidence", "The auditor to management confirming the findings of the audit", "An expert to management confirming the valuation of the assets"], "a": 1, "e": "Not the FS itself."}, {"c": "Meaning", "t": "SA 580 · Written Reps", "q": "Which is a written representation under SA 580?", "o": ["The financial statements prepared by management of the entity", "The books and records maintained by the entity audited", "A letter from management confirming completeness of information", "The assertions embodied in the financial statements issued"], "a": 2, "e": "Excluded: FS, assertions, books."}, {"c": "Limits", "t": "SA 580 · Written Reps", "q": "Written representations alone are:", "o": ["Sufficient appropriate audit evidence", "Better evidence than third-party confirmations", "A substitute for substantive procedures on balances", "Not sufficient appropriate audit evidence"], "a": 3, "e": "A representation only supports other evidence; it cannot replace procedures that confirm the assertion."}, {"c": "Limits", "t": "SA 580 · Written Reps", "q": "If management modifies or withholds requested representations, it may signal:", "o": ["Potential significant issues within the entity", "A reduction in the audit risk assessed earlier", "Greater reliability of the evidence on record", "A routine administrative delay in the entity"], "a": 0, "e": "If management refuses or alters a requested representation, its integrity or the reliability of other evidence may be doubtful."}, {"c": "Objectives", "t": "SA 580 · Written Reps", "q": "Representations about management's responsibilities relate to the preparation of the FS and:", "o": ["Sufficiency of the audit evidence obtained by the auditor", "Adequacy of the audit fee agreed in the engagement letter", "Compliance of the auditor with the ethical standards", "Completeness of information provided to the auditor"], "a": 3, "e": "The key representations are that management has prepared the FS per the framework and has given complete information and access."}, {"c": "From whom", "t": "SA 580 · Written Reps", "q": "Representations are requested from management with appropriate responsibility and:", "o": ["Sufficient tenure of the service with the entity", "Sufficient knowledge of the matters represented", "Sufficient experience of the audit of the entity", "Sufficient shareholding in the entity audited"], "a": 1, "e": "Representations come from those with responsibility for the FS and sufficient knowledge of the matters."}, {"c": "From whom", "t": "SA 580 · Written Reps", "q": "Qualifying words such as 'to the best of its knowledge and belief' are:", "o": ["Acceptable, only if the auditor has no doubts about the entity", "Never acceptable, as they dilute the evidence of the representation", "Acceptable, if made by those with the responsibility and knowledge", "Never acceptable, as they shift the responsibility to the auditor"], "a": 2, "e": "Qualifying words are acceptable when made by people with responsibility and knowledge, and the auditor can ask that inquiries were made."}, {"c": "Responsibilities", "t": "SA 580 · Written Reps", "q": "The two key representations about responsibilities are that management has fulfilled its duty to prepare the FS and:", "o": ["Filed the returns and paid the taxes due on time", "Held the board meetings and kept the minutes properly", "Appointed the auditor and fixed the audit fee payable", "Provided all information and recorded all transactions"], "a": 3, "e": "Management confirms it prepared the FS per the framework, gave all information and recorded all transactions."}, {"c": "Responsibilities", "t": "SA 580 · Written Reps", "q": "Reconfirmation of management's responsibilities is appropriate when:", "o": ["The terms of the engagement were prepared in a previous year", "The entity is a listed company with a large public interest", "The audit is being performed for the first year of engagement", "The auditor has issued a modified opinion in the earlier year"], "a": 0, "e": "If the terms were prepared in a previous year, management may no longer recall its responsibilities, so they are reconfirmed."}, {"c": "Responsibilities", "t": "SA 580 · Written Reps", "q": "Reconfirmation is also appropriate when the persons who signed the terms:", "o": ["Have been named as the key persons in the report", "No longer have relevant responsibilities", "Have been elected as the directors of the entity", "Have been given a raise in remuneration"], "a": 1, "e": "If the signatories no longer have responsibility, the acknowledgement is stale and is reconfirmed."}, {"c": "Other reps", "t": "SA 580 · Written Reps", "q": "Other representations may cover title to assets, liens and:", "o": ["The sales target set, and the bonus declared for the staff", "The auditor's remuneration, and the date of the AGM of members", "Plans affecting carrying values, and non-compliance with laws", "The tax rate applied, and the dividend declared in the year"], "a": 2, "e": "Other representations can cover accounting policies, plans affecting carrying values, title to assets and non-compliance with laws."}, {"c": "Other reps", "t": "SA 580 · Written Reps", "q": "The auditor may request a representation that management has communicated:", "o": ["All meetings held by the board of which it has minutes", "All fees paid to the auditor of which it has a record", "All litigations in the entity of which it has no knowledge", "All deficiencies in internal control of which it is aware"], "a": 3, "e": "A representation that all known control deficiencies were communicated supports completeness of the auditor's communication."}, {"c": "Date", "t": "SA 580 · Written Reps", "q": "The date of the written representations should be:", "o": ["As close as practicable to, but not after, the date of the report", "As close as practicable to, but not before, the date of the FS", "As close as practicable to, but not before, the date of filing", "As close as practicable to, but not after, the date of the AGM"], "a": 0, "e": "The representation is as near as possible to the report date, but never after it, because it is evidence needed before reporting."}, {"c": "Date", "t": "SA 580 · Written Reps", "q": "Representations should cover:", "o": ["Only the periods that were audited by the auditor", "Only the period of the present management", "All FS and periods referred to in the report", "Only the current period of the report"], "a": 2, "e": "Even if management changed."}, {"c": "Form", "t": "SA 580 · Written Reps", "q": "Written representations should be in the form of:", "o": ["A resolution passed by the board of directors", "A representation letter addressed to the auditor", "A notice sent to the members of the company", "A certificate issued by the company secretary"], "a": 1, "e": "A formal representation letter addressed to the auditor documents management's confirmations."}, {"c": "Form", "t": "SA 580 · Written Reps", "q": "The representation letter:", "o": ["Is destroyed after the retention period of the working papers", "Is returned to management after the report is issued", "Is filed with the registrar along with the annual accounts", "Becomes part of the audit documentation and is retained"], "a": 3, "e": "The letter is audit evidence, so it forms part of the documentation and is retained."}, {"c": "Not provided", "t": "SA 580 · Written Reps", "q": "If requested representations are not provided, the auditor first:", "o": ["Issues an adverse opinion on the FS with an Other Matter", "Discusses with management and re-evaluates its integrity", "Reports the matter to the regulator at the first instance", "Disclaims the opinion without any discussion with management"], "a": 1, "e": "The auditor first discusses with management and reconsiders its integrity before deciding on the impact on the opinion."}, {"c": "Disclaimer", "t": "SA 580 · Written Reps", "q": "A disclaimer under SA 580 is triggered by:", "o": ["Doubt on the auditor's independence, or failure to give representations on fees", "Doubt on the sampling approach, or failure to give representations on controls", "Doubt on management's integrity, or failure to give representations on responsibilities", "Doubt on the going concern basis, or failure to give representations on estimates"], "a": 2, "e": "Doubt on integrity, or failure to give representations on responsibilities, means evidence cannot be obtained, so disclaimer is required under SA 705."}, {"c": "Disclaimer", "t": "SA 580 · Written Reps", "q": "The form of modification on non-provision of representations is decided as per:", "o": ["SA 705", "SA 720", "SA 706", "SA 700"], "a": 0, "e": "SA 705 governs the form of opinion modification when evidence cannot be obtained."}, {"c": "Importance", "t": "SA 260 · Governance", "q": "Two-way communication with governance helps the auditor to:", "o": ["Obtain information relevant to the audit, while maintaining independence", "Obtain the control over the entity, while maintaining the management", "Obtain the approval for the report, while maintaining a safe position", "Obtain the fee for the audit, while maintaining a client relationship"], "a": 0, "e": "Two-way communication gives the auditor information about the entity and helps governance oversee reporting, while independence is maintained."}, {"c": "TCWG", "t": "SA 260 · Governance", "q": "Those charged with governance are the persons responsible for:", "o": ["Auditing the books of account and certifying the financial statements", "Managing the day-to-day operations and implementing the policies of the entity", "Overseeing the strategic direction and accountability, including financial reporting", "Regulating the entity and monitoring compliance with laws and standards"], "a": 2, "e": "Board, trustees, partners, owner-manager."}, {"c": "TCWG", "t": "SA 260 · Governance", "q": "Which may be 'those charged with governance'?", "o": ["Statutory auditors or internal auditors", "Board of directors, trustees or partners", "Lenders of the entity or its creditors", "Registrar of companies or the regulator"], "a": 1, "e": "Those charged with governance are the persons responsible for overseeing direction and accountability, such as the board, trustees or partners."}, {"c": "Objectives", "t": "SA 260 · Governance", "q": "Which is NOT an objective of SA 260?", "o": ["Obtaining information relevant to the audit from governance", "Communicating the auditor's responsibilities and the scope", "Promoting effective two-way communication throughout", "Obtaining the approval of governance for the audit fee"], "a": 3, "e": "SA 260 is about communication; approval of the audit fee by governance is not an objective of the standard."}, {"c": "Matters", "t": "SA 260 · Governance", "q": "Matters to be communicated include the auditor's responsibilities, the planned scope and timing, and:", "o": ["Significant staff of the audit", "Significant findings from the audit", "Significant fees from the audit", "Significant working papers of the audit"], "a": 1, "e": "The auditor communicates responsibilities, planned scope and timing, and significant findings."}, {"c": "Matters", "t": "SA 260 · Governance", "q": "Communicating that the auditor forms an opinion while management prepares the FS clarifies:", "o": ["Audit responsibilities", "Independence", "Planned scope", "Significant findings"], "a": 0, "e": "Telling governance that the auditor gives an opinion while management prepares the FS explains the audit responsibilities."}, {"c": "Independence", "t": "SA 260 · Governance", "q": "For listed entities, the auditor communicates compliance with independence requirements and:", "o": ["Contracts and orders that may affect the auditor, with copies of the same", "Relationships and holdings that may affect the dividend, with details of the same", "Appointments and fees that may affect the AGM, with notices of the same", "Relationships and fees that may affect independence, with safeguards applied"], "a": 3, "e": "For listed entities, the auditor confirms compliance with independence and discloses relationships and fees with safeguards."}, {"c": "Process", "t": "SA 260 · Governance", "q": "Written communication of significant findings is used when:", "o": ["Oral communication is not permitted", "The governance is not interested in them", "Oral communication is not adequate", "The auditor is not available in person"], "a": 2, "e": "When oral communication is not adequate, significant findings are given in writing."}, {"c": "Process", "t": "SA 260 · Governance", "q": "If matters are communicated orally, the auditor documents:", "o": ["Where and in what language they were conveyed", "How and for what fee they were discussed", "Why and by whom they were drafted", "When and to whom they were communicated"], "a": 3, "e": "Oral communication is documented with when and to whom it was made, so there is a record."}, {"c": "Process", "t": "SA 260 · Governance", "q": "The auditor evaluates whether the communication process was:", "o": ["Approved by the shareholders at the general meeting held", "Adequate for the purpose of the audit, and acts if it was not", "Certified by the secretarial auditor of the entity audited", "Consistent with the process of the previous auditor's audit"], "a": 1, "e": "The auditor checks that two-way communication was adequate for the audit's purpose, and considers the effect if it was not."}, {"c": "Purpose", "t": "SA 265 · Control Deficiencies", "q": "The audit assesses internal control to identify risks of material misstatement, not to:", "o": ["Design the substantive procedures in response to the risks", "Understand the control environment in the entity audited", "Express an opinion on the effectiveness of internal control", "Communicate the deficiencies found to the management"], "a": 2, "e": "The purpose of understanding controls is to assess risks of misstatement, not to give an opinion on their effectiveness."}, {"c": "Meaning", "t": "SA 265 · Control Deficiencies", "q": "A deficiency in internal control exists when a control fails to prevent or correct misstatements on time or:", "o": ["A necessary control is missing", "A necessary control is complex", "A necessary control is costly", "A necessary control is manual"], "a": 0, "e": "A deficiency exists if a control cannot prevent or correct misstatements on time or if a needed control is missing."}, {"c": "Meaning", "t": "SA 265 · Control Deficiencies", "q": "A significant deficiency is one that in the auditor's judgment:", "o": ["Merits the disclosure in the notes to the FS of the entity", "Merits the modification of the opinion in the report issued", "Merits the attention of those charged with governance", "Merits the correction by the staff of the accounts department"], "a": 2, "e": "A significant deficiency is serious enough to merit the attention of those charged with governance."}, {"c": "Factors", "t": "SA 265 · Control Deficiencies", "q": "Which is a factor for judging whether a deficiency is significant?", "o": ["Volume of transactions exposed to the deficiency", "Age of the staff handling that area of the entity", "Location of the office or branch of the entity audited", "Fee charged for the audit of that area of the entity"], "a": 0, "e": "Factors include likelihood of misstatement, risk of fraud, estimate complexity, importance of the control and volume of transactions affected."}, {"c": "Factors", "t": "SA 265 · Control Deficiencies", "q": "Which is NOT a factor in determining significance of a deficiency?", "o": ["Likelihood of a material misstatement", "Complexity of estimates like fair value", "Importance of the control to reporting", "The audit fee agreed for the engagement"], "a": 3, "e": "Others are listed factors."}, {"c": "Indicators", "t": "SA 265 · Control Deficiencies", "q": "Which is an indicator of a significant deficiency?", "o": ["A late filing of the return corrected by the accountant", "Management fraud not prevented by internal control", "A small difference in petty cash noticed by the cashier", "A change in the stationery used by the staff of the entity"], "a": 1, "e": "Management fraud that internal control did not prevent shows the control environment is weak."}, {"c": "Indicators", "t": "SA 265 · Control Deficiencies", "q": "Management's failure to address previously reported deficiencies is:", "o": ["An indicator of a trivial deficiency", "A reason to ignore earlier communications", "An indicator of a significant deficiency", "A reason to withdraw from the engagement"], "a": 2, "e": "Management's failure to fix reported deficiencies is an indicator of a significant deficiency."}, {"c": "Communication", "t": "SA 265 · Control Deficiencies", "q": "Significant deficiencies are communicated:", "o": ["In writing to those charged with governance", "Orally to the audit committee chairperson", "In writing to the registrar of companies", "Orally to the employees of the department"], "a": 0, "e": "SA 265 requires significant deficiencies to be communicated in writing to those charged with governance."}, {"c": "Communication", "t": "SA 265 · Control Deficiencies", "q": "The SA 265 communication must include a description of the deficiencies and:", "o": ["Their tax effect", "Their potential effects", "Their audit fee", "Their historical cost"], "a": 1, "e": "The communication should describe the deficiencies and their potential effects."}, {"c": "Communication", "t": "SA 265 · Control Deficiencies", "q": "The communication clarifies that the audit was to express an opinion on:", "o": ["The management, not the financial statements", "The compliance, not the internal controls", "The internal controls, not the financial statements", "The financial statements, not the internal controls"], "a": 3, "e": "The communication notes that the audit was to express an opinion on the FS, not on internal control."}, {"c": "Scenario", "t": "Scenarios", "q": "CA Rohan wrote one line: 'Physical verification of inventories is not conducted at regular intervals.' The communication is:", "o": ["Excessive; deficiencies are to be reported orally to management", "Sufficient; a single line is enough to describe the deficiency", "Incorrect; inventory deficiencies are not reported under SA 265", "Insufficient; it lacks the potential effects and a corrective action"], "a": 3, "e": "SA 265 needs a description of the deficiency, potential effects and enough detail to act; a single line does not provide that."}, {"c": "Scenario", "t": "Scenarios", "q": "Sneha Rao audits an exporter. A buyer sued on 1 June 2022 over a batch shipped in August 2021, and management agreed to pay ₹5 crore. The event is:", "o": ["Ignorable, as the amount is settled out of court by the company", "Adjusting, as the condition existed at the year-end date", "Non-adjusting, as the claim was filed after the year-end date", "A contingent liability, as the settlement is yet to be paid"], "a": 1, "e": "The defect relates to goods shipped before the year-end, so the obligating condition existed at the balance sheet date (SA 560)."}, {"c": "Scenario", "t": "Scenarios", "q": "In the Sneha Rao case, if management neither adjusts nor discloses a material provision, she should:", "o": ["Withdraw the report and not issue any report in the matter at all", "Add an Emphasis of Matter and issue an unmodified report as usual", "Modify the report under SA 705 for the omission of the provision", "Report the matter to the registrar of companies directly at once"], "a": 2, "e": "An unrecorded material provision is a misstatement, so the report is modified under SA 705 if it is not adjusted."}, {"c": "Scenario", "t": "Scenarios", "q": "In the Sneha Rao case, a provision is appropriate because the settlement is:", "o": ["Probable and capable of reasonable estimation", "Remote and incapable of reasonable estimation", "Certain and capable of full disclosure only", "Possible and capable of approximate estimation"], "a": 0, "e": "AS 29 requires a provision when the outflow is probable and a reliable estimate can be made; here a settlement has been decided."}, {"c": "Scenario", "t": "Scenarios", "q": "To be sure no subsequent event is overlooked, after inquiries, minutes and books, Meera Kapoor should:", "o": ["Obtain written representations from management on subsequent events", "Obtain the opinion of the legal counsel on all pending cases", "Obtain confirmations from the debtors on the closing balances", "Obtain a certificate from the secretarial auditor of the entity"], "a": 0, "e": "A representation from management that all subsequent events needing adjustment or disclosure were dealt with adds an assurance layer on completeness."}, {"c": "Scenario", "t": "Scenarios", "q": "A manufacturer faces labour shortages, lost orders, creditors unpaid and bankers unwilling to support. Management should present:", "o": ["A notice to creditors with a request to waive the dues", "A supportable cash flow forecast with mitigation plans", "A revised sales target with an incentive plan for staff", "A fresh appointment of the auditor with a lower fee"], "a": 1, "e": "A realistic cash flow forecast with mitigation plans demonstrates whether the entity can continue as a going concern."}, {"c": "Scenario", "t": "Scenarios", "q": "In the labour-shortage case, the auditor should assess the forecast against:", "o": ["Tax returns and customs records, and test the compliance of filings", "Industry rankings and competitor profits, and test the pricing policy", "Budget estimates and staff opinion, and test the morale of workers", "Historical performance and industry conditions, and test data reliability"], "a": 3, "e": "The forecast is tested for consistency with historical performance and industry conditions, and the reliability of its data."}, {"c": "Scenario", "t": "Scenarios", "q": "Management says a representation on responsibilities is irrelevant near completion. The auditor explains that refusal could lead to:", "o": ["An adverse opinion under SA 705", "An unmodified opinion with an EOM", "A disclaimer of opinion under SA 705", "A qualified opinion under SA 700"], "a": 2, "e": "A representation on responsibilities is necessary evidence; its refusal can lead to a disclaimer under SA 705."}, {"c": "Scenario", "t": "Scenarios", "q": "A report dated 10 May is finalised, but the representation letter is dated 20 May. This is:", "o": ["Wrong; the letter should not be dated after the report", "Right; the letter is not required if the report is signed", "Wrong; the letter should be dated before the year-end", "Right; the letter can carry any date after the report"], "a": 0, "e": "The representation is evidence needed before reporting, so it cannot carry a date after the report date."}, {"c": "Scenario", "t": "Scenarios", "q": "Audit report dated 5 June. On 12 June, before the FS are issued, a material fact emerges and management refuses to amend. The auditor, report not yet issued, should:", "o": ["Issue the report as dated 5 June with an Other Matter paragraph", "Modify the opinion as per SA 705 before issuing the report", "Withdraw the report and not issue any report in the matter", "Issue the report as dated 5 June after informing the registrar"], "a": 1, "e": "Because the fact affects the FS and management refuses to amend, the opinion is modified under SA 705 before the report is issued."}, {"c": "Scenario", "t": "Scenarios", "q": "A company's assessment covers only eight months from the FS date. The auditor should:", "o": ["Accept it since the period is within the financial year", "Extend it himself to the date of the report issued", "Ask management to extend it to at least twelve months", "Reject the FS and disclaim the opinion on the same"], "a": 2, "e": "A shorter look-forward period must be extended to at least twelve months from the FS date."}];

const LAB=['A','B','C','D'];
let cur='All', order=[], pos=0;
const answered=new Array(DECK.length).fill(null);
const $=id=>document.getElementById(id);
const stage=$('stage'),navwrap=$('navwrap'),elProg=$('prog'),elCount=$('count'),elScore=$('score'),
      btnPrev=$('prev'),btnNext=$('next'),btnReveal=$('reveal'),chipsEl=$('chips');
function build(shuf){
  order=[];DECK.forEach((c,i)=>{if(cur==='All'||c.t===cur)order.push(i);});
  if(shuf){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;
}
function drawChips(){
  const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
