<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 5 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

const DECK = [{"c": "Assertions", "t": "Assertions", "q": "Confirming a customer balance with the customer at year-end mainly tests which assertion?", "o": ["Existence", "Occurrence", "Classification", "Cut-off"], "a": 0, "e": "A confirmation shows the receivable exists at the balance sheet date; occurrence, cut-off and classification relate to transactions."}, {"c": "Assertions", "t": "Assertions", "q": "Tracing goods dispatched in the last week of the year to invoices raised in the same period mainly tests:", "o": ["Existence", "Cut-off", "Rights and obligations", "Valuation"], "a": 1, "e": "Cut-off means transactions are recorded in the right period; the last days before year-end carry the greatest risk."}, {"c": "Assertions", "t": "Assertions", "q": "'The inventory listed physically exists at the period-end' is an assertion of:", "o": ["Completeness", "Rights and obligations", "Valuation", "Existence"], "a": 3, "e": "Physical presence → existence."}, {"c": "Assertions", "t": "Assertions", "q": "'The entity owns the building and has clear title' is an assertion of:", "o": ["Existence", "Presentation", "Rights and obligations", "Completeness"], "a": 2, "e": "Ownership → rights and obligations."}, {"c": "Assertions", "t": "Assertions", "q": "'Goods dispatched on 31 March are not recorded as April sales' is an assertion of:", "o": ["Accuracy", "Occurrence", "Cut-off", "Allocation"], "a": 2, "e": "Recorded in the correct period."}, {"c": "Assertions", "t": "Assertions", "q": "'Inventory is valued at the lower of cost and NRV' is an assertion of:", "o": ["Completeness", "Cut-off", "Existence", "Valuation"], "a": 3, "e": "Valuing inventory at the lower of cost and NRV (AS 2) is a valuation assertion: it concerns the amount at which the asset is stated."}, {"c": "Assertions", "t": "Assertions", "q": "'Every legitimate sale has been recorded' is an assertion of:", "o": ["Occurrence", "Completeness", "Accuracy", "Cut-off"], "a": 1, "e": "Completeness means no transaction has been omitted; a sale that happened but was not recorded breaches it."}, {"c": "Assertions", "t": "Assertions", "q": "'Recorded sales are for goods actually ordered by genuine customers' is an assertion of:", "o": ["Occurrence", "Allocation", "Completeness", "Cut-off"], "a": 0, "e": "Occurrence = it actually happened and pertains to the entity."}, {"c": "Assertions", "t": "Assertions", "q": "Posting transactions to the proper ledger accounts relates to:", "o": ["Accuracy", "Allocation (classification)", "Presentation", "Cut-off"], "a": 1, "e": "Transactions recorded in proper accounts."}, {"c": "Assertions", "t": "Assertions", "q": "Inventory held by third parties on the entity's behalf is considered in:", "o": ["Cut-off, and inventory held on consignment for others is included", "Valuation, and inventory held on consignment for others is excluded", "Completeness, and inventory held on consignment for others is excluded", "Existence, and inventory held on consignment for others is included"], "a": 2, "e": "All the entity's inventory is recorded; goods held for others are not its own."}, {"c": "Assertions", "t": "Assertions", "q": "A building shown at ₹50 lakh. The check that all buildings owned are included in the figure tests:", "o": ["Rights and obligations", "Valuation", "Existence", "Completeness"], "a": 3, "e": "Checking that every building owned is included tests completeness of the balance; the risk is understatement, not overstatement."}, {"c": "Share capital", "t": "Equity, Reserves &amp; Borrowings", "q": "Share capital is checked within the authorised limit by examining the:", "o": ["Memorandum of Association", "Articles of Association", "Return of allotment", "Register of charges"], "a": 0, "e": "Authorised capital is stated in the Memorandum."}, {"c": "Share capital", "t": "Equity, Reserves &amp; Borrowings", "q": "Rights, preferences and restrictions of each class of shares are verified from:", "o": ["The register of members and the shareholder letters", "The prospectus and the stock exchange filings", "The board minutes and the bank confirmations", "The Memorandum and Articles and the terms of issue"], "a": 3, "e": "Rights &amp; obligations assertion."}, {"c": "Share capital", "t": "Equity, Reserves &amp; Borrowings", "q": "Shares cannot be issued at a discount, as per:", "o": ["Section 53", "Section 52", "Section 54", "Section 66"], "a": 0, "e": "Exceptions: sweat equity (S.54) and conversion of debt."}, {"c": "Share capital", "t": "Equity, Reserves &amp; Borrowings", "q": "The Securities Premium Account can be applied only for the purposes in:", "o": ["Section 54", "Section 52", "Section 66", "Section 53"], "a": 1, "e": "E.g. issuing bonus shares or writing off preliminary expenses."}, {"c": "Share capital", "t": "Equity, Reserves &amp; Borrowings", "q": "Sweat equity shares should be issued under:", "o": ["A board resolution and the applicable RBI or prescribed rules", "An ordinary resolution and the applicable SEBI or prescribed rules", "A special resolution and the applicable SEBI or prescribed rules", "A special resolution and the applicable RBI or prescribed rules"], "a": 2, "e": "Sweat equity shares are issued under Section 54 through a special resolution and in line with the prescribed rules or SEBI regulations for listed companies."}, {"c": "Share capital", "t": "Equity, Reserves &amp; Borrowings", "q": "A reduction of share capital must meet the requirements of:", "o": ["Section 52, including the board resolution", "Section 66, including the Tribunal order", "Section 54, including the special resolution", "Section 53, including the Registrar's order"], "a": 1, "e": "A reduction of share capital needs a special resolution and confirmation by the Tribunal under Section 66, with creditors' protection."}, {"c": "Share capital", "t": "Equity, Reserves &amp; Borrowings", "q": "Which is NOT required to be disclosed in the notes on share capital?", "o": ["The auditor's fees for the audit of the share register", "Reconciliation of shares outstanding at the beginning and end of the year", "Shareholding of promoters and changes during the year", "Number and amount of shares authorised, issued, subscribed and paid"], "a": 0, "e": "The notes on share capital cover items such as authorised, issued and paid-up capital, rights, reconciliation and shareholding over 5%; the auditor's fees are not part of them."}, {"c": "Share capital", "t": "Equity, Reserves &amp; Borrowings", "q": "Where there is no change in capital during the year, the auditor obtains:", "o": ["Written confirmation from the registrar", "Written confirmation from the bankers", "Written confirmation from the Company Secretary", "Written confirmation from the shareholders"], "a": 2, "e": "With no change in capital, a written confirmation from the Company Secretary (or registrar and transfer agent) supports the existence of the recorded share capital."}, {"c": "Reserves", "t": "Equity, Reserves &amp; Borrowings", "q": "Dividends proposed or declared AFTER the balance sheet date are:", "o": ["Recognised as a liability and disclosed in the notes", "Recognised as a liability but not disclosed anywhere", "Neither recognised as a liability nor disclosed", "Not recognised as a liability but disclosed in the notes"], "a": 3, "e": "AS 4 (Revised)/Ind AS 10."}, {"c": "Reserves", "t": "Equity, Reserves &amp; Borrowings", "q": "Capital reserves are:", "o": ["Created from capital profits and freely distributable", "Created from revenue profits and not freely distributable", "Created from revenue profits and freely distributable", "Created from capital profits and not freely distributable"], "a": 3, "e": "They may be used for bonus shares subject to the Articles."}, {"c": "Reserves", "t": "Equity, Reserves &amp; Borrowings", "q": "A reserve specifically represented by earmarked investments is termed a:", "o": ["Provision", "Reserve account", "Fund", "Surplus"], "a": 2, "e": "A reserve represented by earmarked investments is a fund, because specific assets are set aside to meet it."}, {"c": "Reserves", "t": "Equity, Reserves &amp; Borrowings", "q": "A debit balance in the Statement of Profit and Loss is shown:", "o": ["As a negative figure under 'Surplus'", "As a liability under 'Other liabilities'", "As a deduction from share capital only", "As an asset under 'Other current assets'"], "a": 0, "e": "The total Reserves and Surplus is adjusted accordingly, even if negative."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "To confirm borrowings are genuine obligations, for debentures the auditor examines the:", "o": ["Prospectus", "Trust deed", "Dividend register", "Share certificates"], "a": 1, "e": "Trust deed gives redemption terms and covenants."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "Charges created against borrowings are verified from the:", "o": ["Register of contracts and the bank filings", "Register of directors and the bank filings", "Register of charges and the ROC filings", "Register of members and the ROC filings"], "a": 2, "e": "Rights &amp; obligations assertion."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "Foreign currency loans are restated at the closing rate under:", "o": ["AS 11", "AS 10", "AS 2", "AS 29"], "a": 0, "e": "AS 11 requires monetary items such as foreign currency loans to be restated at the closing rate, which affects their valuation."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "A breach of loan covenants may result in the borrowing being classified as:", "o": ["A non-current liability", "A current liability", "A contingent liability", "A capital reserve"], "a": 1, "e": "The auditor assesses the effect on classification."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "A cash credit repayable on demand is classified as:", "o": ["Long-term borrowings", "Trade payables", "Other long-term liabilities", "Short-term borrowings"], "a": 3, "e": "Loans repayable on demand from banks."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "For borrowings secured on current assets, disclose whether:", "o": ["Annual returns filed with the Registrar agree with the books", "Quarterly returns filed with banks agree with the books", "Half-yearly returns filed with SEBI agree with the books", "Monthly returns filed with the tax office agree with the books"], "a": 1, "e": "Schedule III asks for disclosure of whether quarterly returns or statements filed with banks agree with the books of account, and the reasons for differences."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "Additional regulatory information on borrowings includes:", "o": ["Related party details and dividends not paid within the period", "Auditor details and filings not made within the period", "Wilful defaulter details and charges not registered within the period", "Director details and shares not allotted within the period"], "a": 2, "e": "Also utilisation of borrowed funds."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "Current maturities of long-term borrowings are shown:", "o": ["Separately under current liabilities", "Under provisions", "Under long-term borrowings only", "Under trade payables"], "a": 0, "e": "Presentation under Schedule III."}, {"c": "Borrowings", "t": "Equity, Reserves &amp; Borrowings", "q": "Independent balance confirmations are obtained from:", "o": ["Only debenture holders", "Only the directors", "Only banks", "All lenders"], "a": 3, "e": "Independent confirmations from all lenders give external evidence that the borrowings exist at the balance sheet date and are complete."}, {"c": "FEMA/PMLA", "t": "Equity, Reserves &amp; Borrowings", "q": "Disclosure of funds advanced to intermediaries includes a declaration that:", "o": ["FEMA and Companies Act were complied with and PMLA was not violated", "Income-tax and GST Acts were complied with and PMLA was not violated", "RBI and SEBI Acts were complied with and FEMA was not violated", "Competition and Companies Acts were complied with and FEMA was not violated"], "a": 0, "e": "Where funds are advanced to intermediaries, Schedule III requires a declaration that the transaction complied with FEMA and the Companies Act and did not violate PMLA."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "Cut-off procedures on sales compare:", "o": ["Order dates with payment dates", "Delivery dates with ageing dates", "Invoice dates with bank dates", "Dispatch dates with invoice dates"], "a": 3, "e": "Dispatch register and sales invoices."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "Positive confirmations are better suited to:", "o": ["Balances of employees only", "Many small low-risk balances", "Large or risky balances", "Balances of related parties only"], "a": 2, "e": "Negative confirmations for many small, low-risk balances."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "If confirmations are not received, the chief alternative procedure is:", "o": ["Tracing subsequent returns to the invoice", "Tracing subsequent cash receipts to the invoice", "Tracing subsequent discounts to the invoice", "Tracing subsequent credit notes to the invoice"], "a": 1, "e": "If confirmations are not received, tracing subsequent cash receipts and vouching to invoices gives alternative evidence that the receivable exists (SA 505)."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "Related-party receivables are reviewed for authorisation, arm's-length terms and compliance with:", "o": ["AS 17 / Ind AS 108 and Section 186", "AS 29 / Ind AS 37 and Section 188", "AS 11 / Ind AS 21 and Section 185", "AS 18 / Ind AS 24 and Section 189"], "a": 3, "e": "Related-party receivables need authorisation and arm's-length terms, and must comply with AS 18 / Ind AS 24 and Section 189 on loans and register of contracts."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "Existence of receivables is supported by the period-end ageing report agreed to:", "o": ["The bank statement", "The dispatch register", "The general ledger", "The sales register"], "a": 2, "e": "Agreeing the period-end ageing report to the general ledger shows the receivables listed actually exist and are the recorded balance."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "Receipts are applied to invoices chronologically, i.e. on a:", "o": ["FIFO basis", "Weighted average basis", "LIFO basis", "Specific identification basis"], "a": 0, "e": "Investigate large old balances."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "Provision and write-offs of doubtful debts should be approved by:", "o": ["An appropriate authority such as the head of sales", "An appropriate authority such as the Board of Directors", "An appropriate authority such as the external auditor", "An appropriate authority such as the credit controller"], "a": 1, "e": "Provisions and write-offs of doubtful debts are a matter of valuation, so an appropriate authority such as the Board must approve them."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "Where no due date is specified, the receivables ageing is reckoned from:", "o": ["The date of the invoice payment", "The date of the transaction", "The date of the last receipt", "The date of the balance sheet"], "a": 1, "e": "Unbilled dues are disclosed separately."}, {"c": "Receivables", "t": "Receivables, Cash &amp; Loans", "q": "Receivables ageing schedule is sub-classified into undisputed and disputed, each as:", "o": ["Secured and unsecured only", "Recoverable and written off only", "Considered good and considered doubtful", "Current and non-current only"], "a": 2, "e": "Schedule III requires the ageing schedule to split undisputed and disputed trade receivables, each shown as considered good or doubtful."}, {"c": "Cash", "t": "Receivables, Cash &amp; Loans", "q": "To prevent masking of a shortage, multiple cash balances (cashiers, petty cash) are counted:", "o": ["One after another", "At different dates", "Only at year-end", "Simultaneously"], "a": 3, "e": "Counting all cash balances at the same time prevents a shortage in one from being hidden by moving cash from another."}, {"c": "Cash", "t": "Receivables, Cash &amp; Loans", "q": "The auditor should obtain bank reconciliations for:", "o": ["All accounts as at the reporting date", "Only the accounts that are overdrawn", "Only the main current accounts", "Only the accounts with a large balance"], "a": 0, "e": "Signed by authorised personnel."}, {"c": "Cash", "t": "Receivables, Cash &amp; Loans", "q": "Where bank confirmations are not received, the auditor may:", "o": ["Estimate the balances from the last year's closing figures", "Rely on the management representation about the balances", "Agree balances to bank statements or visit the bank", "Ignore the bank balances as immaterial for the audit"], "a": 2, "e": "If bank confirmations do not arrive, bank statements or a visit to the bank provide alternative evidence of the balances."}, {"c": "Cash", "t": "Receivables, Cash &amp; Loans", "q": "Bank deposits with maturity of more than twelve months are:", "o": ["Included with cash on hand", "Shown as current investments", "Shown as trade receivables", "Disclosed separately"], "a": 3, "e": "Bank deposits with maturity of more than twelve months are disclosed separately because they are not current assets."}, {"c": "Cash", "t": "Receivables, Cash &amp; Loans", "q": "Balances held as margin money or earmarked for unpaid dividends are:", "o": ["Disclosed separately as restricted balances", "Included without any separate disclosure", "Shown as reserves and surplus", "Excluded from the balance sheet"], "a": 0, "e": "Rights &amp; obligations / presentation."}, {"c": "Loans &amp; advances", "t": "Receivables, Cash &amp; Loans", "q": "Loans and advances repayable on demand to promoters, directors, KMPs and related parties are disclosed with their:", "o": ["Interest and percentage to total revenue", "Amount and percentage to total loans and advances", "Tenure and percentage to total assets", "Security and percentage to total borrowings"], "a": 1, "e": "Schedule III requires loans repayable on demand or without terms to promoters, directors and related parties, with amount and percentage to the total."}, {"c": "Loans &amp; advances", "t": "Receivables, Cash &amp; Loans", "q": "Loans and advances are sub-classified as:", "o": ["Short-term, medium-term and long-term, with no other split", "Secured-considered good, unsecured-considered good and doubtful", "Domestic, foreign and group-company, with no other split", "Interest-bearing and interest-free, with no other split"], "a": 1, "e": "Under Schedule III, loans and advances are classified as secured-considered good, unsecured-considered good and doubtful."}, {"c": "Loans &amp; advances", "t": "Receivables, Cash &amp; Loans", "q": "Existence of loans and advances is tested by:", "o": ["Management representation on principal and interest receivable", "Analytical review of principal and interest receivable", "Review of last year's principal and interest receivable", "Direct confirmation of principal and interest receivable"], "a": 3, "e": "Similar to trade receivables."}, {"c": "Inventory", "t": "Inventories", "q": "At the physical count, the auditor's three jobs are:", "o": ["Evaluate instructions, observe performance and perform test counts", "Prepare instructions, conduct the count and sign the count sheets", "Evaluate instructions, conduct the count and value the inventory", "Review instructions, observe the count and approve the valuation"], "a": 0, "e": "Attendance at the count is linked to SA 501."}, {"c": "Inventory", "t": "Inventories", "q": "Inventory is valued at the lower of:", "o": ["Cost and replacement cost", "Cost and market price", "Cost and net realisable value", "Cost and selling price"], "a": 2, "e": "AS 2 requires inventory to be valued at the lower of cost and net realisable value so that it is not overstated."}, {"c": "Inventory", "t": "Inventories", "q": "An acceptable cost formula for inventory is:", "o": ["Base stock or LIFO", "LIFO or FIFO", "Weighted average or LIFO", "FIFO or weighted average"], "a": 3, "e": "AS 2 permits FIFO and weighted average."}, {"c": "Inventory", "t": "Inventories", "q": "Which is excluded from the cost of inventory?", "o": ["Abnormal wastage", "Carriage inward", "Conversion costs", "Allocated production overheads"], "a": 0, "e": "Abnormal wastage, storage costs (unless necessary) and selling expenses are excluded from the cost of inventory under AS 2."}, {"c": "Inventory", "t": "Inventories", "q": "Goods received on consignment are:", "o": ["Included in the entity's inventory at cost", "Included in the entity's inventory at NRV", "Segregated and excluded from the entity's inventory", "Included in the entity's inventory at selling price"], "a": 2, "e": "Consignment goods belong to the consignor, so the consignee excludes them from its inventory (rights and obligations)."}, {"c": "Inventory", "t": "Inventories", "q": "Goods-in-transit are:", "o": ["Included in finished goods only, without a separate line", "Disclosed separately under the relevant sub-head", "Excluded from the inventory and ignored altogether", "Shown under trade receivables until they are received"], "a": 1, "e": "Presentation under Schedule III."}, {"c": "Inventory", "t": "Inventories", "q": "Reconciling test counts with the inventory tags and stock sheets supports:", "o": ["Valuation", "Cut-off", "Existence", "Presentation"], "a": 2, "e": "Existence assertion for inventory."}, {"c": "Inventory", "t": "Inventories", "q": "Tracing GRNs and shipping documents around the year-end is a test of:", "o": ["Cut-off and completeness", "Ownership and presentation", "Existence and valuation", "Valuation and presentation"], "a": 0, "e": "Tracing GRNs and shipping documents around the year-end checks that purchases and sales fall in the correct period, which is cut-off and completeness."}, {"c": "Inventory", "t": "Inventories", "q": "Valuation of inventory for tax reporting includes taxes and duties as per:", "o": ["Section 43B of the Income Tax Act, 1961", "Section 145A of the Income Tax Act, 1961", "Section 36 of the Income Tax Act, 1961", "Section 40A of the Income Tax Act, 1961"], "a": 1, "e": "For tax reporting, inventory valuation includes taxes and duties as required by Section 145A of the Income Tax Act, 1961."}, {"c": "Inventory", "t": "Inventories", "q": "Under CARO 2020 clause (ii)(a), discrepancies in inventory are reported if:", "o": ["10% or more of the total inventory value", "5% or more in aggregate for each class", "5% or more of the total inventory value", "10% or more in aggregate for each class"], "a": 3, "e": "Properly dealt with in the books."}, {"c": "Inventory", "t": "Inventories", "q": "Inventory classified under Schedule III does NOT include:", "o": ["Raw materials", "Work-in-progress", "Stores and spares", "Trade receivables"], "a": 3, "e": "Classes: raw materials, WIP, FG, stock-in-trade, stores &amp; spares, loose tools, others."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "The PPE movement schedule is: opening balance +", "o": ["Additions − deletions = closing balance", "Deletions − additions = closing balance", "Purchases − consumption = closing balance", "Revaluation − depreciation = closing balance"], "a": 0, "e": "The PPE movement schedule reconciles opening balance plus additions less deletions to closing balance, which supports completeness of the schedule."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "Recognition criteria for PPE additions are as per:", "o": ["AS 26", "AS 10", "AS 29", "AS 28"], "a": 1, "e": "Verify invoice, installation certificate and approvals."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "Legal ownership of land and buildings is verified from:", "o": ["Insurance policies and tax receipts", "Purchase invoices and bank statements", "Conveyance and title deeds", "Fixed asset register and board minutes"], "a": 2, "e": "Conveyance and title deeds establish legal ownership of land and buildings, which is the rights and obligations assertion."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "Where title deeds of immovable property are not in the company's name, the company should:", "o": ["Write off the asset", "Reclassify the asset as inventory", "Disclose in the prescribed format", "Ignore as the matter is legal"], "a": 2, "e": "Also feeds CARO 2020."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "Impairment of PPE is assessed under:", "o": ["AS 28", "AS 10", "AS 26", "AS 29"], "a": 0, "e": "AS 28 requires an impairment loss when the carrying amount exceeds the recoverable amount, so the asset is not overvalued."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "Useful lives for depreciation under the Companies Act are prescribed in:", "o": ["Schedule IV", "Schedule III", "Schedule V", "Schedule II"], "a": 3, "e": "Schedule II to the Companies Act prescribes useful lives of assets and the basis of depreciation."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "Revaluation of PPE must be based on a valuation by:", "o": ["A statutory auditor", "A registered valuer", "A government approved architect", "A chartered engineer"], "a": 1, "e": "Companies (Registered Valuers and Valuation) Rules, 2017."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "Discrepancies between physical verification and the records should result in:", "o": ["Adjusting only the physical records so that they match the books", "Ignoring the differences where the amounts look small in the books", "Reporting the differences only to the tax authority for action", "Addressing the differences, e.g. deleting non-working assets and stopping depreciation"], "a": 3, "e": "Differences between physical verification and the records must be investigated and resolved, e.g. removing assets that no longer exist; otherwise existence is misstated."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "In the CWIP ageing schedule, projects are shown as:", "o": ["In progress and temporarily suspended", "Approved and rejected", "Completed and disposed of", "Capitalised and impaired"], "a": 0, "e": "Ageing: &lt;1, 1–2, 2–3, &gt;3 years."}, {"c": "PPE", "t": "PPE &amp; Intangibles", "q": "Depreciation on a new machine commences when the asset is:", "o": ["Paid for in full", "Ready for use", "Insured by the entity", "Put to commercial use"], "a": 1, "e": "Not when first put to use."}, {"c": "Intangibles", "t": "PPE &amp; Intangibles", "q": "Research expenditure is:", "o": ["Recognised as a tangible asset", "Recognised as a current asset", "Not recognised as an intangible asset", "Recognised as an intangible asset"], "a": 2, "e": "AS 26 treats research expenditure as an expense; only development expenditure meeting the criteria can be capitalised as an intangible."}, {"c": "Intangibles", "t": "PPE &amp; Intangibles", "q": "Intangible assets are classified to include:", "o": ["Software, buildings, licences and plant", "Goodwill, land, software and plant", "Brands, vehicles, patents and furniture", "Goodwill, brands, software and licences"], "a": 3, "e": "Schedule III lists intangible assets such as goodwill, brands, computer software, licences and franchises, copyrights and patents."}, {"c": "Intangibles", "t": "PPE &amp; Intangibles", "q": "Existence of an intangible asset such as software is shown by its being:", "o": ["Purchased from a vendor and recorded in the asset register", "Actively used and linked to sale of goods or services", "Fully amortised and recorded in the asset register", "Insured against risks and recorded in the asset register"], "a": 1, "e": "Software exists as an asset when it is being used and linked to revenue; mere purchase or registration does not show that it exists."}, {"c": "Intangibles", "t": "PPE &amp; Intangibles", "q": "Revaluation of intangibles is disclosed where the change is:", "o": ["10% or more of the aggregate net carrying value", "10% or more of the total assets of the company", "5% or more of the aggregate net carrying value", "5% or more of the total revenue of the company"], "a": 0, "e": "Schedule III requires disclosure where revaluation changes the carrying value by 10% or more of the aggregate net carrying value of the class."}, {"c": "Intangibles", "t": "PPE &amp; Intangibles", "q": "Intangible assets under development are shown with:", "o": ["A cash flow schedule", "A borrowing schedule", "An ageing schedule", "A tax schedule"], "a": 2, "e": "Intangible assets under development are shown with an ageing schedule so users can see how long the projects have been outstanding."}, {"c": "Payables", "t": "Payables &amp; Provisions", "q": "For trade payables, the most significant assertion is:", "o": ["Completeness", "Existence", "Occurrence", "Valuation"], "a": 0, "e": "Guard against understatement of liabilities."}, {"c": "Payables", "t": "Payables &amp; Provisions", "q": "Purchase-invoice dates are matched with:", "o": ["Dispatch dates", "Bank payment dates", "Order dates", "Gate-entry (gate inward register) dates"], "a": 3, "e": "Matching invoice dates with gate-inward dates confirms purchases are recorded in the right period, which tests cut-off of liabilities."}, {"c": "Payables", "t": "Payables &amp; Provisions", "q": "Confirmation requests to vendors are preferably sent:", "o": ["Through the management", "Without a stated balance", "With the balance stated", "Through the sales team"], "a": 1, "e": "A confirmation request that does not state the balance forces the vendor to give its own figure, so the evidence is more reliable."}, {"c": "Payables", "t": "Payables &amp; Provisions", "q": "Old creditor balances are written back only if:", "o": ["Approved by the auditor and consistent with the tax audit", "Authorised by the vendor and consistent with the bank", "Authorised by senior management and consistent with prior years", "Approved by the accounts clerk and consistent with the auditor"], "a": 2, "e": "Old creditor balances can be written back only when properly authorised and consistent with prior years, otherwise profit is inflated."}, {"c": "Payables", "t": "Payables &amp; Provisions", "q": "Which MSME disclosure is required?", "o": ["Purchase price and discount due at year-end, and advances paid beyond the due day", "Purchase price and interest due at year-end, and penalties paid beyond the due day", "Principal and interest due at year-end, and discounts given beyond the appointed day", "Principal and interest due at year-end, and interest paid beyond the appointed day"], "a": 3, "e": "The MSME Act disclosure covers principal and interest due at year-end, and interest paid beyond the appointed day, to micro and small suppliers."}, {"c": "Payables", "t": "Payables &amp; Provisions", "q": "In the trade payables ageing schedule, the headings are:", "o": ["Secured, unsecured, disputed and undisputed dues", "MSME, others, disputed dues – MSME and disputed dues – others", "Domestic, foreign, related and unrelated dues", "Current, non-current, disputed and undisputed dues"], "a": 1, "e": "Ageing: &lt;1, 1–2, 2–3, &gt;3 years."}, {"c": "Payables", "t": "Payables &amp; Provisions", "q": "Statutory dues are tested through reasonability tests and:", "o": ["Challans for deposits made after the period-end", "Returns for GST filed before the period-end", "Invoices for sales made after the period-end", "Contracts for loans made after the period-end"], "a": 0, "e": "Challans for payments made after the year-end show whether statutory dues outstanding at the year-end were recorded and later deposited, which tests completeness."}, {"c": "Provisions", "t": "Payables &amp; Provisions", "q": "A provision represents:", "o": ["A possible obligation depending on a future event", "A present asset arising from a past event", "A present obligation arising from a past event", "A possible asset depending on a future event"], "a": 2, "e": "AS 29 defines a provision as a liability from a present obligation arising from a past event, settlement of which is probable and estimable."}, {"c": "Provisions", "t": "Payables &amp; Provisions", "q": "For complex provisions such as warranties, the auditor may use:", "o": ["Sales team estimates alone, without any other evidence", "Expert reports such as actuarial valuations", "Last year's provision carried forward unchanged this year", "Management representation alone, without any other evidence"], "a": 1, "e": "Evaluate the expert's competence, capability and objectivity."}, {"c": "Provisions", "t": "Payables &amp; Provisions", "q": "Contingent liabilities are disclosed with:", "o": ["A brief description and an estimate of the financial effect", "A detailed calculation and a recognition as a liability", "A brief description and a transfer to reserves", "A detailed calculation and a charge to profit or loss"], "a": 0, "e": "AS 29 requires a contingent liability to be disclosed with a brief description and an estimate of its financial effect."}, {"c": "Provisions", "t": "Payables &amp; Provisions", "q": "Commitments to be disclosed include:", "o": ["Revenue contracts remaining to be executed and unpaid liability on shares", "Capital contracts already executed and called liability on shares", "Capital contracts remaining to be executed and uncalled liability on shares", "Revenue contracts already executed and called liability on shares"], "a": 2, "e": "Capital commitments (contracts remaining to be executed) and uncalled liability on partly paid shares are disclosed as commitments."}, {"c": "Provisions", "t": "Payables &amp; Provisions", "q": "Which is NOT a prescribed Schedule III ratio?", "o": ["Current ratio", "Debt-equity ratio", "Return on capital employed", "Earnings per share"], "a": 3, "e": "Ratios include current, D/E, DSCR, ROE, turnover ratios, net profit, ROCE, return on investment."}, {"c": "Provisions", "t": "Payables &amp; Provisions", "q": "A change in a Schedule III ratio exceeding what percentage requires explanation?", "o": ["50%", "10%", "25%", "5%"], "a": 2, "e": "Explain the reasons for variance of more than 25%."}, {"c": "Provisions", "t": "Payables &amp; Provisions", "q": "Disclosure on benami property includes:", "o": ["Year of acquisition, amount, lenders and status of valuations", "Date of sale, price, brokers and status of titles", "Date of sale, price, buyers and status of returns", "Year of acquisition, amount, beneficiaries and status of proceedings"], "a": 3, "e": "Schedule III requires disclosure about benami property, including year of acquisition, amount, beneficiaries and the status of proceedings."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "Revenue recognition is governed by:", "o": ["AS 2", "AS 9", "AS 10", "AS 15"], "a": 1, "e": "AS 9 deals with revenue recognition; the point of sale or percentage of completion decides timing."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "The highest-risk assertion for revenue is:", "o": ["Occurrence", "Presentation", "Completeness", "Cut-off"], "a": 0, "e": "Occurrence is the highest-risk assertion for revenue because management may be pressured to record fictitious sales."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "Under SA 240, there is a rebuttable presumption of a fraud risk in:", "o": ["Fixed asset additions", "Payroll processing", "Inventory valuation", "Revenue recognition"], "a": 3, "e": "Scrutinise unusual journals and year-end transactions."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "To test completeness of sales, the auditor traces transactions from:", "o": ["Shipping documents to the sales journal", "Sales journal to the shipping documents", "Sales invoices to the bank statements", "Bank statements to the sales invoices"], "a": 0, "e": "Completeness vs occurrence direction."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "To test occurrence of sales, the auditor traces from:", "o": ["Purchase orders forward to the sales journal", "Sales journal entries back to invoices and shipping documents", "Bank statements forward to the sales journal", "Shipping documents forward to the sales journal"], "a": 1, "e": "Starting from the recorded sale and tracing back to invoices and shipping documents tests occurrence, i.e. that recorded sales are real."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "Reconciling GST output and returns with revenue tests:", "o": ["Rights and obligations", "Existence", "Completeness", "Valuation"], "a": 2, "e": "Reconciling GST output and returns with recorded revenue tests completeness, because unrecorded sales would appear in the returns."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "Credit notes issued after the period-end are reviewed to ensure they do not:", "o": ["Offset fictitious year-end sales", "Increase genuine year-end sales", "Offset genuine year-end purchases", "Reduce genuine year-end receipts"], "a": 0, "e": "Credit notes issued after the year-end may reverse fictitious year-end sales, so they are reviewed for cut-off and occurrence."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "Revenue from operations, for companies other than finance companies, does NOT include:", "o": ["Other operating revenues", "Sale of products", "Interest on bank fixed deposits", "Sale of services"], "a": 2, "e": "Interest is other income."}, {"c": "Revenue", "t": "Revenue &amp; Other Income", "q": "Trade discounts are:", "o": ["Shown as other income", "Netted off against sales", "Added to sales", "Shown as expense"], "a": 1, "e": "Trade discounts are netted off against sales, so revenue is shown at the amount actually due."}, {"c": "Other income", "t": "Revenue &amp; Other Income", "q": "Interest income is computed on:", "o": ["A cash receipt basis", "An annual-only basis", "A maturity-only basis", "A time-proportion basis"], "a": 3, "e": "Deposit × rate × days."}, {"c": "Other income", "t": "Revenue &amp; Other Income", "q": "Dividend income is recognised when:", "o": ["The dividend is received in cash", "The dividend is proposed by the Board", "The right to receive payment is established", "The dividend is declared by the Board"], "a": 2, "e": "Under AS 9, dividend income is recognised when the shareholder's right to receive payment is established."}, {"c": "Other income", "t": "Revenue &amp; Other Income", "q": "Gain on sale of mutual funds is recorded upon:", "o": ["Purchase of units, verified from the fund statement", "Redemption request, verified from the broker", "Receipt of cash, verified from the bank statement", "Transfer of title, verified from the fund statement"], "a": 3, "e": "Gain on sale of mutual funds is recorded on transfer of title, which can be verified from the fund statement."}, {"c": "Other income", "t": "Revenue &amp; Other Income", "q": "Interest on FDs is reconciled with:", "o": ["Form 16 and the minutes of the board meetings", "Form 26AS (TDS) and the bank confirmation", "Form 15G and the loan agreement with the borrower", "Form 3CD and the income-tax return of the company"], "a": 1, "e": "Occurrence of interest income."}, {"c": "Other income", "t": "Revenue &amp; Other Income", "q": "Transactions not recorded but surrendered as income in tax assessments are disclosed as:", "o": ["Undisclosed income", "Contingent income", "Deferred income", "Exceptional income"], "a": 0, "e": "Transactions not recorded but surrendered as income in tax assessments are disclosed as undisclosed income under Schedule III."}, {"c": "Purchases", "t": "Purchases &amp; Expenses", "q": "A three-way match for purchases compares:", "o": ["Requisition, invoice and quotation", "Purchase order, invoice and payment", "Requisition, GRN and payment", "Purchase order, GRN and invoice"], "a": 3, "e": "A three-way match agrees the purchase order, goods received note and invoice, so that accuracy of the purchase is confirmed."}, {"c": "Purchases", "t": "Purchases &amp; Expenses", "q": "To test occurrence of purchases, the auditor verifies:", "o": ["Gate-inward register entry and a signed GRN", "Sales invoice and a signed delivery challan", "Bank payment and a signed cheque", "Purchase order and a signed contract"], "a": 0, "e": "A gate-inward entry and a signed GRN show goods were physically received, which guards against fictitious vendors."}, {"c": "Purchases", "t": "Purchases &amp; Expenses", "q": "The purchase invoice should be:", "o": ["A photocopy attested by the vendor in writing", "A scanned copy sent by the vendor through email", "An original, not a photocopy or carbon copy", "A carbon copy filed by the buyer in the records"], "a": 2, "e": "An original invoice avoids duplicate claims and fabricated copies, which supports occurrence of the purchase."}, {"c": "Purchases", "t": "Purchases &amp; Expenses", "q": "Goods in transit are accounted for according to:", "o": ["The payment terms such as advance or credit", "The delivery terms such as FOB or CIF", "The shipping terms such as air or sea", "The invoice terms such as taxable or exempt"], "a": 1, "e": "Risk and reward passes."}, {"c": "Purchases", "t": "Purchases &amp; Expenses", "q": "Whether an expenditure is capitalised or charged to profit and loss is a matter of:", "o": ["Cut-off and the personal preference of the auditor", "Occurrence and the management representation obtained", "Allocation (classification) and professional judgment", "Completeness and the tax treatment of the expenditure"], "a": 2, "e": "Whether expenditure is capital or revenue is a classification (allocation) judgment, which affects both assets and profit."}, {"c": "Purchases", "t": "Purchases &amp; Expenses", "q": "Related-party purchases should be approved by the Board at:", "o": ["Market-low prices", "Arm's-length prices", "Negotiated prices", "Cost-plus prices"], "a": 1, "e": "Related-party purchases need Board approval and must be at arm's-length prices, so occurrence and fairness are tested."}, {"c": "Employee costs", "t": "Purchases &amp; Expenses", "q": "Gratuity and leave encashment are accrued under:", "o": ["AS 9", "AS 29", "AS 11", "AS 15"], "a": 3, "e": "AS 15 requires gratuity and leave encashment to be accrued as employee benefits."}, {"c": "Employee costs", "t": "Purchases &amp; Expenses", "q": "Fictitious employees are checked by:", "o": ["Meeting employees on a sample basis and checking identity and bank details", "Recomputing PF and ESI and checking the challans", "Comparing payroll with the budget and checking the variances", "Reviewing salary registers and checking the rates and increments"], "a": 0, "e": "Meeting a sample of employees and checking identity and bank details detects fictitious employees, so occurrence of payroll is tested."}, {"c": "Employee costs", "t": "Purchases &amp; Expenses", "q": "Under Schedule III (Part II), employee benefits are disclosed as:", "o": ["Salaries and wages, PF and other funds, ESOP/ESPP and staff welfare", "Salaries and wages, PF and other funds, rent and staff welfare", "Salaries and wages, gratuity, ESOP/ESPP and recruitment", "Salaries and wages, bonus, commission and staff training"], "a": 0, "e": "Schedule III shows employee benefits as salaries and wages, contribution to PF and other funds, ESOP/ESPP expense and staff welfare."}, {"c": "Employee costs", "t": "Purchases &amp; Expenses", "q": "Average monthly salary per employee compared with prior periods tests:", "o": ["Cut-off", "Completeness", "Allocation", "Presentation"], "a": 1, "e": "Analytical review of payroll."}, {"c": "Depreciation", "t": "Purchases &amp; Expenses", "q": "Depreciation is calculated after adjusting for:", "o": ["Insurance value", "Market value", "Replacement cost", "Residual value"], "a": 3, "e": "Systematic allocation over useful life."}, {"c": "Depreciation", "t": "Purchases &amp; Expenses", "q": "Significant parts of an asset with different lives are depreciated:", "o": ["At the lowest rate", "At the highest rate", "Separately (component depreciation)", "Together at one rate"], "a": 2, "e": "Significant parts of an asset with different lives are depreciated separately so that depreciation is accurate."}, {"c": "Depreciation", "t": "Purchases &amp; Expenses", "q": "A change in useful life is accounted for:", "o": ["By a prior period adjustment", "Retrospectively", "By restating prior years", "Prospectively"], "a": 3, "e": "A change in useful life is a change in estimate, so it is accounted for prospectively over the remaining life."}, {"c": "Depreciation", "t": "Purchases &amp; Expenses", "q": "Depreciation should be compared with the Income Tax Act computation using:", "o": ["The tax-audit schedule for additions and opening WDV", "The balance sheet schedule for additions and opening cost", "The bank statement for additions and opening cost", "The board minutes for additions and opening WDV"], "a": 0, "e": "Comparing book depreciation with the tax-audit computation, using additions and opening WDV, shows differences that must be explained."}, {"c": "Other expenses", "t": "Purchases &amp; Expenses", "q": "For rent, the auditor checks recording for all twelve months and:", "o": ["Deposit terms and that the agreement is in the broker's name", "Escalation clauses and that the agreement is in the entity's name", "Payment terms and that the agreement is in the landlord's name", "Renewal terms and that the agreement is in the owner's name"], "a": 1, "e": "Rent is checked for all twelve months and for escalation clauses so that expense is complete and recorded in the right period."}, {"c": "Other expenses", "t": "Purchases &amp; Expenses", "q": "Insurance is split between prepaid and expense based on:", "o": ["The claim settlement date", "The policy issue date", "The policy coverage period", "The premium payment date"], "a": 2, "e": "Insurance is split between prepaid and expense by the policy period, so the expense relates only to the year covered."}, {"c": "Other expenses", "t": "Purchases &amp; Expenses", "q": "Legal expenses may indicate:", "o": ["Unreported sales or revenue not recorded", "Unauthorised loans or advances not repaid", "Unrecorded assets or inventory not counted", "Undisclosed disputes or provisions not made"], "a": 3, "e": "Alertness on legal and professional expenses."}, {"c": "Other expenses", "t": "Purchases &amp; Expenses", "q": "CSR disclosures include:", "o": ["Amount required, amount spent, shortfall and reasons", "Amount received, amount spent, surplus and reasons", "Amount required, amount borrowed, shortfall and interest", "Amount received, amount invested, surplus and returns"], "a": 0, "e": "Presentation of other expenses."}, {"c": "Other expenses", "t": "Purchases &amp; Expenses", "q": "Disclosure on virtual currency includes:", "o": ["Cost or fair value, holdings at the previous date and deposits made", "Profit or loss, holdings at the reporting date and deposits received", "Cost or fair value, holdings at the reporting date and loans given", "Profit or loss, holdings at the previous date and loans received"], "a": 1, "e": "Schedule III asks for disclosure of profit or loss on virtual currency transactions, holdings at the reporting date and deposits received."}, {"c": "Case study", "t": "Case Studies", "q": "A fabric maker handles yarn belonging to mills (job work) and the auditor ensures year-end stock excludes it. The assertion is:", "o": ["Existence", "Completeness", "Rights and obligations", "Cut-off"], "a": 2, "e": "Ownership; goods held for others excluded."}, {"c": "Case study", "t": "Case Studies", "q": "A cash credit of ₹2 crore, secured on stocks and debtors and guaranteed by directors, is classified under:", "o": ["Other current liabilities, as a secured loan repayable on notice", "Short-term borrowings, as a secured loan repayable on demand", "Long-term borrowings, as an unsecured loan repayable on demand", "Trade payables, as an unsecured loan repayable on notice"], "a": 1, "e": "Disclose the security, director guarantee and quarterly returns."}, {"c": "Case study", "t": "Case Studies", "q": "Machinery was ready for use in April but put into operation from 1 October; depreciation was charged from October. This is:", "o": ["Proper — depreciation starts from payment", "Not proper — depreciation should start from the year-end", "Not proper — depreciation should start from April", "Proper — depreciation starts from actual use"], "a": 2, "e": "Ready for use, not put to use."}, {"c": "Case study", "t": "Case Studies", "q": "For substantive analytical procedures on sales, the auditor builds:", "o": ["An independent expectation and investigates significant variances", "A final figure and discusses it with the management", "A trial balance and agrees it with the sales ledger", "A sample list and confirms it with the customers"], "a": 0, "e": "Trends, category-wise analysis and price/discount review."}];

const LAB=['A','B','C','D'];
let cur='All', order=[], pos=0;
const answered=new Array(DECK.length).fill(null);
const $=id=>document.getElementById(id);
const stage=$('stage'),navwrap=$('navwrap'),elProg=$('prog'),elCount=$('count'),elScore=$('score'),
      btnPrev=$('prev'),btnNext=$('next'),btnReveal=$('reveal'),chipsEl=$('chips');
function build(shuf){
  order=[];DECK.forEach((c,i)=>{if(cur==='All'||c.t===cur)order.push(i);});
  if(shuf){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;
}
function drawChips(){
  const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
