<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 3 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

const DECK = [{"c": "Audit risk", "t": "Audit Risk", "q": "Audit risk is the risk that the auditor:", "o": ["Gives a modified opinion on FS that are free from any misstatement", "Gives a modified opinion on FS that are materially misstated", "Gives an unmodified opinion on FS that are free from any misstatement", "Gives an unmodified opinion on FS that are materially misstated"], "a": 3, "e": "SA 200: sufficient appropriate evidence must reduce this risk to an acceptably low level."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Audit risk is the product of:", "o": ["Risk of material misstatement and detection risk", "Inherent risk and control risk alone", "Detection risk and sampling risk alone", "Control risk and non-sampling risk alone"], "a": 0, "e": "AR = RMM × DR = IR × CR × DR."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Risk of material misstatement is the product of:", "o": ["Control risk and detection risk", "Inherent risk and detection risk", "Inherent risk and control risk", "Sampling risk and non-sampling risk"], "a": 2, "e": "RMM = IR × CR."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Which risk is the susceptibility of an assertion to misstatement before considering any controls?", "o": ["Sampling risk", "Inherent risk", "Detection risk", "Control risk"], "a": 1, "e": "Inherent risk exists before controls are considered."}, {"c": "Audit risk", "t": "Audit Risk", "q": "The risk that the entity's controls will not prevent or timely correct a material misstatement is:", "o": ["Control risk", "Detection risk", "Non-sampling risk", "Inherent risk"], "a": 0, "e": "Control risk relates to the effectiveness of the entity's controls."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Which risk is within the control of the auditor?", "o": ["Control risk", "Detection risk", "Risk of material misstatement", "Inherent risk"], "a": 1, "e": "IR and CR are the entity's risks; DR is the only risk the auditor manages."}, {"c": "Audit risk", "t": "Audit Risk", "q": "The auditor can reduce detection risk by:", "o": ["Reducing the materiality, with the same samples and staff", "Relying more on controls, with fewer samples and less staff", "Narrower testing, smaller samples and less experienced staff", "Wider testing, larger samples and more experienced staff"], "a": 3, "e": "DR falls when more persuasive substantive evidence is obtained."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Detection risk consists of:", "o": ["Inherent risk and control risk", "Pervasive risk and assertion risk", "Sampling risk and non-sampling risk", "Business risk and litigation risk"], "a": 2, "e": "Sampling risk: unrepresentative sample; non-sampling risk: misinterpreting evidence or missing a misstatement."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Which is NOT included in audit risk?", "o": ["The risk of a material misstatement in the FS", "The risk of adverse publicity from a failed audit", "The risk of the auditor's procedures failing to detect it", "The risk of an inappropriate opinion by the auditor"], "a": 1, "e": "Auditor's business risks (litigation, reputation) are outside audit risk."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Strong internal controls result in:", "o": ["High control risk", "High detection risk", "Low inherent risk", "Low control risk"], "a": 3, "e": "Control risk and the strength of controls are inversely related."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Assessment of risk is, in essence, a matter of:", "o": ["Management's opinion", "Exact measurement", "Professional judgment", "Statutory prescription"], "a": 2, "e": "It may be expressed in percentages or in words."}, {"c": "Audit risk", "t": "Audit Risk", "q": "Weak entity-wide controls, creating risk across the FS as a whole, represent risk at the:", "o": ["Financial statement level", "Assertion level for one balance", "Detection level for a procedure", "Sampling level for a test"], "a": 0, "e": "Pervasive risks relate to the FS as a whole."}, {"c": "SA 315", "t": "Risk Assessment (SA 315)", "q": "Under SA 315, risks of material misstatement are identified and assessed at:", "o": ["The financial statement level and the sampling level", "The entity level and the industry level only", "The financial statement level and the assertion level", "The assertion level and the control level only"], "a": 2, "e": "Understanding the entity, its environment and internal control supports the assessment."}, {"c": "Procedures", "t": "Risk Assessment (SA 315)", "q": "The three risk assessment procedures are:", "o": ["Inquiry, analytical procedures, observation and inspection", "Inspection, confirmation, re-performance and recalculation", "Inquiry, vouching, verification and inspection", "Inquiry, re-performance, confirmation and analysis"], "a": 0, "e": "SA 315 requires inquiries of management and others, analytical procedures, and observation and inspection to identify and assess the risks of material misstatement."}, {"c": "Procedures", "t": "Risk Assessment (SA 315)", "q": "Inquiries for risk assessment may be made of:", "o": ["Management, bankers, customers and regulators only", "Management, internal audit, employees and legal counsel", "Shareholders, directors, competitors and suppliers only", "Auditors of other entities and the ICAI"], "a": 1, "e": "Different people give a different lens on risk."}, {"c": "Procedures", "t": "Risk Assessment (SA 315)", "q": "Comparing financial and non-financial data to spot unusual patterns is:", "o": ["A re-performance procedure", "An observation procedure", "An inspection procedure", "An analytical procedure"], "a": 3, "e": "Analytical procedures compare data and look at trends."}, {"c": "Procedures", "t": "Risk Assessment (SA 315)", "q": "Information gathered during risk assessment procedures:", "o": ["May also serve as audit evidence", "Cannot be used as audit evidence", "Is retained by management only", "Is used only for planning, never again"], "a": 0, "e": "It can support concurrent tests of controls or substantive procedures."}, {"c": "Procedures", "t": "Risk Assessment (SA 315)", "q": "Observing the physical count by staff and inspecting records is an example of:", "o": ["Inquiry of the staff", "Re-performance of controls", "Analytical procedures", "Observation and inspection"], "a": 3, "e": "Watching processes and inspecting documents, records or assets."}, {"c": "Procedures", "t": "Risk Assessment (SA 315)", "q": "Jo Jo Ltd.'s current ratio rises from 1.20 to 1.75 ahead of its BSE listing. The risk assessment procedure and concern are:", "o": ["Inquiry procedure; possible window-dressing needing investigation", "Analytical procedure; no concern as the ratio has improved", "Analytical procedure; possible window-dressing needing investigation", "Inspection procedure; no concern as listing needs a strong ratio"], "a": 2, "e": "A sharp improvement may signal misstatement of current assets or liabilities."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "Materiality is the significance of a misstatement that could reasonably influence:", "o": ["The accounting policies of the company", "The economic decisions of users", "The internal controls of the entity", "The audit fee of the auditor"], "a": 1, "e": "It turns on size and also on nature and context."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "A small misstatement may still be material if it:", "o": ["Is recorded in the last month of the year", "Relates to an asset account and not an expense", "Signals a bigger problem, such as a control weakness", "Is corrected by management before the report"], "a": 2, "e": "Nature and context matter, not just size."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "Statutory disclosure requirements are:", "o": ["Always material, whatever the amount", "Material only for listed companies", "Immaterial where the amount is small", "Material only above the overall materiality"], "a": 0, "e": "Legal requirements must be complied with irrespective of the amount."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "Performance materiality is set:", "o": ["Equal to overall materiality", "Lower than overall materiality", "Higher than overall materiality", "Without any link to overall materiality"], "a": 1, "e": "It reduces the risk that aggregated uncorrected and undetected misstatements exceed materiality."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "The commonly used benchmark for a profit-oriented entity is:", "o": ["About 10% of total equity", "About 5% of total revenue", "About 1% of profit before tax", "About 5% of profit before tax"], "a": 3, "e": "Revenue ~1%, expenses ~1% for other cases."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "When profit is volatile or unstable, a suitable benchmark is:", "o": ["Profit before tax of the latest year", "Dividend paid in the year", "Net worth of the previous year", "Total revenue or gross profit"], "a": 3, "e": "Revenue/gross profit ~1% when profit is unstable."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "For a not-for-profit entity, where expenses are the key driver, the benchmark is likely to be:", "o": ["Total expenses", "Profit before tax", "Dividend declared", "Share capital"], "a": 0, "e": "Typically ~1% of expenses."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "If profit has a one-off spike, the auditor should use:", "o": ["The spiked profit as reported", "The profit of the previous year", "A normalised or averaged profit", "Zero as the benchmark"], "a": 2, "e": "Normalised figures give a stable base."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "A lower materiality may be set for:", "o": ["Routine trade payables and purchases", "Related party transactions and director remuneration", "Utilities and staff travel expenses", "Depreciation and amortisation of assets"], "a": 1, "e": "Specific items under legal or regulatory rules, or key industry disclosures."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "On a change in circumstances, the auditor revises materiality and then:", "o": ["Revises the engagement letter and adjusts the team", "Revises performance materiality and adjusts procedures", "Revises the benchmark and drops the earlier work", "Revises the opinion and adjusts the engagement fee"], "a": 1, "e": "Reassess materiality → revise performance materiality → adjust procedures."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "A team member says materiality and audit risk apply only at the planning stage. This view is:", "o": ["Incorrect — they apply throughout the audit till the opinion", "Correct — they matter again only at the reporting stage", "Correct — they are set once and not revised later", "Incorrect — they apply only during the fieldwork stage"], "a": 0, "e": "They are revisited in performing procedures, evaluating misstatements and forming the opinion."}, {"c": "Materiality", "t": "Materiality (SA 320)", "q": "Which need NOT be documented as regards materiality?", "o": ["Overall materiality for the FS as a whole", "Revisions made during the course of audit", "The management's views on the benchmark chosen", "Performance materiality for the audit"], "a": 2, "e": "Document overall, specific-class and performance materiality and revisions."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "Which is NOT one of the five areas of understanding the entity?", "o": ["Industry, regulatory and external factors", "Nature of the entity under audit", "Measurement and review of performance", "Personal preferences of the engagement partner"], "a": 3, "e": "Five areas: industry/regulatory, nature of entity, accounting policies, objectives and strategies, performance measurement."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "Competition, supplier and customer relationships and technology are:", "o": ["Nature of the entity", "Industry and external factors", "Performance measures used", "Accounting policies adopted"], "a": 1, "e": "Part of the first area of understanding."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "Ownership, governance, subsidiaries, JVs and the capital structure relate to:", "o": ["The accounting policies", "The measurement of performance", "The nature of the entity", "Industry and external factors"], "a": 2, "e": "Nature of the entity: operations, structures, investments, financing."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "KPIs and pressure to meet targets which may distort reporting relate to:", "o": ["Industry and regulatory factors", "Nature of the entity", "Objectives, strategies and business risks", "Measurement and review of performance"], "a": 3, "e": "Performance measures can create incentives for misstatement."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "The auditor's prior experience with similar companies is:", "o": ["Not a substitute for understanding this entity", "A sufficient basis for planning the audit", "Useful only for listed company audits", "Required before an audit may be accepted"], "a": 0, "e": "Each entity, even in the same industry, has unique risks and controls."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "Understanding the entity and its environment is:", "o": ["A one-time exercise at the start", "A step optional for repeat engagements", "A task for the engagement partner alone", "A continuous and dynamic process"], "a": 3, "e": "The plan is revised to reflect entity-specific insights."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "Prince Blankets sells mostly over the internet. The auditor should:", "o": ["Confirm the sales only from the bank statements received", "Understand the e-commerce platform and test online sales controls", "Limit the work to the review of the website content shown", "Treat the internet sales as routine and rely on the past years"], "a": 1, "e": "Internet sales: high-risk area (fraud, data security, transaction accuracy)."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "A team member shows no interest in understanding the business and its environment. This is:", "o": ["Incorrect — it is fundamental to planning, risk assessment and focus", "Correct — it is the partner who need understand the business", "Correct — the procedures are fixed by the audit programme", "Incorrect — but only where the entity is large"], "a": 0, "e": "Understanding aids SA 300 planning, SA 315 RMM assessment and SA 330 responses."}, {"c": "SA 315", "t": "Understanding the Entity", "q": "The accounting policies area looks at:", "o": ["Ownership, governance and financing methods", "Strategies, objectives and business risks faced", "Appropriateness, consistency and reasons for changes", "Competitors, customers and technology used"], "a": 2, "e": "Policy choices and changes are examined, including adoption of new standards."}, {"c": "SA 315", "t": "Internal Control", "q": "Internal control is a process designed to provide:", "o": ["Reasonable assurance on achievement of the entity's objectives", "Absolute assurance on achievement of the entity's objectives", "Reasonable assurance on achievement of the auditor's objectives", "Limited assurance on achievement of the entity's objectives"], "a": 0, "e": "Reliability of reporting, efficiency of operations, safeguarding of assets and compliance."}, {"c": "SA 315", "t": "Internal Control", "q": "Internal control is designed, implemented and maintained by:", "o": ["The regulators and those charged with governance", "Those charged with governance, management and other personnel", "The internal auditor and the audit committee only", "The auditors and management working jointly together"], "a": 1, "e": "SA 315 defines internal control as the process designed, implemented and maintained by those charged with governance, management and other personnel to give reasonable assurance on reliable reporting, efficient operations and compliance."}, {"c": "Components", "t": "Internal Control", "q": "The five components of internal control are:", "o": ["Control activities, Reporting, Inspection, Monitoring, Evidence", "Compliance, Risk assessment, Information system, Measurement, Environment", "Control activities, Risk assessment, Information system, Monitoring, Environment", "Control activities, Risk avoidance, Inspection, Monitoring, Evaluation"], "a": 2, "e": "The five components are the control environment, the entity's risk assessment process, the information system, control activities and monitoring of controls."}, {"c": "Components", "t": "Internal Control", "q": "The foundation of all other internal control components is the:", "o": ["Monitoring of controls", "Control activities", "Risk assessment process", "Control environment"], "a": 3, "e": "It sets the tone and control consciousness of the organisation."}, {"c": "Components", "t": "Internal Control", "q": "Which is NOT an element of the control environment?", "o": ["Segregation of duties", "Management's philosophy and operating style", "Commitment to competence", "Integrity and ethical values"], "a": 0, "e": "Segregation of duties is a control activity."}, {"c": "Components", "t": "Internal Control", "q": "Performance reviews, physical controls and segregation of duties are:", "o": ["Risk assessment steps", "Control environment elements", "Control activities", "Monitoring activities"], "a": 2, "e": "Control activities enforce management directives."}, {"c": "Components", "t": "Internal Control", "q": "Ongoing monitoring, separate evaluations and use of external information (like customer feedback) are part of:", "o": ["Entity's risk assessment process", "Monitoring of controls", "Control activities", "Information system and communication"], "a": 1, "e": "Monitoring checks whether controls continue to work."}, {"c": "Components", "t": "Internal Control", "q": "The entity's risk assessment process covers identifying business risks relevant to reporting, estimating their significance and:", "o": ["Assessing their source and deciding the audit date", "Assessing their location and deciding the audit sample", "Assessing their materiality and deciding the audit fee", "Assessing their likelihood and deciding actions"], "a": 3, "e": "Identify, estimate significance, assess likelihood, decide actions."}, {"c": "Components", "t": "Internal Control", "q": "The information system component includes:", "o": ["How transactions are approved, authorised, signed and filed", "How transactions are tested, sampled, vouched and verified", "How transactions are initiated, recorded, processed and reported", "How transactions are planned, budgeted, forecast and reviewed"], "a": 2, "e": "Also accounting records and the financial reporting process."}, {"c": "Components", "t": "Internal Control", "q": "A strong control environment:", "o": ["Reduces but does not eliminate the risk of fraud", "Eliminates the risk of fraud altogether", "Has no effect on the risk of fraud", "Increases the risk of fraud on weak controls"], "a": 0, "e": "It influences the effectiveness of other controls."}, {"c": "Limitations", "t": "Internal Control", "q": "Which is NOT a limitation of internal control?", "o": ["Limits of small entities", "Human error in judgments made", "Collusion and management override", "Controls are designed to give absolute assurance"], "a": 3, "e": "Internal control gives reasonable, not absolute, assurance."}, {"c": "Limitations", "t": "Internal Control", "q": "In small entities, owner oversight can:", "o": ["Reduce the risk of override, as the owner is aware of events", "Compensate for poor segregation, but also enable management override", "Increase the segregation of duties by the staff", "Replace the need for any controls, as the owner is involved"], "a": 1, "e": "Close owner oversight can make up for weak segregation of duties, but the same concentration of power makes management override easier."}, {"c": "Relevance", "t": "Internal Control", "q": "Which control is usually NOT relevant to the audit?", "o": ["A revenue cut-off control", "A bank reconciliation control", "An airline's flight scheduling system", "An access control over the ledger"], "a": 2, "e": "Operational-only controls generally are not relevant."}, {"c": "Relevance", "t": "Internal Control", "q": "Evaluating 'design' of a control means asking whether it:", "o": ["Was approved by those charged with governance", "Alone or with others can prevent or detect misstatements", "Exists in the entity and is currently being used by staff", "Operated consistently throughout the period under audit"], "a": 1, "e": "Implementation asks whether it exists and is being used."}, {"c": "Relevance", "t": "Internal Control", "q": "To assess whether a control is implemented, the auditor:", "o": ["Relies on inquiry alone from the control owner", "Relies on the prior year's testing alone", "Relies on management's written representation alone", "Combines inquiry with observation, inspection and tracing"], "a": 3, "e": "Inquiry alone is not sufficient."}, {"c": "Relevance", "t": "Internal Control", "q": "Understanding a control's design and implementation:", "o": ["Is not the same as testing its operating effectiveness", "Replaces the need for tests of controls", "Is the same as testing its operating effectiveness", "Is needed only for IT controls"], "a": 0, "e": "Checking a manual control once does not prove it worked all year."}, {"c": "Significant risks", "t": "Internal Control", "q": "Which risk is ALWAYS treated as a significant risk?", "o": ["A fraud risk", "A routine transaction risk", "A recurring estimate risk", "A low-value balance risk"], "a": 0, "e": "Fraud risks are always significant; non-routine and judgmental matters are often significant."}, {"c": "Significant risks", "t": "Internal Control", "q": "Related party transactions outside normal business are significant because they:", "o": ["Are always of high value", "Are always fraudulent in nature", "May not be at arm's length", "Are always disclosed in the notes"], "a": 2, "e": "The terms may differ from those with independent parties."}, {"c": "Deficiencies", "t": "Internal Control", "q": "A deficiency in internal control exists when a control is:", "o": ["Costly to operate, or not yet reviewed by the Board", "Preventive in nature, or not detective by design", "Manual in nature, or not yet automated by the entity", "Missing, or not designed, implemented or operating effectively"], "a": 3, "e": "Deficiencies are reported under SA 265."}, {"c": "Deficiencies", "t": "Internal Control", "q": "Deficiencies in internal control are reported to management, and significant deficiencies to:", "o": ["The Registrar of Companies", "Those charged with governance", "The Central Government", "The shareholders in the AGM"], "a": 1, "e": "SA 265: management letter; governance for significant deficiencies."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "The four methods of evaluating internal control are:", "o": ["Narrative record, check list, ICQ and flow chart", "Narrative record, check list, ICQ and re-performance", "Narrative record, inspection, ICQ and flow chart", "Questionnaire, check list, vouching and flow chart"], "a": 0, "e": "Narrate, Check, Question, Chart."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "A complete written description of the control system, best for a small business, is a:", "o": ["Check list", "Flow chart", "Internal control questionnaire", "Narrative record"], "a": 3, "e": "Narrative record suits businesses without a formal system, but gaps are hard to spot."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "A set of yes/no/NA questions used BY the audit staff to confirm control procedures is a:", "o": ["Narrative record", "Check list", "Control questionnaire", "Flow chart"], "a": 1, "e": "The check list is used by the audit staff and reviewed by seniors."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "A detailed question set completed BY the client's staff and then discussed is:", "o": ["Check list", "Narrative record", "Internal control questionnaire", "Flow chart"], "a": 2, "e": "A 'No' answer flags a weakness."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "A visual map of the flow of transactions and controls is:", "o": ["Flow chart", "Control questionnaire", "Check list", "Narrative record"], "a": 0, "e": "A bird's-eye view that helps spot integration points and inefficiencies."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "The key difference between a check list and an ICQ is:", "o": ["When it is used — planning or completion stage", "Who fills it in — the audit staff or the client's employees", "What it covers — financial or operational controls", "How long it is — shorter or longer in length"], "a": 1, "e": "'Who fills it in' is the giveaway."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "Healthy and Useful Ltd (small manufacturing and trading) has its whole control system described in writing. The method is:", "o": ["Check list", "Internal control questionnaire", "Flow chart", "Narrative record"], "a": 3, "e": "Whole description recorded = narrative record."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "Your and My Ltd's employees answered control questions, which the auditor then discussed with them. The method is:", "o": ["Narrative record", "Check list", "Internal control questionnaire", "Flow chart"], "a": 2, "e": "Answered by client staff and then discussed = ICQ."}, {"c": "Evaluation methods", "t": "IC Evaluation &amp; Testing", "q": "Which is a limitation of the narrative record?", "o": ["Fails to give a view of the flow", "Lengthy for the client's staff to complete", "Hard to spot gaps and tough to update", "Suits only the large and complex entities"], "a": 2, "e": "Narrative descriptions are difficult to review and maintain."}, {"c": "Testing controls", "t": "IC Evaluation &amp; Testing", "q": "Testing of controls verifies:", "o": ["The design and operation of controls throughout the period", "The existence of controls as per the manual", "The operation of controls at the planning stage only", "The design of controls at the year-end only"], "a": 0, "e": "It checks whether the controls worked consistently."}, {"c": "Testing controls", "t": "IC Evaluation &amp; Testing", "q": "Redoing a bank reconciliation to test a control is:", "o": ["Inquiry", "Observation", "Confirmation", "Re-performance"], "a": 3, "e": "Re-performance is one of the testing methods along with inspection, inquiry/observation and IT tests."}, {"c": "Testing controls", "t": "IC Evaluation &amp; Testing", "q": "On finding deviations from prescribed controls, the auditor should:", "o": ["Ignore them if the amounts involved are small in size", "Inquire into reasons; consider more testing or substantive work", "Report them at once to the Registrar of Companies", "Stop all further testing and issue a modified report"], "a": 1, "e": "Look at personnel changes, seasonality and the reliance basis."}, {"c": "Testing controls", "t": "IC Evaluation &amp; Testing", "q": "Segregation between recording and authorising a transaction is a:", "o": ["Monitoring activity", "Control activity", "Risk assessment step", "Control environment element"], "a": 1, "e": "CA Smriti tests segregation of duties."}, {"c": "Testing controls", "t": "IC Evaluation &amp; Testing", "q": "Cash is not banked regularly although staff must do so and the official in charge ignores it. This represents:", "o": ["A control deficiency", "A control strength", "An inherent risk only", "A detection risk"], "a": 0, "e": "The control is not operating effectively; document and report it."}, {"c": "IT risks", "t": "IT &amp; Data Analytics", "q": "Which is an IT-specific risk?", "o": ["Delay in the issue of the engagement letter", "Poor planning of the timetable of the audit", "Absence of a written audit programme for the audit", "Unauthorised access and direct back-end data changes"], "a": 3, "e": "Others: super-user access, lack of segregation, unauthorised program changes, data loss."}, {"c": "IT risks", "t": "IT &amp; Data Analytics", "q": "If system data cannot be relied on, the auditor may need to:", "o": ["Rely more on automated controls", "Rely more on management's reports", "Perform more substantive checking", "Perform less substantive checking"], "a": 2, "e": "Also no reliance on automated controls or calculations."}, {"c": "IT controls", "t": "IT &amp; Data Analytics", "q": "General IT controls are:", "o": ["Manual controls that make use of system-generated reports", "Pervasive controls that support the functioning of applications", "Specific controls embedded inside a single application system", "Controls exercised by the auditor over the client's data"], "a": 1, "e": "GITC sit under the applications; weak GITC undermine application controls."}, {"c": "IT controls", "t": "IT &amp; Data Analytics", "q": "Which is NOT one of the four areas of GITC?", "o": ["Reconciliation of control accounts", "Access security", "Data centre and network operations", "Program change"], "a": 0, "e": "Four areas: data centre, program change, access security, application acquisition, development and maintenance."}, {"c": "IT controls", "t": "IT &amp; Data Analytics", "q": "Input validation, sequence checks and mandatory fields are examples of:", "o": ["Monitoring controls", "IT-dependent controls", "General IT controls", "Application controls"], "a": 3, "e": "Application controls ensure data accuracy, completeness and integrity."}, {"c": "IT controls", "t": "IT &amp; Data Analytics", "q": "A manual review of a system-generated exception report is:", "o": ["A general IT control", "An application control", "An IT-dependent control", "A flow chart review"], "a": 2, "e": "Only as reliable as the underlying GITC."}, {"c": "Automated environment", "t": "IT &amp; Data Analytics", "q": "To audit an automated environment, the auditor should understand all EXCEPT:", "o": ["The personal investments of the IT staff", "Whether IT is outsourced", "Whether the software is in-house or packaged", "The location and architecture of the systems"], "a": 0, "e": "Also interfaces, versions and key personnel such as the CIO and CISO."}, {"c": "Data analytics", "t": "IT &amp; Data Analytics", "q": "CAATs, IDEA and ACL are:", "o": ["Controls over access to data", "Methods of internal control evaluation", "Standards on auditing for IT audit", "Tools for data analytics in audit"], "a": 3, "e": "They analyse large volumes of electronic data."}, {"c": "Data analytics", "t": "IT &amp; Data Analytics", "q": "Which is a use of data analytics in audit?", "o": ["Preparing the financial statements of the client", "Replacing the need for professional judgment", "Checking completeness of population and selecting samples", "Setting the audit fee for the engagement"], "a": 2, "e": "Also re-computing balances, re-performing calculations and analysing journal entries."}, {"c": "IFC", "t": "IFC &amp; Companies Act", "q": "Directors of a listed company state that IFC are adequate and operating effectively under:", "o": ["Section 177(4)(vii)", "Section 134(5)(e)", "Section 149(8)", "Section 143(3)(i)"], "a": 1, "e": "The Directors' Responsibility Statement."}, {"c": "IFC", "t": "IFC &amp; Companies Act", "q": "The auditor reports on the adequacy and operating effectiveness of IFC under:", "o": ["Section 149(8)", "Section 143(3)(i)", "Section 134(5)(e)", "Section 177(4)(vii)"], "a": 1, "e": "Section 143(3)(i) requires the auditor to report whether the company has adequate internal financial controls with reference to financial statements and whether they operate effectively."}, {"c": "IFC", "t": "IFC &amp; Companies Act", "q": "Evaluation of IFC and risk management systems is within the terms of reference of the audit committee under:", "o": ["Section 134(5)(e)", "Section 149(8)", "Section 143(3)(i)", "Section 177(4)(vii)"], "a": 3, "e": "Audit committee's terms of reference."}, {"c": "IFC", "t": "IFC &amp; Companies Act", "q": "Independent directors satisfy themselves that financial controls are robust under:", "o": ["Section 149(8) and Schedule IV", "Section 143(3)(i) and Schedule II", "Section 134(5)(e) and Schedule III", "Section 177(4)(vii) and Schedule V"], "a": 0, "e": "Code for Independent Directors."}, {"c": "IFC", "t": "IFC &amp; Companies Act", "q": "The §143(3)(i) reporting is exempt for a private company which has:", "o": ["Turnover below ₹25 crore and borrowings below ₹50 crore (both conditions)", "Turnover below ₹25 crore or borrowings below ₹50 crore (either condition)", "Turnover below ₹50 crore and borrowings below ₹25 crore (both conditions)", "Turnover below ₹50 crore or borrowings below ₹25 crore (either condition)"], "a": 2, "e": "Both conditions must be met, in addition to the OPC and small company carve-out."}, {"c": "IFC", "t": "IFC &amp; Companies Act", "q": "The precise term for the auditor's IFC reporting is:", "o": ["Internal Financial Controls with reference to Financial Statements", "Internal Control over Financial Operations", "Internal Financial Audit of the Financial Statements", "Internal Financial Controls over Fraud and Statutory compliance"], "a": 0, "e": "The reporting is on internal financial controls with reference to financial statements, i.e. controls over financial reporting, not all internal controls."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Overall responses to RMM at the financial statement level include:", "o": ["More fieldwork, more vouching and verification", "More experienced staff, more skepticism and unpredictability", "More discussion with management and fewer procedures", "More statistical samples, more confirmations and analysis"], "a": 1, "e": "They address risks pervasive to the FS."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Further audit procedures respond to assertion-level risk through the right:", "o": ["Materiality, risk and audit trail", "Scope, cost and duration", "Nature, timing and extent", "Sample, ratio and report"], "a": 2, "e": "Higher risk demands more persuasive evidence."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Tests of controls are performed when:", "o": ["The entity is small and has no internal controls in place", "The auditor wishes to avoid substantive procedures altogether", "Controls are expected to fail, or substantive tests are sufficient", "Controls are expected to work, or substantive tests are insufficient"], "a": 3, "e": "Otherwise only substantive procedures are performed."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Substantive procedures are:", "o": ["Performed only when tests of controls fail to be effective", "Performed only for balances of small value in the FS", "Always performed for material classes, balances and disclosures", "Performed only at the year-end by the junior staff"], "a": 2, "e": "Tests of details plus substantive analytical procedures."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Tests of transactions (vouching) are meant to verify:", "o": ["The operating effectiveness of the controls throughout the year", "The plausibility of relationships among financial and non-financial data", "The existence and accuracy of assets and liabilities at the date of balance sheet", "The authenticity of transactions through documents such as invoices and GRNs"], "a": 3, "e": "Vouching = transactions; verification = balances."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Tests of balances (verification) are meant to verify:", "o": ["The design of the entity's internal controls", "The existence and accuracy of assets and liabilities", "The reasonableness of relationships among the ratios", "The authenticity of the source documents for transactions"], "a": 1, "e": "Physical verification of fixed assets is an example."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Ratio analysis and predictive analysis (e.g. estimating rental income) are:", "o": ["Substantive analytical procedures", "Tests of transactions", "Tests of controls", "Tests of balances"], "a": 0, "e": "Effective for large volumes of predictable transactions."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Controls relied on over a period must be tested:", "o": ["At the discretion of the client", "Across that period", "Only at the beginning of the period", "At one point at the year-end"], "a": 1, "e": "Point-in-time evidence suffices for some controls, e.g. period-end inventory count."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Substantive procedures reveal no misstatements. The auditor can conclude that controls are:", "o": ["Irrelevant, since the substantive work is complete", "Proven effective, since no errors have been found", "Not proven effective — evaluate them independently", "Proven ineffective, since no errors were found"], "a": 2, "e": "Absence of misstatements does not prove effectiveness of controls."}, {"c": "SA 330", "t": "Responses (SA 330)", "q": "Evidence from previous audits on controls may be used after considering:", "o": ["Control type, GITC effectiveness, past deviations and changes", "Control age, location, staff count and audit timing", "Control owner, reporting line, budgets and audit tools", "Control cost, partner views, client size and prior fees"], "a": 0, "e": "And confirming no significant changes since."}, {"c": "Scenario", "t": "Scenarios", "q": "XYZ Ltd. sells garments, shoes, watches etc. with security tags and monthly inventory verification. Inherent risk is:", "o": ["Moderate, due to the monthly verification", "Nil, due to the controls in place", "Low, due to the use of security tags", "High, due to variety and high-value goods"], "a": 3, "e": "Controls do not affect inherent risk; collusion can defeat controls (control risk moderate to high)."}, {"c": "Scenario", "t": "Scenarios", "q": "Wear &amp; Tear Pvt. Ltd. is a start-up in an area where many entrants have failed. The RMM component involved is:", "o": ["Inherent risk", "Detection risk", "Sampling risk", "Control risk"], "a": 0, "e": "Susceptibility before considering controls = inherent risk."}, {"c": "Scenario", "t": "Scenarios", "q": "Two persons monitor sensors in a controlled store for perishables, but they may not report deviations. The RMM component is:", "o": ["Non-sampling risk", "Inherent risk", "Detection risk", "Control risk"], "a": 3, "e": "The risk is that the control fails to prevent or detect a misstatement."}, {"c": "Scenario", "t": "Scenarios", "q": "Wind &amp; Ice Ltd.: risk that the auditor gives an inappropriate opinion on materially misstated FS. This is:", "o": ["Business risk", "Audit risk", "Inherent risk", "Detection risk"], "a": 1, "e": "Audit risk comprises RMM and detection risk."}, {"c": "Scenario", "t": "Scenarios", "q": "GR &amp; Associates feel they need not understand internal controls while planning PNG Ltd.'s audit. They are:", "o": ["Right — controls are the management's concern, not the auditor's", "Right — the auditor tests only the substantive balances", "Wrong — SA 315 requires understanding controls relevant to the audit", "Wrong — only for controls over the cash and the bank"], "a": 2, "e": "It underpins the RMM assessment, SA 330 responses and SA 265 reporting."}, {"c": "Scenario", "t": "Scenarios", "q": "A team member says understanding internal control will not affect procedures. This is:", "o": ["Incorrect — it affects only the audit report wording", "Incorrect — it shapes the nature, timing and extent of procedures", "Correct — procedures are fixed by the audit programme", "Correct — procedures depend only on the size of the entity"], "a": 1, "e": "Understanding control helps target testing on high-risk areas."}];

const LAB=['A','B','C','D'];
let cur='All', order=[], pos=0;
const answered=new Array(DECK.length).fill(null);
const $=id=>document.getElementById(id);
const stage=$('stage'),navwrap=$('navwrap'),elProg=$('prog'),elCount=$('count'),elScore=$('score'),
      btnPrev=$('prev'),btnNext=$('next'),btnReveal=$('reveal'),chipsEl=$('chips');
function build(shuf){
  order=[];DECK.forEach((c,i)=>{if(cur==='All'||c.t===cur)order.push(i);});
  if(shuf){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;
}
function drawChips(){
  const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
