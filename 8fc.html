<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 8 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

<script>
const DECK = [{"c": "SA 700 — Objective", "t": "SA 700 · Report", "q": "Under SA 700 (Revised), the auditor's objective is to:", "o": ["Form an opinion on the FS from audit evidence and express it in a written report", "Detect every misstatement in the FS and report each one to the members", "Certify the arithmetical accuracy of the FS and report this to the Registrar", "Prepare the FS from audit evidence and present them in a written report"], "a": 0, "e": "Two limbs: (1) form an opinion based on conclusions drawn from evidence; (2) express it clearly in a written report."}, {"c": "Frameworks", "t": "SA 700 · Report", "q": "A framework that lets management give additional disclosures — or rarely depart from a requirement — to achieve fair presentation is a:", "o": ["Compliance framework", "Regulatory framework", "Fair presentation framework", "Special purpose framework"], "a": 2, "e": "Fair presentation = comply + additional disclosures / rare departure. A compliance framework demands strict compliance only."}, {"c": "Frameworks", "t": "SA 700 · Report", "q": "Which statement about a compliance framework is correct?", "o": ["It allows departures from requirements whenever presentation would improve", "It requires additional disclosures beyond those specified in the framework", "It is a special purpose framework and cannot be a general purpose one", "It requires strict compliance and allows no departure to achieve fair presentation"], "a": 3, "e": "A general purpose framework can be fair-presentation or compliance type; the latter is rigid."}, {"c": "Unmodified opinion", "t": "SA 700 · Report", "q": "Which statement on 'present fairly, in all material respects' and 'true and fair view' is correct?", "o": ["The first is for companies and the second for other entities", "Both are equivalent, and the auditor may use either one", "The second is a form of qualified opinion on the FS", "The first gives lower assurance than the second one"], "a": 1, "e": "SA 700 treats both expressions as equivalent for an unmodified opinion."}, {"c": "Unmodified opinion", "t": "SA 700 · Report", "q": "Which wording would make a clean opinion appear conditional?", "o": ["'in conformity with the accounting principles generally accepted in India'", "'in all material respects' or 'to the best of our information'", "'give a true and fair view' or 'give the information required'", "'subject to' or 'with the foregoing explanation'"], "a": 3, "e": "Conditional phrases signal a modification. An unmodified opinion must be expressed without qualification."}, {"c": "Report structure", "t": "SA 700 · Report", "q": "In a company audit report, the section placed immediately after 'Opinion' is:", "o": ["Management's Responsibility", "Other Legal and Regulatory Requirements", "Basis for Opinion", "Key Audit Matters"], "a": 2, "e": "Order: Opinion → Basis for Opinion → KAM → Management's Responsibility → Auditor's Responsibilities → EOM/OM → Other Legal &amp; Regulatory → signature."}, {"c": "Report structure", "t": "SA 700 · Report", "q": "A trainee says 'Basis for Opinion' can be dropped when the opinion is unmodified. His view is:", "o": ["Wrong — the section is mandatory in every report, modified or unmodified", "Right — the section is needed only in reports on listed companies", "Right — the section is needed only when the opinion is modified", "Wrong — the section is needed only when KAM are being reported"], "a": 0, "e": "SA 700 (Revised) mandates the section in all reports for transparency on how the opinion was formed."}, {"c": "Report structure", "t": "SA 700 · Report", "q": "Which of these is NOT stated in the 'Basis for Opinion' section of an unmodified report?", "o": ["The audit was conducted in accordance with the SAs", "Management's responsibility for assessing the going concern basis", "The auditor is independent as per the ICAI Code of Ethics", "The audit evidence is sufficient and appropriate for the opinion"], "a": 1, "e": "Management's responsibilities (including going concern) appear in their own section."}, {"c": "Opinion section", "t": "SA 700 · Report", "q": "Which of these is NOT required in the 'Opinion' section?", "o": ["The date or period covered by each of the statements", "A description of the sampling technique used in the audit", "Reference to the notes and summary of significant accounting policies", "Identification of the entity whose FS were audited"], "a": 1, "e": "The Opinion section identifies entity, statements, notes and dates/periods."}, {"c": "Opinion section", "t": "SA 700 · Report", "q": "In the specimen report of a company, the addressee is:", "o": ["The Central Government", "The Registrar of Companies", "The members of the company", "The audit committee alone"], "a": 2, "e": "Addressee is as required by law/terms of engagement — for a company, the shareholders/members."}, {"c": "Evaluations", "t": "SA 700 · Report", "q": "Which is NOT among the auditor's specific evaluations of the entity's FS under SA 700?", "o": ["Whether the accounting estimates made are reasonable", "Whether significant accounting policies are adequately disclosed", "Whether the terminology and statement titles used are appropriate", "Whether secretarial records are kept at the registered office"], "a": 3, "e": "D-C-E-R-D-T: Disclosure of policies, Consistency, Estimates, Relevance/Reliability/Comparability/Understandability, Disclosures, Terminology."}, {"c": "Evaluations", "t": "SA 700 · Report", "q": "Which is an indicator of possible management bias in judgments?", "o": ["Selective correction of misstatements brought to its notice", "Consistent application of accounting policies year after year", "Use of an independent valuer for significant estimates", "Prompt correction of all misstatements brought to its notice"], "a": 0, "e": "Selective correction and biased estimates are indicators; bias may mean the FS are materially misstated (SA 540 / SA 260)."}, {"c": "Mgmt responsibility", "t": "SA 700 · Report", "q": "Regarding management's responsibility for internal control over fraud:", "o": ["The responsibility exists only for listed entities and banks", "The responsibility passes to the auditor once the audit begins", "Materiality does not apply; controls must be effective regardless of size", "Materiality applies; only material frauds need to be prevented"], "a": 2, "e": "Materiality is the auditor's concept for misstatements; it does not dilute management's duty on internal control."}, {"c": "Auditor responsibility", "t": "SA 700 · Report", "q": "'Reasonable assurance' in the auditor's report means:", "o": ["A high level of assurance, but not a guarantee of detecting all misstatements", "A high level of assurance as to errors, but none as to fraud", "An absolute level of assurance that the FS are entirely free of error", "A moderate level of assurance obtained from limited review procedures"], "a": 0, "e": "An audit under the SAs cannot guarantee that a material misstatement will always be detected."}, {"c": "Auditor responsibility", "t": "SA 700 · Report", "q": "Misstatements are material if, individually or in aggregate, they:", "o": ["Exceed 5% of the profit before tax for the year audited", "Could reasonably be detected through substantive procedures", "Arise from management override of the internal controls", "Could reasonably influence the economic decisions of users"], "a": 3, "e": "The definition is user-decision based, not a fixed percentage."}, {"c": "Signature &amp; date", "t": "SA 700 · Report", "q": "Auditor signs the report on 10 May; the Board approved the FS on 15 May. The report date is:", "o": ["Proper — the audit work was already complete as on 10 May", "Improper — it precedes approval of the FS by those with recognised authority", "Improper only if the AGM is held before 15 May of that year", "Proper — approval of the FS is purely an internal company matter"], "a": 1, "e": "The report is dated no earlier than the date sufficient evidence was obtained, including approval of the FS."}, {"c": "Signature &amp; date", "t": "SA 700 · Report", "q": "When a firm is appointed auditor, the report is signed:", "o": ["In the partner's name and the firm's name, with membership number and FRN", "In the firm's name, countersigned by the company secretary", "In the firm's name alone, by any partner or employee of the firm", "In the partner's name alone, without naming the firm that is appointed"], "a": 0, "e": "Signature in both personal and firm names, with ICAI membership number and firm registration number."}, {"c": "UDIN", "t": "SA 700 · Report", "q": "Which statement about UDIN is correct?", "o": ["It is a 12-digit number mandatory on audit reports and not certificates", "It is an 18-digit number mandatory on audit reports and not certificates", "It is an 18-digit number mandatory on certificates and audit reports", "It is a 12-digit number optional for those with a full-time CoP"], "a": 2, "e": "UDIN (from 1 Feb 2019) curbs forged signatures; it is generated on the ICAI portal and covers certificates too."}, {"c": "Minimum elements", "t": "SA 700 · Report", "q": "If law mandates a different layout, which element must still appear for the report to refer to the SAs?", "o": ["An Other Matter paragraph on the work of any component auditors", "A statement that the auditor is independent, referring to ICAI's Code of Ethics", "A comparative-figures paragraph on the audit of the prior period", "An Emphasis of Matter paragraph on matters disclosed in the notes"], "a": 1, "e": "Minimum elements (a)–(m) include title, addressee, opinion, independence, responsibilities, signature, place and date."}, {"c": "Other legal reporting", "t": "SA 700 · Report", "q": "Where the report also covers other responsibilities, the 'Report on the Audit of the FS':", "o": ["Is replaced entirely by 'Other Legal and Regulatory Requirements'", "Comes second, after 'Other Legal and Regulatory Requirements'", "Is placed in an appendix to 'Other Legal and Regulatory Requirements'", "Comes first, and 'Other Legal and Regulatory Requirements' follows it"], "a": 3, "e": "The audit-of-FS part precedes the other legal and regulatory requirements."}, {"c": "Mgmt responsibility", "t": "SA 700 · Report", "q": "Management's responsibilities, as the premise of the audit, are agreed in:", "o": ["The Board minutes approved after the audit is completed", "The working papers prepared by the auditor after the audit", "The engagement letter or another suitable written agreement", "The audit committee charter adopted by the company"], "a": 2, "e": "SA 210: management's responsibilities are acknowledged in writing in the terms of engagement."}, {"c": "When to modify", "t": "SA 705 · Modification", "q": "The auditor modifies the opinion under SA 705 when:", "o": ["FS are materially misstated, or sufficient appropriate evidence cannot be obtained", "A matter needs emphasis, or the auditor wishes to disclose an event", "Management disagrees with the auditor, or changes its accounting year", "FS are signed late, or the audit fee remains unpaid for the year"], "a": 0, "e": "Two triggers: material misstatement, or inability to obtain sufficient appropriate evidence."}, {"c": "Grid", "t": "SA 705 · Modification", "q": "An asset is overstated by a material amount, confined to that one item; the rest of the FS are fine. The opinion is:", "o": ["Adverse opinion", "Qualified opinion", "Unmodified opinion + EOM", "Disclaimer of opinion"], "a": 1, "e": "Misstatement material but not pervasive → qualified."}, {"c": "Grid", "t": "SA 705 · Modification", "q": "Material misstatements affect the FS as a whole (e.g. subsidiaries not consolidated at all). The opinion is:", "o": ["Disclaimer of opinion", "Unmodified opinion + OM", "Qualified opinion", "Adverse opinion"], "a": 3, "e": "Misstatement material AND pervasive → adverse."}, {"c": "Grid", "t": "SA 705 · Modification", "q": "The auditor cannot obtain evidence on one balance; possible effects are material but not pervasive. The opinion is:", "o": ["Disclaimer of opinion", "Unmodified opinion", "Qualified opinion", "Adverse opinion"], "a": 2, "e": "Evidence problem + material, not pervasive → qualified."}, {"c": "Grid", "t": "SA 705 · Modification", "q": "Possible effects of undetected misstatements, from lack of evidence, are material and pervasive. The auditor gives:", "o": ["Adverse opinion", "Disclaimer of opinion", "Unmodified opinion + EOM", "Qualified opinion"], "a": 1, "e": "Evidence problem + material and pervasive → disclaimer (or withdraw where feasible)."}, {"c": "Grid", "t": "SA 705 · Modification", "q": "Which pairing of nature of matter and opinion is correct?", "o": ["FS materially misstated and pervasive → Adverse", "Evidence unobtainable, not pervasive → Adverse", "FS misstated and not pervasive → Disclaimer", "Evidence unobtainable and pervasive → Adverse"], "a": 0, "e": "Misstatement: qualified/adverse. Evidence problem: qualified/disclaimer. 'Pervasive' moves to the harsher of each pair."}, {"c": "Pervasive", "t": "SA 705 · Modification", "q": "Which is NOT a feature that makes effects of a matter 'pervasive'?", "o": ["Though confined, it forms a substantial proportion of the FS", "In disclosures, it is fundamental to users' understanding", "It is not confined to specific elements, accounts or items", "It relates to a single account that is immaterial to the FS"], "a": 3, "e": "Three tests: not confined; substantial proportion; fundamental to disclosures."}, {"c": "Wording", "t": "SA 705 · Modification", "q": "Which phrase belongs to a qualified opinion arising from a material misstatement?", "o": ["'because of the significance of the matter(s), the FS do not give a true and fair view'", "'we have not been able to obtain sufficient appropriate audit evidence'", "'except for the effects of the matter(s) described in the Basis section'", "'subject to the matter described in Note Z of the financial statements'"], "a": 2, "e": "Qualified (misstatement): 'except for the effects…'; (limitation): 'except for the possible effects…'."}, {"c": "Wording", "t": "SA 705 · Modification", "q": "A qualified opinion due to inability to obtain evidence says:", "o": ["'the FS do not give a true and fair view'", "'except for the effects of the misstatement'", "'we were engaged to audit the FS'", "'except for the possible effects of the matter(s)'"], "a": 3, "e": "'Possible effects' signals a limitation rather than a known misstatement."}, {"c": "Wording", "t": "SA 705 · Modification", "q": "Which wording is typical of an adverse opinion?", "o": ["'because of the significance of the matter(s), the FS do not give a true and fair view'", "'except for the effects of the matter(s) described in the Basis section'", "'we do not express an opinion on the accompanying FS of the company'", "'we draw attention to the matter disclosed in Note Z of the FS'"], "a": 0, "e": "Adverse: FS do not present fairly because of the significance of the matter(s)."}, {"c": "Disclaimer", "t": "SA 705 · Modification", "q": "In a disclaimer, the introductory sentence is amended to say the auditor:", "o": ["Has carried out a review of FS", "Was engaged to audit the FS", "Has completed the audit of FS", "Has compiled the FS as given"], "a": 1, "e": "No opinion is expressed, so the auditor 'was engaged to audit' rather than 'has audited'."}, {"c": "Disclaimer", "t": "SA 705 · Modification", "q": "When the auditor disclaims an opinion, the report:", "o": ["Omits a KAM section unless law or regulation requires it", "Includes KAM along with an unmodified opinion on other areas", "Includes KAM for every area that could not be audited", "Replaces the KAM section by an Emphasis of Matter paragraph"], "a": 0, "e": "SA 701 KAM are not communicated when disclaiming, unless required by law."}, {"c": "Disclaimer", "t": "SA 705 · Modification", "q": "In the auditor's responsibilities part of a disclaimer, the auditor omits:", "o": ["The statement of independence and other ethical responsibilities", "The signature, place and date of the auditor's report as signed", "The reference to the responsibilities section and sufficiency of evidence", "The reference to the SAs under which the audit was conducted"], "a": 2, "e": "Those two statements are omitted; the independence statement is still included."}, {"c": "Basis section", "t": "SA 705 · Modification", "q": "When the opinion is modified, the 'Basis for Opinion' heading becomes:", "o": ["'Basis for Emphasis of Matter and Other Matter'", "'Basis for Qualified / Adverse / Disclaimer of Opinion'", "'Basis for Other Legal and Regulatory Reporting'", "'Basis for Key Audit Matters and Opinion Report'"], "a": 1, "e": "The heading mirrors the type of modification."}, {"c": "Basis section", "t": "SA 705 · Modification", "q": "A material misstatement of a specific amount cannot be quantified practically. The auditor:", "o": ["Issues a disclaimer on account of the unquantified amounts", "Reports the matter privately to the Registrar of Companies", "Leaves the matter out of the report and records it in the files", "States in the Basis section that quantification is not practicable"], "a": 3, "e": "Basis paragraph describes and quantifies the effect where practicable; otherwise it says so."}, {"c": "Basis section", "t": "SA 705 · Modification", "q": "Where required information is omitted from the FS, the Basis section should:", "o": ["Move the omission to an Emphasis of Matter paragraph in the report", "State only that disclosures are inadequate, without any further detail", "Ignore the omission where the reported figures are themselves correct", "Describe the omission and, if practicable, include the omitted disclosures"], "a": 3, "e": "Non-disclosure is a misstatement: discuss with TCWG, describe its nature, include the disclosures if practicable."}, {"c": "Scope limitation", "t": "SA 705 · Modification", "q": "Management stops the auditor from attending the inventory count after acceptance. The FIRST step is to:", "o": ["Report to the Central Government at once", "Request management to remove the limitation", "Issue a disclaimer of opinion straight away", "Withdraw from the engagement at the outset"], "a": 1, "e": "Sequence: request removal → communicate with TCWG → alternative procedures → assess materiality/pervasiveness."}, {"c": "Scope limitation", "t": "SA 705 · Modification", "q": "Management refuses to remove the limitation. The auditor next should:", "o": ["Issue an adverse opinion on the FS as a whole", "Obtain a representation letter and carry on as normal", "Communicate the matter to those charged with governance", "Resign from the audit without informing anyone else"], "a": 2, "e": "TCWG must be told (unless all are in management); then consider alternative procedures."}, {"c": "Scope limitation", "t": "SA 705 · Modification", "q": "A limitation is material and pervasive and withdrawal is not possible under law. The auditor should:", "o": ["Disclaim an opinion", "Issue an adverse opinion", "Qualify the opinion", "Give an unmodified opinion + EOM"], "a": 0, "e": "Where withdrawal is impracticable, a pervasive limitation leads to a disclaimer."}, {"c": "Scope limitation", "t": "SA 705 · Modification", "q": "Before withdrawing from the audit, the auditor should tell TCWG about:", "o": ["The fee still receivable from the company for the audit work done", "The remuneration drawn by the directors during the year of audit", "Significant misstatements identified that would have led to a modified opinion", "The names of the staff who were assigned to the audit assignment"], "a": 2, "e": "Significant misstatements found must be communicated before withdrawal."}, {"c": "Scope limitation", "t": "SA 705 · Modification", "q": "Tiger Ltd.: cash ₹1 lakh (turnover ₹6 crore); cashier on leave, management says count is not possible. Best course:", "o": ["Disclaim an opinion immediately because cash could not be counted", "Seek removal, try alternative procedures, then assess impact", "Issue an adverse opinion immediately because management refused", "Add an Emphasis of Matter paragraph and sign the report as usual"], "a": 1, "e": "The amount is small relative to turnover; alternatives (subsequent cash flows, bank records) will usually suffice."}, {"c": "Scope limitation", "t": "SA 705 · Modification", "q": "CFO withholds party details; no help at count; bills not produced; effects pervasive; withdrawal impossible. The opinion is:", "o": ["Unmodified opinion + OM", "Qualified opinion", "Adverse opinion", "Disclaimer of opinion"], "a": 3, "e": "Persistent non-cooperation = pervasive scope limitation (SA 500 evidence unobtainable) → disclaimer."}, {"c": "Communication", "t": "SA 705 · Modification", "q": "Before issuing a modified opinion, the auditor should:", "o": ["Tell TCWG the circumstances and the proposed wording of the modification", "Wait for the next general meeting to announce the modification", "Obtain prior approval of the modification from the Registrar of Companies", "Send a draft of the modification only to the lenders of the entity"], "a": 0, "e": "SA 705: communicate the circumstances leading to the expected modification and its wording."}, {"c": "Additional matters", "t": "SA 705 · Modification", "q": "Where the opinion is adverse or a disclaimer, the Basis section should also:", "o": ["Omit all other matters, since the harsher opinion already covers them", "Describe other matters that would have needed modification, and their effects", "Describe only the principal matter that led to the harsher opinion", "Refer the other matters to the next year's auditor for his decision"], "a": 1, "e": "Other matters needing modification are disclosed even when a harsher opinion is given."}, {"c": "EOM", "t": "SA 706 · EOM / OM", "q": "An Emphasis of Matter paragraph suits a matter that is:", "o": ["Not disclosed in the FS but relevant to understanding the audit", "A limitation on scope, preventing evidence from being obtained", "Fundamental to users, disclosed in the FS, needing no modification", "A departure from the framework, needing a qualified opinion"], "a": 2, "e": "EOM: matter disclosed in FS, fundamental, no modification needed, and not a KAM."}, {"c": "EOM", "t": "SA 706 · EOM / OM", "q": "An EOM paragraph must state:", "o": ["Where the matter is described in the FS, and that the opinion is not modified", "That management disagrees with the matter and has refused to correct it", "That the FS are qualified in respect of the matter described in the notes", "That the auditor gives a separate opinion on the matter highlighted"], "a": 0, "e": "'We draw attention to Note X… our opinion is not modified in respect of this matter.'"}, {"c": "EOM", "t": "SA 706 · EOM / OM", "q": "Which is NOT an example where an EOM may be appropriate?", "o": ["Early adoption of a new accounting standard affecting the FS", "A significant event occurring after the FS date", "Uncertainty about the outcome of significant litigation", "A material misstatement of inventory left uncorrected"], "a": 3, "e": "A misstatement requires SA 705 modification; EOM is for disclosed matters."}, {"c": "EOM", "t": "SA 706 · EOM / OM", "q": "FS omit a required contingent liability disclosure; the auditor proposes only an EOM. This is:", "o": ["Right — an EOM suffices once the amount has been described in it", "Wrong — an EOM cannot substitute for modification or a required disclosure", "Right — an EOM suffices when those charged with governance agree", "Wrong — a KAM must be used instead, and not an EOM paragraph"], "a": 1, "e": "EOM is not a substitute for SA 705 modification, FS disclosures or SA 570 going concern reporting."}, {"c": "EOM", "t": "SA 706 · EOM / OM", "q": "Jovian Ltd.: a fire destroyed plant; disclosed in Note Z; auditor sees it as fundamental. Reporting:", "o": ["Adverse opinion citing the fire loss in Note Z", "Other Matter paragraph on the fire loss in Note Z", "Qualified opinion citing the fire loss in Note Z", "EOM paragraph referring to Note Z; opinion not modified"], "a": 3, "e": "Disclosed, fundamental, no modification needed and not a KAM → EOM."}, {"c": "Other Matter", "t": "SA 706 · EOM / OM", "q": "An Other Matter paragraph conveys a matter that is:", "o": ["Not disclosed in the FS but relevant to understanding the audit or report", "A going concern uncertainty needing a separate SA 570 section", "Disclosed in the FS and fundamental to understanding of the FS", "A material misstatement needing a qualified opinion on the FS"], "a": 0, "e": "EOM = disclosed in FS; Other Matter = not in FS but relevant to the audit or report."}, {"c": "Communication", "t": "SA 706 · EOM / OM", "q": "Before including an EOM or Other Matter paragraph, the auditor should:", "o": ["Seek written approval of the paragraph from ICAI in advance", "Obtain the consent of shareholders at a general meeting", "Discuss the expected paragraph and its wording with TCWG", "Inform only the lenders of the entity about the paragraph"], "a": 2, "e": "SA 706 requires communication with TCWG on expected paragraph and wording."}, {"c": "Definition", "t": "SA 701 · KAM", "q": "Key Audit Matters are:", "o": ["Matters of most significance in the prior-period audit, shown in the current report", "Matters of most significance in the current-period audit, selected from those communicated with TCWG", "Matters giving rise to a separate opinion, selected from those communicated with TCWG", "Matters of most risk in the whole audit, selected from those discussed with management"], "a": 1, "e": "KAM = most significant matters in the current-period audit, chosen from matters communicated with TCWG."}, {"c": "Determining KAM", "t": "SA 701 · KAM", "q": "In determining KAM, the auditor considers all EXCEPT:", "o": ["The audit fee negotiated with management", "Areas of higher assessed risk of material misstatement", "Significant auditor judgments, including estimation uncertainty", "The effect of significant events or transactions in the period"], "a": 0, "e": "SA 701 considerations: higher-risk areas (SA 315), significant judgments, effect of significant events/transactions."}, {"c": "Communicating KAM", "t": "SA 701 · KAM", "q": "The KAM section must make clear that KAM:", "o": ["Are separate opinions on the individual matters described", "Replace a modified opinion where the matters are significant", "Are not separate opinions on the individual matters described", "Are disclosures made by management in the notes to the FS"], "a": 2, "e": "KAM never provide a separate opinion on a matter."}, {"c": "Communicating KAM", "t": "SA 701 · KAM", "q": "KAM are NOT a substitute for:", "o": ["Management representations or the engagement letter", "The Basis for Opinion or the independence statement", "The signature, place and date of the auditor's report", "A modified opinion, FS disclosures, or going concern reporting"], "a": 3, "e": "KAM supplement but never replace SA 705 modification, disclosures or SA 570 reporting."}, {"c": "Communicating KAM", "t": "SA 701 · KAM", "q": "With TCWG, the auditor communicates the KAM identified and:", "o": ["Obtains their approval of the opinion before reporting", "Delegates the choice of KAM entirely to their judgment", "Hands over copies of the working papers on each KAM", "Informs them if no KAM have been identified"], "a": 3, "e": "SA 701 requires communication of KAM, and a statement where there are none."}, {"c": "Applicability", "t": "SA 701 · KAM", "q": "KAM communication under SA 701 is required for:", "o": ["Listed entities, and other cases required by law or decided by the auditor", "Government companies only, whether listed or unlisted in the market", "All companies, including small companies and one person companies", "Banking companies only, as defined under the Banking Regulation Act"], "a": 0, "e": "SA 701 applies to listed entities, and elsewhere where required or chosen."}, {"c": "KAM vs EOM", "t": "SA 701 · KAM", "q": "A matter determined to be a KAM is:", "o": ["Not reported at all in the auditor's report", "Reported only in the Basis section, not as KAM", "Reported in the KAM section, not as an EOM", "Reported only as an EOM, not in the KAM section"], "a": 2, "e": "EOM is for matters that are not KAM and need no modification."}, {"c": "Types", "t": "SA 710 · Comparatives", "q": "The opinion on 'corresponding figures' relates to:", "o": ["Each period presented", "The current period only", "The next period", "The prior period only"], "a": 1, "e": "Corresponding figures are context; the opinion is on the current period."}, {"c": "Types", "t": "SA 710 · Comparatives", "q": "Where comparative FS are presented, the opinion:", "o": ["Covers only the latest period for which FS are presented", "Is a disclaimer for every earlier period presented", "Covers each period for which FS are presented", "Is expressed by the predecessor for earlier periods"], "a": 2, "e": "Comparative FS → opinion on each period presented."}, {"c": "Procedures", "t": "SA 710 · Comparatives", "q": "On comparative information, the auditor checks it:", "o": ["Is reported to the Registrar and is agreed to the tax returns", "Is excluded from audit procedures and is reviewed only by TCWG", "Is restated each year, is re-audited fully, and has revised policies", "Agrees to prior amounts, is classified correctly, has consistent policies"], "a": 3, "e": "SA 710: agreement, classification and consistency (or proper accounting for changes)."}, {"c": "Procedures", "t": "SA 710 · Comparatives", "q": "Written representations (SA 580) on comparative information are obtained for:", "o": ["Only the current period of the FS", "All periods covered by the opinion", "Only periods that were unaudited", "Only the prior period of the FS"], "a": 1, "e": "SA 710 requires representations for all periods covered by the opinion."}, {"c": "Corresponding figures", "t": "SA 710 · Comparatives", "q": "Prior-period opinion was modified and the matter is unresolved. The current opinion should be:", "o": ["Modified as well", "Unmodified", "Disclaimed on all figures", "Unmodified with an EOM"], "a": 0, "e": "An unresolved prior modification affects the current report; the Basis explains the effect on comparability."}, {"c": "Corresponding figures", "t": "SA 710 · Comparatives", "q": "A prior-period material misstatement (previously unmodified) is uncorrected. The auditor issues:", "o": ["Qualified or adverse opinion on current FS, modified for the corresponding figures", "Unmodified opinion on current FS, with an EOM on the corresponding figures", "Disclaimer on the prior period, with unmodified opinion on the current one", "Qualified opinion on the prior period alone, with the current period clean"], "a": 0, "e": "If the misstatement is not dealt with per the framework, the current opinion is modified regarding the corresponding figures."}, {"c": "Corresponding figures", "t": "SA 710 · Comparatives", "q": "Prior-period FS were not audited. The auditor:", "o": ["Disclaim the current opinion and say nothing on opening balances", "Ignore the prior period and get no evidence on opening balances", "EOM paragraph, and no work is needed on opening balances", "Other Matter paragraph: unaudited; still get evidence on opening balances"], "a": 3, "e": "The OM paragraph does not relieve the auditor of work on opening balances."}, {"c": "Corresponding figures", "t": "SA 710 · Comparatives", "q": "Prior-period FS were audited by a predecessor and referring to the report is allowed. The report includes:", "o": ["A disclaimer paragraph on the predecessor and the report date", "A KAM section on the predecessor, opinion type and report date", "An Other Matter paragraph on the predecessor, opinion type and report date", "An EOM paragraph on the predecessor, opinion type and report date"], "a": 2, "e": "SA 710 prescribes an OM paragraph stating predecessor audit, type of opinion (and reasons if modified) and date."}, {"c": "Comparative FS", "t": "SA 710 · Comparatives", "q": "In comparative FS, if the opinion on a prior period now differs from what was expressed earlier, the auditor:", "o": ["Notes the reasons in the working papers only, not in the report", "Discloses the substantive reasons in an Other Matter paragraph", "Replaces the old opinion silently in the current report", "Informs the Registrar of Companies, not the shareholders"], "a": 1, "e": "The change and its reasons are explained in an OM paragraph (SA 706)."}, {"c": "Branch audit", "t": "Branch &amp; Joint Audit", "q": "Under §143(8), the branch auditor's report is:", "o": ["Sent to the company's auditor, who deals with it as he considers necessary", "Placed before the members, who deal with it as they consider necessary", "Filed directly with the Registrar, who deals with it as he considers necessary", "Sent to the Board, which deals with it as the directors consider necessary"], "a": 0, "e": "The branch auditor reports to the company's (principal) auditor, who incorporates it."}, {"c": "Branch audit", "t": "Branch &amp; Joint Audit", "q": "For branch offices in India or abroad, §128(2) requires:", "o": ["Summarised books at the branch and full returns to the auditor", "Proper books at the branch and annual audit by the Registrar", "Proper books at the branch and summarised returns to the registered office", "All books at the registered office and no books kept at the branch"], "a": 2, "e": "Branch books + periodic summarised returns to the registered office."}, {"c": "Branch audit", "t": "Branch &amp; Joint Audit", "q": "Books of account may be kept at another place in India if:", "o": ["The auditor decides so and the Registrar is notified within 7 days", "The Board decides so and the Registrar is notified within 7 days", "The Board decides so and the Registrar approves it within 30 days", "The members decide so and the Registrar is notified within 30 days"], "a": 1, "e": "§128(1): Board decision + notice to the Reg ported in the year, with nature and amount", "Only frauds above ₹1 crore noticed or reported in the year, with nature and amount"], "a": 0, "e": "CARO fraud reporting is wide; §143(12) deals with reporting to authorities."}, {"c": "(xii) Nidhi", "t": "CARO 2020", "q": "A Nidhi company must maintain Net Owned Funds to Deposits of:", "o": ["1:5", "1:50", "1:20", "1:10"], "a": 2, "e": "Also 10% unencumbered term deposits (Nidhi Rules, 2014) and no default on deposits."}, {"c": "(xiii) RPT", "t": "CARO 2020", "q": "Clause (xiii) on related party transactions checks compliance with:", "o": ["§135 and §192, and disclosure in the FS", "§73 to §76, and disclosure in the FS", "§185 and §186, and disclosure in the FS", "§177 and §188, and disclosure in the FS"], "a": 3, "e": "RPT: §177 (audit committee) and §188; disclosure per applicable standards."}, {"c": "(xiv) Internal audit", "t": "CARO 2020", "q": "Clause (xiv) asks whether the company has:", "o": ["An internal audit system commensurate with its size, with reports considered", "An internal audit covering all branches, with reports sent to members", "An internal audit outsourced to a firm, with reports sent to the Registrar", "An internal audit conducted by a chartered accountant, with reports filed"], "a": 0, "e": "Commensurate system + internal auditor's reports considered by the statutory auditor."}, {"c": "(xv) Non-cash", "t": "CARO 2020", "q": "Clause (xv) concerns non-cash transactions with:", "o": ["Employees or their families, per §186", "Directors or connected persons, per §192", "Lenders or their nominees, per §185", "Customers or their agents, per §188"], "a": 1, "e": "§192 restricts non-cash transactions involving directors."}, {"c": "(xvi) RBI", "t": "CARO 2020", "q": "Clause (xvi) requires reporting on:", "o": ["Deposits accepted from the public", "Cash losses of the current and preceding years", "§45-IA registration and RBI prudential norms", "Foreign exchange violations under FEMA"], "a": 2, "e": "NBFC-related: registration and prudential norms."}, {"c": "(xvii) Cash losses", "t": "CARO 2020", "q": "Cash losses under clause (xvii) are reported for:", "o": ["The period since the incorporation of the company", "The current year and the immediately preceding year", "The last three years taken together", "The current year alone, without any comparison"], "a": 1, "e": "Report if cash losses were incurred in current and immediately preceding year, with amounts."}, {"c": "(xviii) Resignation", "t": "CARO 2020", "q": "Clause (xviii) asks whether:", "o": ["The statutory auditors were reappointed and their fees were fixed", "The internal auditors resigned and their concerns were addressed", "The cost auditors resigned and their concerns were addressed", "The statutory auditors resigned and their concerns were addressed"], "a": 3, "e": "Resignation of statutory auditors and issues raised by the outgoing auditors."}, {"c": "(xix) Going concern", "t": "CARO 2020", "q": "Clause (xix) addresses:", "o": ["Material uncertainty about going concern ability", "Cash losses in the current and preceding years", "Fraud noticed or reported during the year", "Default in repayment of loans or payment of interest"], "a": 0, "e": "Clause (xix): going concern material uncertainty (consistent with SA 570)."}, {"c": "(xx) CSR", "t": "CARO 2020", "q": "Clause (xx) requires reporting:", "o": ["CSR compliance under §135 and the details of beneficiaries", "CSR compliance under §135 and the opinion of an expert", "CSR compliance under §135 and the amounts spent on overheads", "CSR compliance under §135 and transfer of any unspent amount"], "a": 3, "e": "Unspent CSR amount and its transfer to the specified fund/account."}, {"c": "(xxi) CFS", "t": "CARO 2020", "q": "Clause (xxi) is relevant to:", "o": ["Standalone FS — qualifications in the main audit opinion", "Consolidated FS — qualifications in CARO reports of included companies", "Cost audit reports — qualifications by the cost auditor", "Internal a   const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
</body>
