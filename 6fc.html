<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>CA Inter · Audit — Chapter 6 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --card:#FFFFFF; --ink:#222A35; --muted:#6A7180;
    --navy:#1F3864; --navy2:#284a82; --accent:#2E75B6; --gold:#BF8F00;
    --green:#2F7D32; --green-bg:#E7F2E3; --red:#B23A2E; --red-bg:#FBE9E6;
    --soft:#EBF0F8; --line:#E4DFD4; --shadow:0 10px 30px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Mulish',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbfaf6 0%, rgba(251,250,246,0) 60%),
      repeating-linear-gradient(135deg, rgba(31,56,100,.020) 0 2px, transparent 2px 22px),
      var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:520px;padding:14px 16px 28px;display:flex;flex-direction:column;min-height:100dvh}

  /* Header */
  header{padding:6px 2px 12px}
  .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .ttl{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:25px;line-height:1.1;margin:3px 0 0;letter-spacing:-.01em}
  .ttl b{color:var(--gold);font-weight:600}
  .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e6e2d8;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .35s ease}
  .count{font-weight:800;color:var(--navy);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;color:var(--green);font-size:13px;white-space:nowrap}

  /* Card */
  .stage{flex:1;display:flex;align-items:flex-start;padding-top:6px}
  .card{
    width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid #efece4;overflow:hidden;position:relative;animation:pop .32s cubic-bezier(.2,.7,.2,1)
  }
  .card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--navy),var(--accent) 60%,var(--gold))}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card.swipe-l{animation:outL .22s ease forwards}
  .card.swipe-r{animation:outR .22s ease forwards}
  @keyframes outL{to{opacity:0;transform:translateX(-26px)}}
  @keyframes outR{to{opacity:0;transform:translateX(26px)}}
  .cbody{padding:18px 18px 20px}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
    color:#7a5c00;background:#FBF1D2;border:1px solid #efdfa6;padding:5px 10px;border-radius:99px}
  .qno{float:right;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .q{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.42;color:var(--navy);margin:14px 0 16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    background:#fbfaf7;border:1.5px solid #e7e2d8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);
    font-size:14.5px;line-height:1.34;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.992)}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--navy);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.dim{opacity:.62}
  .opt[disabled]{cursor:default}

  .exp{margin-top:15px;border-radius:13px;background:linear-gradient(180deg,#f6f9ff,#eef3fb);
    border:1px solid #d7e3f5;border-left:5px solid var(--accent);padding:13px 14px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,margin .3s ease}
  .exp.show{max-height:420px;opacity:1}
  .exp .verdict{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
  .exp p{margin:0;font-size:14px;line-height:1.5;color:#33404f}
  .exp .ans{color:var(--navy);font-weight:700}

  /* Controls */
  .controls{margin-top:16px;display:flex;align-items:center;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px 12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;
    transition:transform .08s,filter .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn.prev{flex:none;width:54px;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn.next{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(31,56,100,.25)}
  .btn.next:disabled{opacity:.45;box-shadow:none}
  .btn.reveal{background:#fff;border:1.5px solid var(--gold);color:#7a5c00;flex:none;width:auto;padding:14px 16px}
  .tools{margin-top:11px;display:flex;justify-content:center;gap:18px}
  .tool{background:none;border:none;font:inherit;font-weight:700;font-size:12.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
  .tool:active{color:var(--navy)}
  .tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .hint{text-align:center;color:#9a9384;font-size:11.5px;margin-top:14px;letter-spacing:.02em}

  /* Done screen */
  .done{width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid #efece4;
    padding:30px 22px;text-align:center;animation:pop .35s ease}
  .done .big{font-family:'Fraunces',serif;font-size:54px;font-weight:600;color:var(--navy);line-height:1}
  .done .big small{font-size:24px;color:var(--muted)}
  .done h2{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);margin:6px 0 2px;font-size:23px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 18px}
  .done .row{display:flex;gap:10px}
  .ring{width:118px;height:118px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) var(--deg,0deg), #ece7da 0deg)}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #efece4}
  .hidden{display:none!important}

  .hbar{ display:flex; align-items:center; gap:10px; }
  .htext{ flex:1; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; object-fit:cover; border:2px solid #BF8F00; box-shadow:0 2px 6px rgba(0,0,0,.28); }

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}

  .exp.show{max-height:700px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px 'Mulish',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:700;margin-left:3px}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.on small{color:#cfd9ee}
</style>
</head>

<script>
const DECK = [{"c": "Meaning", "t": "Meaning &amp; Objective", "q": "Audit documentation is best described as the record of:", "o": ["Accounting entries passed, balances finalised and reports issued", "Client transactions recorded, vouchers filed and ledgers closed", "Management decisions taken, controls designed and policies adopted", "Audit procedures performed, evidence obtained and conclusions reached"], "a": 3, "e": "Also called working papers."}, {"c": "Meaning", "t": "Meaning &amp; Objective", "q": "Terms such as 'working papers' or 'work papers' are used to describe:", "o": ["The management representation letter", "The audit programme only", "Audit documentation", "The financial statements audited"], "a": 2, "e": "Same concept."}, {"c": "Objective", "t": "Meaning &amp; Objective", "q": "The auditor prepares documentation to provide a sufficient and appropriate record of:", "o": ["The basis for the management's estimates", "The basis for the auditor's report", "The basis for the audit fee charged", "The basis for the entity's accounting policies"], "a": 1, "e": "Plus evidence that the audit was planned and performed per SAs."}, {"c": "Objective", "t": "Meaning &amp; Objective", "q": "Documentation serves as evidence that the audit was:", "o": ["Planned and performed per SAs and applicable legal requirements", "Supervised by the partner of the firm at every stage of the audit", "Reviewed and approved by the board and those charged with governance", "Completed within the budgeted time and fees agreed with the client"], "a": 0, "e": "Compliance evidence."}, {"c": "Objective", "t": "Meaning &amp; Objective", "q": "Which is NOT an objective of preparing audit documentation?", "o": ["Evidencing the basis of the conclusions on overall objectives", "Enabling the management to rely on it for preparing the FS", "Providing a record of the basis for the auditor's report", "Providing evidence of compliance with SAs and the law"], "a": 1, "e": "Documentation is for the auditor, not a substitute for management's records."}, {"c": "Purpose", "t": "Purpose", "q": "Which is a purpose of audit documentation?", "o": ["Enabling the management to prepare the accounts", "Reducing the audit fee payable by the client", "Assisting the team to plan and perform the audit", "Replacing the need for a management representation"], "a": 2, "e": "Also direction, supervision and review."}, {"c": "Purpose", "t": "Purpose", "q": "Documentation helps the engagement team become accountable for:", "o": ["The client's internal controls", "The client's compliance with laws", "The client's accounting records", "Its own work"], "a": 3, "e": "Accountability."}, {"c": "Purpose", "t": "Purpose", "q": "Retaining a record of matters of continuing significance helps in:", "o": ["Future audits", "Framing the client's accounting policies", "Preparation of the client's budgets", "Fixing the client's dividend policy"], "a": 0, "e": "Continuing significance."}, {"c": "Purpose", "t": "Purpose", "q": "Quality control reviews and inspections under SQC 1 are facilitated by:", "o": ["Audit documentation", "The engagement letter alone", "Management representation", "The client's board minutes"], "a": 0, "e": "External inspections are also supported."}, {"c": "Purpose", "t": "Purpose", "q": "Which is NOT a purpose of audit documentation?", "o": ["Supporting external inspections under law or regulation", "Enabling the entity to avoid statutory audit in later years", "Facilitating quality control reviews under SQC 1", "Helping team members direct, supervise and review the work"], "a": 1, "e": "Others are purposes."}, {"c": "Experienced auditor", "t": "Form, Content &amp; Extent", "q": "The test for the extent of documentation is whether it enables:", "o": ["The regulator to approve the audit report issued by the firm", "The management of the entity to understand the audit findings", "An experienced auditor with no previous connection to understand the audit", "The engagement partner of the same audit to recollect the audit"], "a": 2, "e": "Experienced-auditor test."}, {"c": "Experienced auditor", "t": "Form, Content &amp; Extent", "q": "The experienced auditor should understand the nature, timing and extent of procedures, the results and:", "o": ["Client's business plans, projections and expansion strategy decisions", "Audit fee, billing and timing of collection from the client entity", "Reasons for the selection of the auditor by the members of the entity", "Significant matters, conclusions and significant professional judgments"], "a": 3, "e": "SA 230 requirement."}, {"c": "Experienced auditor", "t": "Form, Content &amp; Extent", "q": "While documenting the nature, timing and extent of procedures, which is NOT required to be recorded?", "o": ["Identifying characteristics of items tested", "Who reviewed the work, when and to what extent", "Who performed the work and when completed", "The audit fee agreed with the client"], "a": 3, "e": "Three specific records required."}, {"c": "Experienced auditor", "t": "Form, Content &amp; Extent", "q": "Recording who performed the work and the date of completion helps in:", "o": ["Computing the audit fee and billing the client on time", "Establishing accountability and tracing the audit trail", "Assessing the competence of the client's staff involved", "Evidencing that the client has cooperated fully in the audit"], "a": 1, "e": "Details."}, {"c": "Experienced auditor", "t": "Form, Content &amp; Extent", "q": "For a sample of purchase orders tested, the identifying characteristic could be:", "o": ["The purchase order number", "The fee for the audit of the year", "The name of the audit partner", "The date of appointment of the auditor"], "a": 0, "e": "Identify the specific item tested."}, {"c": "Significant matters", "t": "Form, Content &amp; Extent", "q": "The auditor must document discussions of significant matters with:", "o": ["Management only, since the others are not concerned with it", "The engageme nges can be made to documentation during final assembly only if they are:", "o": ["Administrative, e.g. indexing and cross-referencing", "Substantive, e.g. fresh procedures and conclusions", "Requested by the management of the entity", "Approved by the audit committee of the entity"], "a": 0, "e": "Administrative changes only."}, {"c": "Assembly", "t": "Assembly, Retention &amp; Ownership", "q": "Which of the following changes is permissible during final assembly?", "o": ["Adding new conclusions after the report", "Adding new substantive procedures", "Deleting superseded working papers", "Cross-referencing working papers"], "a": 3, "e": "Deleting is not permitted before retention ends."}, {"c": "Retention", "t": "Assembly, Retention &amp; Ownership", "q": "Audit documentation should be retained for at least:", "o": ["Seven years from the date of the auditor's report", "Five years from the date of the auditor's report", "Three years from the end of the financial year", "Ten years from the date of the auditor's report"], "a": 0, "e": "Retention period under SQC 1."}, {"c": "Retention", "t": "Assembly, Retention &amp; Ownership", "q": "In the case of a group audit, the retention period of seven years runs from:", "o": ["The date of the auditor's or group auditor's report, whichever is earlier", "The date of the auditor's or group auditor's report, whichever is later", "The date of the AGM at which the group accounts are adopted", "The end of the financial year of the group entity audited"], "a": 1, "e": "Whichever is later."}, {"c": "Retention", "t": "Assembly, Retention &amp; Ownership", "q": "Once the final audit file is assembled, documentation:", "o": ["May be discarded after the annual general meeting is held", "May be discarded at the request of the client of the firm", "Must not be deleted or discarded before the retention period ends", "May be discarded after 60 days from the date of the report"], "a": 2, "e": "No deletion."}, {"c": "Retention", "t": "Assembly, Retention &amp; Ownership", "q": "Which statement on the 60 days and seven years is correct?", "o": ["60 days is for assembly; seven years is for retention", "60 days is for retention; seven years is for assembly", "Both relate to the assembly of the final audit file", "Both relate to the retention of the audit file"], "a": 0, "e": "Mix-up is common."}, {"c": "Ownership", "t": "Assembly, Retention &amp; Ownership", "q": "As per SQC 1, audit documentation is the property of:", "o": ["The client, unless the auditor and the client agree otherwise", "The audit committee, unless the board of directors decides", "The regulator, unless the entity applies for return of them", "The auditor, unless law or regulation specifies otherwise"], "a": 3, "e": "Auditor's property."}, {"c": "Ownership", "t": "Assembly, Retention &amp; Ownership", "q": "The auditor may share portions of audit documentation with the client if doing so does not compromise:", "o": ["The fee payable by the client or the interest of the auditor", "The appointment of the auditor or the term of the engagement", "The validity of the work or, in assurance engagements, independence", "The disclosure of the financial results or the date of the report"], "a": 2, "e": "Discretionary disclosure."}, {"c": "Ownership", "t": "Assembly, Retention &amp; Ownership", "q": "A client demands the auditor's working papers as a matter of right. The auditor:", "o": ["Must hand over, if the audit committee asks for them", "Is not bound to hand over, as they are the auditor's property", "Must hand over, as they are the client's property", "Must hand over, if the fees are paid in full to the firm"], "a": 1, "e": "Discretion unless law requires."}, {"c": "Judgement", "t": "Form, Content &amp; Extent", "q": "Documenting significant professional judgements helps to:", "o": ["Reduce the extent of audit procedures to be performed by the team", "Explain the auditor's conclusions and strengthen the judgement quality", "Shift the responsibility for the judgements to the management", "Avoid review by the engagement quality control reviewer"], "a": 1, "e": "Section 7."}, {"c": "Judgement", "t": "Form, Content &amp; Extent", "q": "The assessment of whether a matter is significant requires:", "o": ["The consent of the management to the assessment made", "A uniform checklist applicable to all audit engagements", "An objective analysis of the facts and circumstances", "The approval of the regulator of the matters decided"], "a": 2, "e": "Objective analysis."}, {"c": "Judgement", "t": "Form, Content &amp; Extent", "q": "The degree of professional judgement involved in the work influences:", "o": ["The fee for the audit and the appointment of the team", "The date of the report and the place of its signing", "The frequency of AGM and the notice period to members", "The form, content and extent of the documentation"], "a": 3, "e": "Judgement drives documentation."}, {"c": "Completion memo", "t": "Form, Content &amp; Extent", "q": "A completion memorandum is a tool that gives:", "o": ["A concise overview of significant matters and how they were addressed", "A detailed list of all transactions tested and the sample selected", "A summary of the fees billed and the time spent on the audit", "A copy of the financial statements with the auditor's comments"], "a": 0, "e": "Audit documentation summary."}, {"c": "Completion memo", "t": "Form, Content &amp; Extent", "q": "A completion memorandum assists the auditor in considering whether:", "o": ["All the controls of the entity are operating effectively", "All the management's estimates are the correct ones", "All the transactions of the entity have been recorded", "All relevant SA objectives have been met"], "a": 3, "e": "Benefits."}, {"c": "Completion memo", "t": "Form, Content &amp; Extent", "q": "A completion memorandum is particularly useful in:", "o": ["Large and complex audits, to facilitate review and inspection", "Small audits, to eliminate the need for review  working paper two months after assembly. The auditor should:", "o": ["Allow it, as the 60-day assembly window has now closed", "Allow it, if the engagement partner approves the deletion", "Not allow it, as deletion is barred before retention ends", "Allow it, if the paper is not relevant to the conclusion"], "a": 2, "e": "Retention."}, {"c": "Scenario", "t": "Scenarios", "q": "A junior records only 'checked' against a sample, with no item details. This fails the requirement to record:", "o": ["Identifying characteristics of the specific items tested", "The rotation schedule of the team members of the audit", "The details of the regulatory filings by the entity", "The audit fee and billing particulars of the engagement"], "a": 0, "e": "Documentation details."}, {"c": "Scenario", "t": "Scenarios", "q": "A file note reads 'discussed with management; no issues'. What is missing?", "o": ["Nature of the matter, date, and the person it was discussed with", "The accounting policy, the tax effect and the dividend impact", "The auditor's independence declaration and engagement letter", "The fee, the time spent and the billing details of the discussion"], "a": 0, "e": "Significant matter discussions."}];

const LAB=['A','B','C','D'];
let cur='All', order=[], pos=0;
const answered=new Array(DECK.length).fill(null);
const $=id=>document.getElementById(id);
const stage=$('stage'),navwrap=$('navwrap'),elProg=$('prog'),elCount=$('count'),elScore=$('score'),
      btnPrev=$('prev'),btnNext=$('next'),btnReveal=$('reveal'),chipsEl=$('chips');
function build(shuf){
  order=[];DECK.forEach((c,i)=>{if(cur==='All'||c.t===cur)order.push(i);});
  if(shuf){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;
}
function drawChips(){
  const tags=['All',...new Set(DECK.map(c=>c.t))];
  chipsEl.innerHTML=tags.map(t=>{const n=t==='All'?DECK.length:DECK.filter(c=>c.t===t).length;
    return `<button class="chip${t===cur?' on':''}" data-t="${t.replace(/"/g,'&quot;')}">${t}<small>${n}</small></button>`}).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.t;navwrap.classList.remove('hidden');build(false);drawChips();render(true);});
}
function correctCount(){let n=0;order.forEach(i=>{if(answered[i]===DECK[i].a)n++});return n;}
function attempted(){return order.filter(i=>typeof answered[i]==='number').length;}
function render(){
  if(pos>=order.length)return finish();
  const di=order[pos],card=DECK[di],chosen=answered[di],locked=chosen!==null;
  elProg.style.width=(pos/order.length*100)+'%';
  elCount.textContent=(pos+1)+' / '+order.length;
  elScore.textContent='✓ '+correctCount();
  const opts=card.o.map((txt,i)=>{let cls='opt';
    if(locked){if(i===card.a)cls+=' correct';else if(typeof chosen==='number'&&i===chosen)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-i="${i}" ${locked?'disabled':''}><span class="lab">${LAB[i]}</span><span>${txt}</span></button>`}).join('');
  let verdict='';
  if(locked){verdict=chosen==='reveal'?'<div class="verdict ok">Answer</div>':(chosen===card.a?'<div class="verdict ok">✓ Correct</div>':'<div class="verdict no">✗ Not quite</div>');}
  stage.innerHTML=`<div class="card" id="card"><div class="cbody"><span class="pill">${card.c}</span><span class="qno">Q ${pos+1}</span>
    <div class="q">${card.q}</div><div class="opts">${opts}</div>
    <div class="${locked?'exp show':'exp'}">${verdict}<p><span class="ans">Answer: ${LAB[card.a]}.</span> ${card.e}</p></div></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  btnPrev.disabled=pos===0;btnNext.disabled=!locked;
  btnNext.textContent=(pos===order.length-1)?'Finish':'Next ›';
  btnReveal.style.visibility=locked?'hidden':'visible';
}
function choose(i){const di=order[pos];if(i>3||answered[di]!==null)return;answered[di]=i;render();}
function reveal(){const di=order[pos];if(answered[di]!==null)return;answered[di]='reveal';render();}
function go(d,dir){const c=$('card');if(c&&dir)c.classList.add(dir==='next'?'swipe-l':'swipe-r');
  setTimeout(()=>{pos=Math.max(0,Math.min(order.length,pos+d));render();window.scrollTo({top:0,behavior:'smooth'});},dir?170:0);}
function finish(){
  elProg.style.width='100%';elCount.textContent=order.length+' / '+order.length;
  const att=attempted(),cor=correctCount(),pct=att?Math.round(cor/att*100):0;
  elScore.textContent='✓ '+cor;navwrap.classList.add('hidden');
  stage.innerHTML=`<div class="done"><div class="ring" style="--deg:${pct*3.6}deg"><div class="inner"><div><div class="big">${pct}<small>%</small></div></div></div></div>
  <h2>${cur==='All'?'Deck':'Topic'} complete</h2><p>${cor} correct out of ${att} attempted · ${order.length} cards${cur==='All'?'':' ('+cur+')'}</p>
  <div class="row"><button class="btn next" id="again">Restart</button><button class="btn reveal" id="shuf2" style="width:auto">Shuffle &amp; retry</button></div></div>`;
  $('again').onclick=()=>restart(false);$('shuf2').onclick=()=>restart(true);
}
function restart(shuf){order.forEach(i=>answered[i]=null);navwrap.classList.remove('hidden');build(shuf);render();window.scrollTo({top:0});}
btnPrev.onclick=()=>go(-1,'prev');btnNext.onclick=()=>go(1,'next');btnReveal.onclick=reveal;
$('shuffle').onclick=()=>restart(true);$('restart').onclick=()=>restart(false);
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!btnNext.disabled)go(1,'next');else if(dx>0&&pos>0)go(-1,'prev');}},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&!btnNext.disabled)go(1,'next');
  if(e.key==='ArrowLeft'&&pos>0)go(-1,'prev');
  if(['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(e.key.toLowerCase()==='r')reveal();});
build(false);drawChips();render();
</script>
